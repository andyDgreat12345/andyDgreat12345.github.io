name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild after every heartbeat so /hq reflects the current board rather than
  # the last code change. The `pages` concurrency group below means an overlapping
  # rebuild cancels the older one, so a slow build cannot pile up.
  workflow_run:
    workflows: ["Company heartbeat"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        env:
          # /hq reads the board at build time. The token lifts the API rate limit
          # and COMPANY_PAUSED is the same value the dispatcher reads, so the
          # page and the heartbeat cannot disagree about whether work is running.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANY_PAUSED: ${{ vars.COMPANY_PAUSED }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
