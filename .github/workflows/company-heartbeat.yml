name: Company heartbeat

# The company's clock. Every 15 minutes it reads the board, triages new tickets,
# claims work for the roles that have workers, reaps dead leases, and logs the
# decision to the day's shift report issue.
#
# It starts no work directly. It applies a `claim:<role>` label, and the worker
# wakes on that label — see company-engineer.yml. The heartbeat never calls a
# model and never runs an agent.
#
# NOTE: scheduled workflows only fire from the repository's DEFAULT branch. This
# will not run on the feature branch — merge it first, then use the manual
# `workflow_dispatch` run below to check it before trusting the schedule.
#
# THE KILL SWITCH: set the repository variable COMPANY_PAUSED to 1
# (Settings → Secrets and variables → Actions → Variables) and the dispatcher
# reports but starts nothing. That page works fine on an iPad.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write labels and post the heartbeat comment"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write        # triage labels + the shift report
  pull-requests: read  # WIP limit needs the count of PRs in review

concurrency:
  group: company-heartbeat
  cancel-in-progress: false   # never kill a run mid-triage

jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.dispatch.outputs.plan }}
      paused: ${{ steps.dispatch.outputs.paused }}
    steps:
      - uses: actions/checkout@v4

      - id: dispatch
        env:
          # PAT_TOKEN, not GITHUB_TOKEN, and this is the whole ball game.
          #
          # A label applied with GITHUB_TOKEN does NOT trigger other workflows —
          # GitHub does this deliberately to stop runaway loops. The engineer
          # wakes on `issues.labeled`. So claiming a ticket with the default
          # token applies the label and wakes nothing: the board looks busy, the
          # heartbeat looks green, and no work ever starts.
          #
          # Falls back so the company still triages without a PAT; the report
          # says loudly when it is running in that state.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          COMPANY_CLAIMS_WAKE_WORKERS: ${{ secrets.PAT_TOKEN != '' && 'yes' || 'no' }}
          COMPANY_PAUSED: ${{ vars.COMPANY_PAUSED }}
        run: |
          python3 company/ops/dispatch.py \
            ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # The fan-out is no longer here. It happens inside dispatch.py, which applies
  # the claim label — and the claim label is what wakes the worker, via
  # `issues.labeled` in company-engineer.yml. There is nothing for this job to
  # start; it prints the plan so a run's decision is legible at a glance.
  workers:
    needs: dispatch
    if: needs.dispatch.outputs.paused == 'false' && needs.dispatch.outputs.plan != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Show the routing plan
        run: echo '${{ needs.dispatch.outputs.plan }}' | python3 -m json.tool
