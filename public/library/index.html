<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate System — Library</title>
<style>
:root{--bg:#fff;--soft:#f6f7f9;--card:#fff;--bd:#e6e8eb;--ink:#1a1d21;--mut:#5b636c;--acc:#2f6df6;--accsoft:#eaf1ff;--pro:#2f8f5b;--con:#c0562e;--radius:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--soft:#12161c;--card:#161b22;--bd:#262c36;--ink:#e6edf3;--mut:#9aa4b2;--acc:#5b8cff;--accsoft:#17233d;--pro:#3fb27f;--con:#e0794e}}
*{box-sizing:border-box}body{margin:0;font:15px/1.65 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
#side{width:290px;flex:none;border-right:1px solid var(--bd);background:var(--soft);overflow:auto;padding:16px;position:sticky;top:0;height:100vh}
#side h1{font-size:15px;margin:2px 4px 10px}
#q{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--ink);margin-bottom:10px;font-size:13px}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:15px 4px 3px}
a.item{display:block;padding:5px 8px;border-radius:7px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13px}
a.item:hover{background:var(--accsoft)}a.item.on{background:var(--acc);color:#fff}
#main{flex:1;overflow:auto;padding:34px 46px;max-width:900px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:6px 0 22px}
.tile{border:1px solid var(--bd);border-radius:var(--radius);padding:14px 16px;background:var(--card)}
.tile b{font-size:26px;display:block;line-height:1}.tile span{font-size:12px;color:var(--mut)}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.rcard{border:1px solid var(--bd);border-radius:var(--radius);padding:14px 16px;background:var(--card)}
.rcard h4{margin:0 0 8px;font-size:14px}
.win{font-weight:700}.win.PRO{color:var(--pro)}.win.CON{color:var(--con)}
.jrow{display:flex;gap:6px;margin-top:8px}
.jcell{flex:1;text-align:center;border-radius:8px;padding:6px 2px;font-size:11px;border:1px solid var(--bd)}
.jcell .v{display:block;font-weight:700;font-size:13px;margin-top:2px}
.jcell.PRO{background:color-mix(in srgb,var(--pro) 14%,transparent)}.jcell.PRO .v{color:var(--pro)}
.jcell.CON{background:color-mix(in srgb,var(--con) 14%,transparent)}.jcell.CON .v{color:var(--con)}
#doc h1{font-size:25px;border-bottom:2px solid var(--bd);padding-bottom:8px}
#doc h2{font-size:19px;margin-top:28px}#doc h3{font-size:15px;margin-top:20px;color:var(--acc)}
#doc blockquote{border-left:3px solid var(--acc);margin:12px 0;padding:4px 14px;background:var(--soft);border-radius:5px;color:var(--mut)}
#doc code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:13px}
#doc pre{background:var(--soft);border:1px solid var(--bd);padding:12px;border-radius:8px;overflow:auto}
#doc table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}#doc th,#doc td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}#doc th{background:var(--soft)}
#doc a{color:var(--acc)}
.back{display:inline-block;margin-bottom:14px;color:var(--acc);text-decoration:none;font-size:13px}
@media(max-width:720px){#side{display:none}#main{padding:20px}}
</style></head><body>

<script>
const DOCS=[{"id": "d0", "title": "Handbook", "group": "Standards & method", "html": "<h1>Handbook</h1>\n<p>The rules every agent in this system follows, including the one doing the routing.</p>\n<p>If you are reading this as the orchestrator: <strong>you are not exempt.</strong> On 2026-07-17 the\norchestrator hand-cut two evidence cards, invented a conflict between them that did not\nexist, and graded one of them A when it was a B. An attacker agent caught all three.\nThat is the system working as designed, and it only worked because the attacker was not\nrequired to be polite to the person who wrote the cards. Nothing below has an exception\nfor whoever is in charge.</p>\n<hr />\n<h2>The two branches</h2>\n<p>This repo serves two different events that need opposite things. <strong>Do not load both\ncontexts at once.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>PF</strong> (<code>topics/</code>)</th>\n<th><strong>Congress</strong> (<code>congress/</code>)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Core problem</td>\n<td>research depth</td>\n<td>style and delivery</td>\n</tr>\n<tr>\n<td>Unit of work</td>\n<td>the resolution (monthly)</td>\n<td>the speech</td>\n</tr>\n<tr>\n<td>Output</td>\n<td>cards, cases, blocks</td>\n<td>voice, pacing, rhetoric</td>\n</tr>\n<tr>\n<td>Wins by</td>\n<td>evidence + clash</td>\n<td>articulation + ranking</td>\n</tr>\n</tbody>\n</table>\n<p>A PF card has no business in a Congress speech and vice versa. Cross-loading produces\nspeeches that sound like cases and cases that sound like speeches, and both lose.</p>\n<hr />\n<h2>Roles</h2>\n<p>Each role has one lane. Staying in it is what makes the output worth reading — an agent\ndoing three jobs badly is worse than three agents doing one each.</p>\n<table>\n<thead>\n<tr>\n<th>Role</th>\n<th>Job</th>\n<th>Persona?</th>\n<th>Must never</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Researcher</strong></td>\n<td>fetch, verify, cut cards</td>\n<td><strong>NO</strong></td>\n<td>assert an unfetched source</td>\n</tr>\n<tr>\n<td><strong>Case writer</strong></td>\n<td>speakable copy in our voice</td>\n<td><strong>YES</strong></td>\n<td>claim what has no card</td>\n</tr>\n<tr>\n<td><strong>Attacker</strong></td>\n<td>find the hole through one lens</td>\n<td>no — <em>structural</em></td>\n<td>manufacture an attack to seem useful</td>\n</tr>\n<tr>\n<td><strong>Frontliner</strong></td>\n<td>answer attacks inside the time budget</td>\n<td>no</td>\n<td>bluff an answer it does not have</td>\n</tr>\n<tr>\n<td><strong>Judge</strong></td>\n<td>react as a specific human would</td>\n<td><strong>YES</strong></td>\n<td>judge on a paradigm it wasn't given</td>\n</tr>\n<tr>\n<td><strong>Synthesizer</strong></td>\n<td>say what actually matters</td>\n<td>no</td>\n<td>flatter the work</td>\n</tr>\n<tr>\n<td><strong>Orchestrator</strong></td>\n<td>route, decide, report</td>\n<td>no</td>\n<td>exempt itself from this table</td>\n</tr>\n</tbody>\n</table>\n<h3>Why the persona column is not arbitrary</h3>\n<p>Measured, not guessed. Persona prompting is <strong>task-dependent</strong>:</p>\n<ul>\n<li><strong>Writing and role-play: helps.</strong> Case writers and judges get personas.</li>\n<li><strong>Factual retrieval: hurts.</strong> Telling a model \"you are an expert researcher\" <em>degrades</em>\n  its ability to retrieve facts it already has. No facts enter the weights; the framing\n  just gets in the way. Researchers stay clinical.</li>\n<li><strong>Attackers are the subtle one.</strong> They get a <em>lens</em>, not a personality. What makes an\n  attacker useful is that it has no stake in the case and only one job — that is\n  decomposition, not character. The best finding this system has produced (a contention\n  with no solvency step at all) came from an agent given a lens and no self.</li>\n</ul>\n<hr />\n<h2>Rules</h2>\n<h3>1. Evidence is fetched or it does not exist</h3>\n<p>No card without a source retrieved in-session. Not recalled, not reconstructed, not\ninferred from a search snippet. If it cannot be fetched, write the gap into the brief.\n<strong>A fabricated citation is a round loss and an integrity violation</strong> — it is the single\nworst thing this system can produce, and it is worse than producing nothing.</p>\n<h3>2. Report what you did not find</h3>\n<p>A brief that says \"looked for X, the literature doesn't support it\" is a good brief.\nFinding that our own argument has no evidence behind it is a <strong>good night's work</strong>.\nNever pad. Never manufacture significance. \"Nothing material today\" is a complete report.</p>\n<h3>3. No silent caps</h3>\n<p>If you bound coverage — fewer lenses, one round instead of loop-until-dry, top-N, a\nskipped stage — <strong>say so in the output.</strong> Silent truncation reads as \"covered\neverything\" when it didn't, and the reader cannot tell the difference. Log what was\ndropped.</p>\n<h3>4. Say the thing you don't want to say</h3>\n<p>Every brief names the attack we cannot answer. Every case lists its uncarded claims.\nEvery synthesis leads with what changed, not with a recap. A system that hides its worst\nfinding is worth nothing, because the only reason to run it is to hear that finding\nbefore an opponent says it out loud.</p>\n<h3>5. Budget models judge nothing</h3>\n<p>Measured 2026-07-17, identical prompt, a contention with no solvency step:</p>\n<table>\n<thead>\n<tr>\n<th>Model</th>\n<th>Verdict</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Frontier (Opus)</td>\n<td>missing step is <em>absent</em> + found the turn</td>\n</tr>\n<tr>\n<td>DeepSeek V4 Pro</td>\n<td><strong>\"fatal\"</strong> — found the step. Missed the turn.</td>\n</tr>\n<tr>\n<td>DeepSeek V4 Flash</td>\n<td><strong>\"severity: none — the link chain holds\"</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Flash <em>noticed</em> the missing step and reasoned itself out of it. That is the failure that\nmatters: not a weaker attack, but <strong>a clean bill of health on a broken case.</strong> You cannot\ntell \"found no holes\" from \"no holes found\" until an elim round tells you.</p>\n<p>Routing: <strong>research → <code>deepseek-v4-flash</code></strong> (fetching, not judging — see\n<code>run-nightly-research.ps1</code>). <strong>Attacks, judges, synthesis → frontier.</strong> V4 Pro is the\nabsolute floor and even it misses turns.</p>\n<h3>6. The budget law — GLOBAL ¥5 hard cap (enforced in code, cannot be bypassed)</h3>\n<p>The per-round cap (r1's lesson) FAILED in r2: resumes reset it (each app-restart gave\nthe round a fresh ¥5), and prep/research/reflection were separate scripts each with\ntheir own budget. ~¥14 vanished across one cycle while \"¥5 per round\" was nominally in\nforce. The fix (user directive 2026-07-19):</p>\n<ul>\n<li><strong>GLOBAL cap: ¥5.0 total across ALL DeepSeek work</strong> — every process, every resume,\n  prep + round + reflection + research together. Enforced by\n  <code>agent_loop.enforce_global_cap()</code>, called before every agent and between every step,\n  reading one shared ledger <code>deepseek_budget.json</code> {baseline, cap}. Once\n  (baseline − current balance) ≥ cap, <strong>every DeepSeek call raises BudgetExceeded and\n  refuses.</strong> Resumes cannot reset it; only a human calling\n  <code>agent_loop.set_global_cap(N)</code> does.</li>\n<li>The per-round structural caps still apply (top 3 args, 2 cycles, windows ≤3 fetches,\n  windows skip on low budget) — they keep a single cycle small so it fits inside the\n  global ¥5.</li>\n<li><strong>Every run logs to <code>costs.md</code>.</strong> Check the balance and the cap headroom before\n  starting; a run that cannot finish inside remaining cap does not start.</li>\n<li>Productivity first: do not spend tokens on simulation-mechanics polish, redundant\n  re-cutting of cards that already exist, or process trivia. Every DeepSeek call must\n  buy debate value.</li>\n</ul>\n<h3>6b. Two-tier files (user directive 2026-07-19)</h3>\n<ul>\n<li><strong>Client tier — <code>topics/&lt;slug&gt;/PREP.md</code></strong>: the ONLY file a human/client reads. It\n  holds the case (both sides), the block file, and the reflection improvements — in\n  plain debate language, no simulation jargon (no team names, no \"ballot\"/\"deep-clash\"/\n  \"terminal-state\" talk). Every reflection appends here in client language.</li>\n<li><strong>Working tier — everything else</strong> (<code>cases/</code>, <code>blocks/</code>, <code>evidence/</code>, <code>strategy.md</code>,\n  <code>rounds/</code>): the agents' material during rounds — deep research, full evidence,\n  strategy, transcripts. Verbose and mechanics-laden is fine here; humans don't read it.</li>\n</ul>\n<h3>7. Files are the memory</h3>\n<p>Models are <strong>stateless</strong>. Every call re-sends everything; nothing accumulates on any\nserver; a persona is rebuilt per call and gone when the response ends. <code>topics/</code> and\n<code>congress/</code> ARE the memory. This is why cards are one-per-file, briefs are dated and\nappend-only, and decisions get written down instead of remembered.</p>\n<p>Corollary: <strong>never rewrite history.</strong> When a card is found to be wrong, annotate the\nerror in place — do not silently delete it. The record of what we believed and when is\nitself evidence, and it is how we notice we have a pattern.</p>\n<hr />\n<h2>Standard shape of a working group</h2>\n<p>Both branches run the same skeleton. Only the nouns change.</p>\n<pre><code>INGEST      → verified raw material        (cut-cards / congress-ingest)\nANALYZE     → what does it actually say    (topic-analysis / congress-analyze)\nBUILD       → our artifact                 (write-case / congress-write)\nADVERSARY   → find the holes              (self-debate / [none yet — see below])\nSYNTHESIZE  → what matters, bluntly        (both)\n</code></pre>\n<p><strong>Congress has no adversary stage.</strong> That is a real asymmetry and it is honest: PF has an\nopponent whose job is to break your case, Congress has judges whose job is to rank you.\nDo not bolt a fake adversary onto Congress to make the diagram symmetrical. If a Congress\nadversary is ever built, it should model <em>ranking against other speakers</em>, not refutation.</p>"}, {"id": "d1", "title": "Client-file layout", "group": "Standards & method", "html": "<h1>Client-file standard (PF)</h1>\n<p>The user-facing prep. Written from a high-level PF debater's requirements\n(2026-07-19). Every topic's client tier is FOUR files, plus the working tier stays\nas-is. Agents read everything; users read only these four.</p>\n<h2>The four files (per topic)</h2>\n<pre><code>pro-case.md    con-case.md      — the constructive cases, contention-structured\npro-blocks.md  con-blocks.md    — rebuttal responses, organized by opposing argument\n</code></pre>\n<p>The old single <code>PREP.md</code> is replaced by these four. The <strong>improvement log is NOT in\nthem</strong> — it moves to the working tier (<code>rounds/improvement-log.md</code>). These files are a\n<em>self-improving accumulated</em> deliverable: after each simulation round they get better,\nbut the user does not see round-to-round diffs or \"r1/r2 improvements\" headers. No\nsimulation jargon (no team names, no ballot/deep-clash/terminal-state talk).</p>\n<h2>Case file structure (pro-case.md / con-case.md)</h2>\n<ol>\n<li><strong>Framework</strong> — the weighing mechanism, stated first.</li>\n<li><strong>Contentions, strongest first.</strong> The top contention(s) + framework form the actual\n   ~<strong>750-word / 4-minute</strong> read-aloud case. Weaker/backup contentions go below the\n   750-word line, clearly marked as alternates.\n   Every contention is standardized and must read as one fluent logical unit:\n   - <strong>Claim</strong> — the one-sentence assertion\n   - <strong>Warrant</strong> — <em>why it's true</em> (the reasoning)\n   - <strong>Link</strong> — how the resolution connects to the warrant\n   - <strong>Evidence</strong> — the card(s), named\n   - <strong>Impact</strong> — what happens, weighed on a named mechanism</li>\n</ol>\n<h2>Quantify (PF prizes numbers)</h2>\n<p>PF judges reward <strong>quantifiable evidence and quantified impacts</strong> — magnitudes, rates,\ndollar figures, counts, timeframes. Default to seeking and using numbers:\n- Prefer a carded statistic over an adjective; \"raises rates 15–40%\" beats \"raises\n  rates a lot.\" Impacts should carry a size, a scope (how many affected), and a\n  timeframe whenever the literature supports one.\n- The research stage must actively hunt quantified data, not just qualitative claims.\n- <strong>Topic-dependent exception:</strong> some resolutions are law/procedure/rights topics\n  (e.g. the war-powers constitutional reso) where the core clash is legitimacy and\n  mechanism, and hard numbers are genuinely scarce — there, do NOT force fake\n  precision; quantify what exists (deployment counts, compliance rates) and win the\n  rest on warrant/weighing. But for policy/econ/impact topics, uncarded or unquantified\n  impacts are a weakness to fix. When in doubt, get the number.\n3. <strong>Case strategy</strong> (written in the case file, at the bottom):\n   - The collapse plan.\n   - <strong>Adaptive tree</strong> — because either side may speak second, note how to flex on\n     hearing the opponent: \"IF opp runs X → switch to / add / lead contention Y.\"\n     After each simulation round, append what was learned about which contentions to\n     run against which opposing strategies.</p>\n<h2>Block file structure (pro-blocks.md / con-blocks.md)</h2>\n<p>Organized <strong>by opposing argument CATEGORY</strong> — universal to the argument + its warrant,\nNOT to the opponent's exact wording (see WRITING-STANDARD.md). One section per argument\nthey run, headed 'vs. <CATEGORY> (their warrant: <core reason>)'. Under each, <strong>typed\nresponses</strong> (PF taxonomy) so a debater finds the right tool fast:</p>\n<ul>\n<li><strong>TURN</strong> — their argument is offense for our side (link-turn / impact-turn)</li>\n<li><strong>DELINK</strong> — a step of their link chain is false</li>\n<li><strong>NON-UNIQUE</strong> — their impact happens in both worlds (kills their uniqueness)</li>\n<li><strong>INDICT</strong> — the evidence is bad (source/method/miscut/dated)</li>\n<li><strong>MITIGATE</strong> — reduce weight without refuting (weakest — support, not a lead)</li>\n<li><strong>OVERWEIGH</strong> — grant it, win the comparison on a named mechanism</li>\n<li><strong>FRONTLINE</strong> — the answer to their answer (2nd-line)</li>\n</ul>\n<p>Each response must be an actual ARGUMENT (reasoning + why + card), never a restated\nclaim. Each: text · card (named) or \"analytic\" · read-seconds. Stack responses that hit\nDIFFERENT parts of the link chain on big arguments. Full method: WRITING-STANDARD.md.</p>\n<h2>How the system maintains these</h2>\n<ul>\n<li><code>prep_team.py</code> (team prep) and <code>write-case</code> produce contentions in the\n  claim/warrant/link/evidence/impact format, ≤750 words for the read-aloud case.</li>\n<li>Reflection appends improvements INTO the four files seamlessly (no visible round\n  headers) and logs the mechanics separately in <code>rounds/improvement-log.md</code>.</li>\n<li>The case-strategy adaptive tree grows one entry per simulation round.</li>\n</ul>"}, {"id": "d2", "title": "Writing standard", "group": "Standards & method", "html": "<h1>PF writing standard — how to write cases and blocks</h1>\n<p>The required method for every case and block the system produces. Grounded in standard\nPF practice (speechanddebate.org, DebateDrills, Atlanta UDL) plus the user's corrections\n(2026-07-19). Read this before writing any argument. <code>CLIENT-FILES.md</code> governs the file\nlayout; THIS file governs the argument quality inside them.</p>\n<h2>The one rule everything else serves: write ARGUMENTS, not claims</h2>\n<p>A claim is a statement you assert. An argument is a claim + the reason it's true + proof\n+ why it matters. Never write a line that only asserts. Every point must answer <strong>\"why?\"</strong>\nand back it with evidence or explicit logic.</p>\n<ul>\n<li>❌ <em>Claim only:</em> \"The resolution has no emergency exception, so it's rigid.\"</li>\n<li>✅ <em>Argument:</em> \"The resolution bans all deployments and lists no emergency exception —\n  and when Congress wants exceptions it writes them explicitly [WPR §2(c) enumerates\n  three]. So the omission is deliberate, which means a president facing a genuine\n  attack must either break the law or wait — a delay that, in a missile-response\n  scenario, costs the initiative. [card]\"</li>\n</ul>\n<p>The second one has a warrant (why the omission is deliberate), evidence (WPR §2(c)), and\nan impact with a scenario. The first is just a claim wearing a conclusion.</p>\n<h2>Case: contention structure</h2>\n<p>A case = <strong>Framework → 2–3 Contentions → (weighing) → Conclusion</strong>. Each contention is\none grouped, labeled unit — group warrants and impacts under a topic, don't scatter them:</p>\n<pre><code>CONTENTION 1: &lt;TOPIC LABEL, e.g. &quot;Economic Harm&quot;&gt;\n  UNIQUENESS — the current state of the world (why the impact isn't already happening /\n               is about to change). Sets the baseline the other side must dispute.\n  LINK — how the resolution causes the change.\n  WARRANTS — the reasons the link is true. STACK them, each carded:\n      W1: &lt;reason + card&gt;\n      W2: &lt;reason + card&gt;\n      W3: &lt;reason + card&gt;\n  IMPACTS — why it matters, QUANTIFIED where the topic allows (size · scope · timeframe):\n      I1: &lt;impact + magnitude/number + weighing mechanism&gt;\n      I2: &lt;impact + …&gt;\n</code></pre>\n<p>Rules:\n- <strong>Strongest contention first.</strong> Framework + top contention(s) = the ~750-word / 4-min\n  read-aloud case. Weaker/backup contentions sit below the line.\n- <strong>Uniqueness is not optional.</strong> If you can't say why the impact isn't already happening,\n  the contention is non-unique on its face and any competent opponent kills it.\n- <strong>Impacts carry numbers</strong> when the literature has them (magnitude, how many affected,\n  how soon). On law/rights/procedure topics where numbers are scarce, quantify what\n  exists and win the rest on warrant + weighing — don't fake precision.\n- Every carded claim names its card file. Every uncarded claim is flagged.</p>\n<h2>Blocks: universal by argument, typed by response</h2>\n<p>A block answers an argument the opponent RUNS — written before the round. Two hard rules:</p>\n<p><strong>1. Universal to the argument, NOT word-specific.</strong> Do not write blocks against the\nopponent's exact phrasing. Write them against the <em>argument category and its warrant</em>, so\nthe block fires no matter how they word it.\n- ❌ <em>Word-specific:</em> \"When they say 'your statute has no exception'…\"\n- ✅ <em>Universal:</em> \"<strong>vs. their EMERGENCY-RIGIDITY argument</strong> (warrant: a general ban forces\n  the president to break the law or wait in a real attack) —\"</p>\n<p><strong>2. Every block is a typed response containing an actual argument.</strong> Pick the response\ntype, then make the argument (reasoning + card), not a restated claim. The PF response\ntypes, from strongest offense to weakest:</p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>What it does</th>\n<th>Shape</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>TURN</strong></td>\n<td>their argument is offense for OUR side (link-turn: the link runs backwards; impact-turn: the impact is good)</td>\n<td>\"Grant their link — it actually helps us, because <why> [card]\"</td>\n</tr>\n<tr>\n<td><strong>DELINK</strong></td>\n<td>one step of their link chain is false, so the impact never happens</td>\n<td>\"Their link assumes X→Y, but <why that step fails> [card]\"</td>\n</tr>\n<tr>\n<td><strong>NON-UNIQUE</strong></td>\n<td>their impact happens in BOTH worlds, so the resolution isn't the cause</td>\n<td>\"This already happens / happens anyway, because <why> [card]\"</td>\n</tr>\n<tr>\n<td><strong>INDICT</strong></td>\n<td>the evidence is bad (source, method, miscut, dated, misattributed)</td>\n<td>\"Their card is <flaw>, so it can't support <claim>\"</td>\n</tr>\n<tr>\n<td><strong>MITIGATE</strong></td>\n<td>reduce the weight/probability without refuting (weakest — use as support, not a lead)</td>\n<td>\"Even if true, it's smaller/slower because <why>\"</td>\n</tr>\n<tr>\n<td><strong>OVERWEIGH</strong></td>\n<td>grant it, win the comparison on a named mechanism</td>\n<td>\"Even granting it, we outweigh on <magnitude/prereq/timeframe> because <why>\"</td>\n</tr>\n<tr>\n<td><strong>FRONTLINE</strong></td>\n<td>the answer to their answer (2nd-line defense of your own point)</td>\n<td>\"When they respond <X>, we say <argument + card>\"</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Attack different parts of the link chain.</strong> For a big opposing argument, stack responses\nthat hit <em>different</em> places — uniqueness, link, warrant, impact — so one dropped response\ndoesn't save their whole argument. A block with a turn + a delink + an indict is far\nstronger than three mitigations.</p>\n<p><strong>Block layout in the file</strong> (per opposing argument):</p>\n<pre><code>### vs. &lt;OPPONENT ARGUMENT CATEGORY&gt; (their warrant: &lt;the core reason they give&gt;)\n- **TURN** — &lt;the argument: grant X, it helps us because Y&gt; · &lt;card | analytic&gt; · ~Ns\n- **DELINK** — &lt;the argument: step X→Y fails because Z&gt; · &lt;card | analytic&gt; · ~Ns\n- **INDICT** — &lt;the evidence flaw&gt; · ~Ns\n</code></pre>\n<h2>Checklist before any case/block ships</h2>\n<ul>\n<li>[ ] <strong>No card is used in a way its own <code>vulnerable-to</code> line forbids</strong> — read each\n      card's weakness before deploying it (don't cite a secondhand quote as primary,\n      don't lean on a card its own note flags as double-edged, e.g. Hulme).</li>\n<li>[ ] Every line answers \"why?\" and has evidence or explicit logic (no naked claims).</li>\n<li>[ ] Contentions grouped: topic → uniqueness → link → stacked warrants → weighed impacts.</li>\n<li>[ ] Impacts quantified where the topic allows.</li>\n<li>[ ] Blocks universal to the argument category, not the opponent's wording.</li>\n<li>[ ] Each block is a typed response (turn/delink/non-unique/indict/mitigate/overweigh).</li>\n<li>[ ] Big arguments answered at multiple points of the link chain.</li>\n<li>[ ] Read-aloud case ≤750 words; answers/pre-empts live in blocks, not the case.</li>\n</ul>\n<p>Sources: speechanddebate.org PF constructive outline; DebateDrills \"Mastering the\nRebuttals\"; Atlanta UDL \"Rebuttals &amp; Blocks\"; DebateUS terminology.</p>"}, {"id": "d3", "title": "Evidence standard", "group": "Standards & method", "html": "<h1>Evidence standard — how to cut a card</h1>\n<p>The required method for every card the system produces. Distilled from how top PF\ndebaters/coaches actually cut cards (Lawrence Zhou / VBI; NSDA Evidence Rules;\nspeechanddebate.org PF Lesson 5). Read this before cutting any card. Fabrication or\nmiscutting is the worst thing the system can do — it loses real rounds and gets reported.</p>\n<h2>Anatomy of a card (in this order)</h2>\n<pre><code>TAG          — one line: the claim this card proves, in the debater's words.\nCITATION     — verbal (read aloud): Author last name + year.\n               written (for the file): Author, full date, publication/source, title,\n               author QUALIFICATIONS, URL, date accessed, page/section.\nBODY         — the source's own words, copied as full paragraph(s), with the read-aloud\n               portion marked (we use **bold** for what's read; keep the rest for\n               context and verification).\nWARRANTS     — 1–3 bullet takeaways under the tag: WHY the card proves the claim.\nVULNERABLE-TO — the honest best attack on this card (source bias, method, date, n, etc.).\n</code></pre>\n<h2>The hard rules (violating these loses rounds)</h2>\n<ol>\n<li><strong>Fetched or it doesn't exist.</strong> Quote only from a source you actually retrieved this\n   session. Never reconstruct a citation from memory or a search snippet.</li>\n<li><strong>No paraphrasing in the card body.</strong> Direct quotation only — a paraphrase \"lacks the\n   authority that comes with direct quotations\" and can't be verified. (The <em>case</em> may\n   paraphrase; the <em>card</em> holds the verbatim.)</li>\n<li><strong>Copy full paragraphs; never start mid-sentence or mid-paragraph.</strong> \"It is usually\n   best to copy and paste more rather than less.\" Keep the full original text in the file.</li>\n<li><strong>No ellipses in the read/highlighted portion.</strong> Splicing across an ellipsis \"violates\n   NSDA evidence rules and you can lose rounds for doing this.\"</li>\n<li><strong>No clipping.</strong> Never mark as read anything you would skip. Read = highlighted, exactly.</li>\n<li><strong>No power-tagging.</strong> The tag may not claim more than the highlighted words support.\n   The tag must match what is actually read aloud.</li>\n<li><strong>Author qualifications are mandatory</strong> in the citation — \"researcher\" is not a\n   qualification; \"Professor of Atmospheric Science, MIT\" is. Quals are half a card's\n   weight in front of an evidence judge.</li>\n<li><strong>Provenance honesty — never cite a secondhand quote as if primary.</strong> If the card is\n   a quote pulled from an aggregator, a summary site, or another author quoting the\n   original (e.g. \"Madison via usconstitution.net,\" \"Eisenhower via Hess\"), the tag and\n   the in-speech citation must say so, and the <code>vulnerable-to</code> line must flag it. A\n   secondhand quote read as primary is an evidence-challenge loss waiting to happen —\n   upgrade to the primary source before circuit use, or cite the intermediary honestly.</li>\n</ol>\n<h2>Highlighting method</h2>\n<ul>\n<li>Copy the whole paragraph first.</li>\n<li>Cut it down to the <strong>shortest version that still contains the full warrant</strong> — only the\n  highlighted part is read, so trim ruthlessly, but never trim so far that the reasoning\n  (\"because…\", the causal step, the number) disappears.</li>\n<li>Keep the qualifier words the author used. Deleting \"may,\" \"in some cases,\" \"up to\" to\n  make a claim sound stronger is a miscut an evidence judge will punish.</li>\n</ul>\n<h2>What makes a strong card (grading)</h2>\n<ul>\n<li><strong>A:</strong> primary source, qualified author, recent, directly on point, method visible,\n  a real number.</li>\n<li><strong>B:</strong> reputable secondary, or primary but slightly off-point/dated.</li>\n<li><strong>C:</strong> advocacy org, op-ed, thin method, or the warrant needs a leap. Usable on a lay\n  panel; will get indicted on a technical one.</li>\n<li>Grade honestly. An inflated grade is how a case over-trusts a weak card (learned the\n  hard way in r1).</li>\n</ul>\n<h2>Tag examples</h2>\n<ul>\n<li>❌ power-tagged: \"Data centers will destroy the grid\" (card says rates fell modestly).</li>\n<li>✅ accurate: \"Data centers modestly LOWERED average retail rates 2015–24 (IV study).\"</li>\n</ul>\n<p>The tag is a promise. The highlighted text must keep it.</p>"}, {"id": "d4", "title": "Speech standard", "group": "Standards & method", "html": "<h1>Speech standard — how each PF speech wins</h1>\n<p>The required method for every speech in a round (and the burdens the round runner\nenforces). Distilled from NSDA PF materials and how top teams actually win close rounds.\nThis governs what each speech must DO; WRITING-STANDARD.md governs argument quality;\nEVIDENCE-STANDARD.md governs cards.</p>\n<h2>The flow (real NSDA order + each speech's job)</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Speech</th>\n<th>Time</th>\n<th>Its ONE job</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1–2</td>\n<td>Constructives</td>\n<td>4:00</td>\n<td>Read your case. Do not respond to the opponent (you haven't heard/aren't answering yet).</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Crossfire</td>\n<td>3:00</td>\n<td>Extract concessions. Every question aims at a \"yes\" you use later.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>1st Rebuttal</td>\n<td>4:00</td>\n<td>Attack the opponent's case, argument by argument, at multiple link-chain points.</td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>2nd Rebuttal</strong></td>\n<td>4:00</td>\n<td><strong>DUAL BURDEN: frontline the attacks on YOUR case AND attack theirs.</strong> Skipping the frontline concedes your case is beaten.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Crossfire</td>\n<td>3:00</td>\n<td>Lock in the concessions that set up summary.</td>\n</tr>\n<tr>\n<td>7</td>\n<td><strong>Summary</strong></td>\n<td>3:00</td>\n<td><strong>COLLAPSE + WEIGH + frontline.</strong> Go for your best path; drop the rest.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Summary</td>\n<td>3:00</td>\n<td>Same.</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Grand Crossfire</td>\n<td>3:00</td>\n<td>All four; final concession-hunting.</td>\n</tr>\n<tr>\n<td>10–11</td>\n<td><strong>Final Focus</strong></td>\n<td>2:00</td>\n<td><strong>NOTHING NEW. Weigh. Tell the story of why you win.</strong></td>\n</tr>\n</tbody>\n</table>\n<h2>The two rules that decide close rounds</h2>\n<ol>\n<li>\n<p><strong>The mirror rule (most-lost-round rule).</strong> Whatever you extend in <strong>Final Focus must\n   have been in your Summary.</strong> Judges will NOT vote on an argument that appears in Final\n   Focus but was dropped in Summary — even if the opponent never answered it. This is the\n   single most common way good teams lose rounds they should win. Corollary: Summary is\n   where you decide the whole back half — choose its contents as if they are the only\n   arguments in the round, because after Summary they are.</p>\n</li>\n<li>\n<p><strong>Collapse.</strong> By Summary you cannot cover everything and win. Pick the one path (usually\n   one contention + its weighing) most likely to win, invest everything there, and let the\n   rest go. Extending five arguments weakly loses to extending one argument completely.\n   Collapse to what you are <em>ahead</em> on, not what you <em>like</em>.</p>\n</li>\n</ol>\n<h2>Frontlining (the skill that saves your case)</h2>\n<p>To \"frontline\" = answer the opponent's rebuttal responses to YOUR argument, so your\nargument survives to be extended. Order of operations in 2nd rebuttal and summary:\n1. Frontline your own case first (rebuild what they attacked), THEN\n2. Extend it (re-explain the warrant + impact as it now stands), THEN\n3. Weigh it against theirs.\nA frontline must fit the time budget — a 90-second answer to one attack is not a\nfrontline. If you cannot answer an attack briefly, that argument is probably not your\ncollapse.</p>\n<h2>Weighing (how close rounds are actually decided)</h2>\n<p>Weighing = telling the judge WHY your impact matters more, comparatively, on a named\nmechanism. Do it explicitly; never assume the judge weighs for you. The mechanisms:\n- <strong>Magnitude</strong> — how big (lives, dollars, scope of people affected).\n- <strong>Probability</strong> — how likely the impact actually happens (a demonstrated harm beats a\n  speculative one — this decided both war-powers practice rounds).\n- <strong>Timeframe</strong> — how soon; near-term impacts can outweigh larger distant ones.\n- <strong>Reversibility</strong> — a permanent harm outweighs a recoverable one.\n- <strong>Prerequisite / clash</strong> — \"our impact must be solved first,\" or \"even if theirs is\n  bigger, ours controls whether theirs happens at all.\"\n- <strong>Scope</strong> — how many, how broadly.\n\"The team that explains the comparison more clearly in Summary + Final Focus takes most\nclose rounds.\" Name the mechanism, do the comparison, repeat it verbatim in Final Focus.</p>\n<h2>Judge adaptation (from our own round data)</h2>\n<ul>\n<li><strong>Lay judge:</strong> plain story, legitimacy/values, trust. Jargon and dodging a plain\n  question read as evasion. Never say \"solvency\"/\"delink\"/\"non-unique\" — say what it means.</li>\n<li><strong>Flow judge:</strong> collapse discipline, no dropped args, comparative weighing, no false\n  drops (claiming they conceded something they answered). The mirror rule is enforced hard.</li>\n<li><strong>Evidence judge:</strong> verbatim-faithful cards, author quals, no overclaim. Turning the\n  opponent's own author is the highest-value move.\nCase selection is judge selection — scout the panel, lead the case that fits it.</li>\n</ul>"}, {"id": "d5", "title": "Style standard", "group": "Standards & method", "html": "<h1>Style standard — reasoning, structure, wording, vocabulary</h1>\n<p>The delivery layer: how a speech is reasoned, ordered, and phrased so it lands. Read\nalongside WRITING-STANDARD (argument content), SPEECH-STANDARD (speech burdens), and\nEVIDENCE-STANDARD (cards). Grounded in the Toulmin warrant model and standard PF\nsignposting practice. Every speech the system writes follows this.</p>\n<h2>1. Reasoning — make the logic airtight</h2>\n<p>An argument is only as strong as its <strong>warrant</strong> — the logical bridge that says <em>why</em> the\nevidence proves the claim. Amateurs assume the warrant; champions state it.</p>\n<ul>\n<li><strong>Show every step. Assume nothing.</strong> Never jump claim→impact. Spell the chain:\n  <em>A happens → which causes B → which causes C → which is the impact.</em> If a step is\n  unstated, an opponent delinks there.</li>\n<li><strong>Name the warrant's type</strong>, because that's how you defend it:</li>\n<li><em>Causal</em> — X causes Y (defend the mechanism; beware correlation).</li>\n<li><em>Empirical</em> — the data shows Y (defend the study; beware sample/date).</li>\n<li><em>Analogical</em> — like a known case (defend the likeness; beware disanalogy).</li>\n<li><em>Comparative</em> — even if both true, ours matters more (this is weighing — do it\n    explicitly on a named mechanism).</li>\n<li><strong>\"Because\" is the most important word in debate.</strong> Every claim sentence should be able\n  to finish \"…because ___.\" If it can't, it's an assertion, not an argument.</li>\n<li><strong>Explain the implication.</strong> After the evidence, say what it <em>means</em> for the round —\n  don't let the card do the arguing. Card → \"which means…\" → impact.</li>\n</ul>\n<p>Example.\n- ❌ <em>Assumed:</em> \"The moratorium protects ratepayers. Vote Pro.\"\n- ✅ <em>Warranted:</em> \"The moratorium halts new construction → so no new transmission cost\n  enters the rate base → because those costs are what get socialized onto residential\n  bills [card] → which means the specific harm my opponent concedes is avoided, and it's\n  avoided <em>before</em> it locks in for thirty years.\"</p>\n<h2>2. Speech structure — signpost so the judge can flow you</h2>\n<p>The judge votes off what they can <em>follow</em>. Make the structure audible.</p>\n<ul>\n<li><strong>Off-time roadmap</strong> at the top: \"Two responses on their C1, then my case.\" One line.</li>\n<li><strong>Numerical signposts</strong> for ordered points: \"First… Second… Third…\" A judge flowing\n  can't see your paragraph breaks — the numbers are the breaks.</li>\n<li><strong>Transitions close one point and open the next</strong>, explicitly: \"That's why their link\n  fails. Now, on our second contention…\" The transition is the workhorse; use one at every\n  seam.</li>\n<li><strong>Sign to the flow, not to yourself.</strong> Say \"on their economy contention,\" naming the\n  argument the way it sits on the judge's paper, so they can find the line.</li>\n<li><strong>Budget ~10–15% of the speech for structure</strong> — enough to orient, not so much it eats\n  substance. In a 3-min summary that's ~20–25 seconds of signposting, spread out.</li>\n<li><strong>Each speech has a shape</strong> (see SPEECH-STANDARD): rebuttal = their-case line-by-line;\n  summary = collapse → frontline → weigh; final focus = voters → weighing → story.</li>\n</ul>\n<h2>3. Wording / formation — build sentences that carry</h2>\n<ul>\n<li><strong>Claim first, then support.</strong> Lead the sentence with the point; don't bury it after a\n  clause. \"Rates fall — because grids have fixed costs\" beats \"Because grids have fixed\n  costs, which spread over more kilowatt-hours, rates fall.\"</li>\n<li><strong>Word economy.</strong> Every word earns its place; a debate is time-scarce. Cut \"I think,\"\n  \"basically,\" \"the fact that,\" \"in order to.\" Prefer one strong verb to a verb + adverb.</li>\n<li><strong>Active voice, concrete subjects.</strong> \"Congress abdicated\" beats \"abdication occurred.\"</li>\n<li><strong>One idea per sentence</strong> in speeches — short sentences flow; long ones lose the judge.</li>\n<li><strong>The tag-then-explain pattern:</strong> state the takeaway in one crisp line, <em>then</em> unpack it.\n  This is how a judge writes it on the flow.</li>\n<li><strong>Rhetoric, used sparingly and only where it clarifies:</strong> a tricolon (\"not fast, not\n  clean, not ours\"), antithesis (\"a pause is reversible; a rate base is not\"), a callback\n  to your framing in final focus. One or two per speech — decoration that slows the\n  argument is a cost, not a flourish. (On lay panels, lean harder into plain narrative;\n  on technical panels, lean into precision.)</li>\n</ul>\n<h2>4. Vocabulary — precise over fancy</h2>\n<ul>\n<li><strong>Precision beats sophistication.</strong> The right ordinary word beats an impressive vague\n  one. Don't reach for \"juxtaposition\" when \"gap\" is exact.</li>\n<li><strong>Kill vague intensifiers.</strong> \"very,\" \"a lot,\" \"hugely,\" \"massive\" → replace with the\n  number or the specific (\"a lot\" → \"hundreds of billions\"). PF prizes the quantified word.</li>\n<li><strong>Strong verbs, not noun piles.</strong> \"The policy erodes trust\" beats \"leads to an erosion\n  of trust.\"</li>\n<li><strong>Control your register by judge</strong> (see SPEECH-STANDARD judge notes):</li>\n<li><em>Lay panel:</em> zero jargon. Never \"solvency / delink / non-unique / uniqueness / turn.\"\n    Say what they mean: \"their plan won't actually work,\" \"that step is false,\" \"that's\n    already happening,\" \"that argument actually helps us.\" Jargon reads as evasion to a\n    parent.</li>\n<li><em>Technical panel:</em> the debate lexicon is fine and faster — but used <em>correctly</em>.\n    Misusing a term (\"turn\" for a mere takeout) costs credibility with a flow judge.</li>\n<li><strong>Own the topic's terms of art.</strong> Define contested terms once, precisely, and use them\n  consistently — sloppy terminology loses definitional fights.</li>\n</ul>\n<h2>Checklist (every speech the system writes)</h2>\n<ul>\n<li>[ ] Every claim finishes \"…because ___\" with the warrant stated, not assumed.</li>\n<li>[ ] The implication is explained (\"which means…\"), the card doesn't argue alone.</li>\n<li>[ ] Off-time roadmap + numbered points + a transition at every seam.</li>\n<li>[ ] Claim-first sentences, one idea each, active voice, filler cut.</li>\n<li>[ ] Vague intensifiers replaced with numbers/specifics.</li>\n<li>[ ] Register matched to the judge (no jargon on a lay panel).</li>\n</ul>"}, {"id": "d6", "title": "Rounds spec", "group": "Standards & method", "html": "<h1>ROUNDS — full simulated PF rounds (design spec)</h1>\n<p>Status: <strong>PLANNED, not yet built.</strong> This document is the spec the round skills will be\nbuilt from. Read <a href=\"HANDBOOK.md\">HANDBOOK.md</a> first — every rule there binds here.</p>\n<h2>Why rounds, when self-debate exists</h2>\n<p>Self-debate tests arguments in <em>isolation</em>: attack lens → frontline → done. A round\ntests what PF actually scores: <strong>sequence and survival</strong>. Second rebuttal must\nfrontline while extending; summary must collapse; final focus can add nothing new; an\nargument dropped once is dead. None of that pressure exists in the lens pass. The two\ncompose — they don't compete:</p>\n<pre><code>prep-topic pipeline:  analysis → research → cases → self-debate (lens pass, cheap)\n                      → ROUNDS (full-contact, this spec) → blocks → judge-model → brief\n</code></pre>\n<p>Lens pass first: it hardens each case cheaply so rounds don't waste speeches on defects\na single attack agent would have caught.</p>\n<h2>The honest reframe of \"undefeatable\"</h2>\n<p>No argument is undefeatable — our own first judge panel proved strength is\n<strong>judge-relative</strong> (Con's inherency won the flow judge and lost the lay judge <em>on the\nsame words</em>). What rounds can actually measure:</p>\n<blockquote>\n<p><strong>Survival</strong>: extended through summary AND final focus, not dropped, not turned —\nacross N rounds against independently-prepped opponents.\n<strong>Citation</strong>: named in a judge's RFD as a reason for decision, split by paradigm.</p>\n</blockquote>\n<p>The deliverable is a <strong>paradigm-split argument ledger</strong>, not a champion argument. It\nanswers the real question: <em>what do I run in front of this judge pool?</em></p>\n<h2>Architecture</h2>\n<h3>Competitors are real agents (verified 2026-07-18)</h3>\n<p>DeepSeek's Anthropic endpoint handles tool calling (tested: emits correct <code>tool_use</code>\nblocks). So competitor agents run as <code>claude -p</code> processes with\n<code>ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic</code> — full harness: Read, Write,\nWebFetch, their own prep directories. They research, cut their own cards, and write\ntheir own cases into their own files, like a real team prepping a tournament.</p>\n<p><strong>Search caveat:</strong> <code>WebSearch</code> is Anthropic-server-side and likely absent on the\nDeepSeek backend (UNVERIFIED — smoke-test at build step 0). Fallback that works either\nway, and matches our measured routing:\n- <strong>Scout (frontier, cheap):</strong> one pass produces a URL reading-list per side from real\n  searches. Curation is judgment; it's worth quota.\n- <strong>Grind (DeepSeek):</strong> competitors WebFetch the scouted URLs plus any they discover in\n  page links, verify, and cut cards under <code>/cut-cards</code> rules. Fetch-read-quote is\n  exactly what Flash/Pro grade well at.</p>\n<h3>Fog of war (the non-negotiable)</h3>\n<p>Blind construction was the self-debate's core design; rounds extend it to <em>all prep</em>:</p>\n<pre><code>topics/&lt;slug&gt;/rounds/&lt;round-id&gt;/\n  setup.md              coin flip result, sides, teams, judge panel, budgets\n  teams/pro/            PRIVATE: evidence/ case.md blocks.md strategy.md\n  teams/con/            PRIVATE: same structure\n  transcript.md         speeches + crossfires, appended in order as the round runs\n  ballots.md            frontier judge ballots\n  extraction.md         what survived, what died, why\ntopics/&lt;slug&gt;/rounds/ledger.md    cross-round argument scoreboard (paradigm-split)\n</code></pre>\n<ul>\n<li>During prep and the round, a team's agents may read: the shared <code>resolution.md</code>\n  (both real teams read the same topic primer), their OWN team dir, and <strong>past rounds'\n  public archives</strong> (transcripts/ballots — that's scouting, and it's realistic).</li>\n<li>They may NEVER read the opposing team's dir for the current round. Enforced the same\n  way as the Congress firewall: stated in every prompt, and verified after the round by\n  grepping speeches for content that appears only in the opponent's private files.</li>\n</ul>\n<h3>Teams, philosophies, personas</h3>\n<p><code>debaters/</code> roster — team doctrine files, each defining two speakers (PF is 2v2):</p>\n<table>\n<thead>\n<tr>\n<th>Team</th>\n<th>Central logic</th>\n<th>Speaker 1 (Constructive + Summary)</th>\n<th>Speaker 2 (Rebuttal + Final Focus)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>The Technicians</strong></td>\n<td>link-precision; win the flow; concede strategically, collapse early</td>\n<td>the Architect — tight warrants</td>\n<td>the Surgeon — line-by-line frontliner</td>\n</tr>\n<tr>\n<td><strong>The Narrators</strong></td>\n<td>lay-first storytelling; one big frame; jargon-free force</td>\n<td>the Storyteller</td>\n<td>the Closer — weighing as narrative</td>\n</tr>\n<tr>\n<td><strong>The Aggressors</strong></td>\n<td>offense everywhere; hunt turns; make defense feel like losing</td>\n<td>the Instigator</td>\n<td>the Finisher</td>\n</tr>\n<tr>\n<td><strong>The Weighers</strong></td>\n<td>impact calculus supremacy; win on the comparison, not the argument</td>\n<td>the Framer</td>\n<td>the Comparator</td>\n</tr>\n</tbody>\n</table>\n<p>Persona rules from the handbook apply with a wrinkle this system was built for:\n- <strong>Speeches: persona ON</strong> (performance — measured to help).\n- <strong>Their research sub-tasks: persona OFF</strong> (fact-finding — measured to hurt). The\n  doctrine shapes what they <em>look for</em> and <em>select</em>, never what they claim a source says.\n- Speaker 2 defends a case they didn't write — real partner dynamics, and drift between\n  partners is itself a signal the extraction should note.</p>\n<p>1v1 mode exists as a cheap variant (one agent plays both speaker roles per side). Same\nspeech count, so barely cheaper — default is 2v2.</p>\n<h3>Round flow (real NSDA order, simulated coin flip)</h3>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Speech</th>\n<th>Time → word budget</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Team A constructive (S1)</td>\n<td>4:00 → ≤900 words</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Team B constructive (S1)</td>\n<td>4:00 → ≤900</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Crossfire 1 (S1s, 3 Q&amp;A exchanges)</td>\n<td>scoped</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Team A rebuttal (S2)</td>\n<td>4:00 → ≤900</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Team B rebuttal (S2) — <strong>must frontline</strong></td>\n<td>4:00 → ≤900</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Crossfire 2 (S2s, 3 exchanges)</td>\n<td>scoped</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Team A summary (S1) — <strong>must collapse</strong></td>\n<td>3:00 → ≤650</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Team B summary (S1)</td>\n<td>3:00 → ≤650</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Grand crossfire (all four, 4 exchanges)</td>\n<td>scoped</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Team A final focus (S2) — <strong>nothing new</strong></td>\n<td>2:00 → ≤450</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Team B final focus (S2)</td>\n<td>2:00 → ≤450</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Sequential by necessity: each speech sees the transcript so far + own team's prep.\n  Direct-API DeepSeek script (the proven <code>wp_selfdebate_deepseek.py</code> pattern), transcript\n  saved incrementally so a crash resumes mid-round.</li>\n<li><strong>Token-budget lesson baked in:</strong> every DeepSeek call gets <code>max_tokens ≥ 6000</code> with the\n  word limit enforced in the prompt, because V4 Pro's hidden reasoning ate a 1500-token\n  budget and returned empty ballots on 2026-07-18. Never again.</li>\n<li>Judges are told the word budgets; overtime content is instructed to be ignored, like a\n  real judge putting the pen down.</li>\n</ul>\n<h3>Open research — the default, not a variant (v2, 2026-07-18)</h3>\n<p>Real PF locks teams to their prep. We deliberately break that rule, because the product\nis prep files, not fidelity: an argument should be tested against <strong>the best\ncounter-evidence that exists in the literature</strong>, not against whatever one simulated\nopponent happened to prep. (This also approximates the best-prepped human opponent —\nwho <em>did</em> find that card before Saturday.)</p>\n<ul>\n<li><strong>Research windows:</strong> after constructives and after rebuttals (never before final\n  focus — nothing-new stays sacred). Per team per window: ≤6 fetches, ≤2 new cards\n  deployed in the next speech, all <code>/cut-cards</code> rules in force. The evidence judge\n  audits mid-round cards <strong>hardest</strong> — fresh research under competitive pressure is\n  peak fabrication risk.</li>\n<li><strong>The librarian:</strong> WebSearch likely doesn't exist on the DeepSeek backend, and search\n  curation is judgment anyway. A neutral frontier agent serves BOTH teams' search\n  queries during windows — returns URL lists only, no analysis, every query and result\n  logged publicly in the round archive. Same librarian for both sides = fair access.</li>\n</ul>\n<h3>Standardized agent goals (what legitimizes self-directed research)</h3>\n<p>Every competitor prompt carries a two-level goal contract:</p>\n<ol>\n<li><strong>Terminal (system-level, shared):</strong> surface the strongest arguments and every\n   weakness. The round is an instrument; winning is the mechanism, not the point.</li>\n<li><strong>Instrumental (role-level):</strong> win this round, before this panel, under the\n   evidence rules.</li>\n</ol>\n<p>Before each research window, the agent writes a <strong>research charter</strong> into its team\ndir: the claim it's targeting, what evidence would actually change the round, its\nfetch budget, and the negative-results commitment — <em>if the literature cuts against\nus, that gets recorded in our files even if we pivot strategically in-round</em> (post-\nround, all files go public anyway; hiding buys nothing). Extraction audits charters;\ncharter-less research is discounted in the ledger.</p>\n<h3>The argument-resolution phase (depth over breadth — the core of v2)</h3>\n<p>The standard speech sequence produces strategy signal (frontline burden, collapse,\nweighing) but resolves almost nothing — real rounds end with arguments merely\n<em>contested</em>. So after final focus, the round doesn't end:</p>\n<ol>\n<li>Extraction lists every argument still contested (not clearly dead, not clearly won).</li>\n<li>Each contested argument enters a <strong>deep-clash loop</strong>: best attack → best answer,\n   alternating, research allowed, until <strong>two consecutive exchanges surface nothing\n   new</strong> (loop-until-dry, per argument).</li>\n<li>Attackers <strong>rotate through all four doctrines</strong> — each argument gets hit from the\n   Technician, Narrator, Aggressor, and Weigher angles. This preserves the philosophy-\n   diversity signal without running extra full rounds.</li>\n<li>Judges then rule <strong>per argument</strong>, assigning a terminal state:\n   - <strong>exhausted-survives</strong> — prep-file gold; promote to case lead\n   - <strong>exhausted-dies-to-X</strong> — cut it, or pre-empt X in blocks\n   - <strong>stalemate-on-evidence-gap</strong> — research ticket; reopen when filled</li>\n</ol>\n<p><strong>Blocks fall out of this phase automatically:</strong> a finished deep-clash exchange IS a\nbattle-tested block — the best attack found anywhere and the best answer that survived\nit, nearly verbatim. This is the single most direct mechanism by which rounds improve\nblock files.</p>\n<p>One deep round per topic is the default. A second runs only if promotion materially\nchanged the case (new evidence flipped an argument's terminal state).</p>\n<h3>Judging and extraction (frontier — handbook rule 5, no exceptions)</h3>\n<ul>\n<li>Panel: lay + flow + evidence paradigms (the validated trio), run as Claude agents.\n  Judges see ONLY the transcript (evidence judge may also request cards actually cited —\n  a real evidence challenge). Never the private prep, never each other's ballots.</li>\n<li><strong>Extraction pass</strong> (frontier, one agent): walks the transcript speech-by-speech and\n  scores every named argument — extended/dropped/turned/collapsed-to, and whether any\n  judge's RFD cites it. Appends to <code>extraction.md</code> and updates the ledger.</li>\n</ul>\n<h3>The ledger (the actual product)</h3>\n<p><code>rounds/ledger.md</code>, append-only, one row per argument per round:</p>\n<pre><code>| argument | round | side | survived to FF? | dropped/turned? | RFD citations (lay/flow/ev) |\n</code></pre>\n<p>After N rounds: \"strongest\" = survival rate × RFD-citation rate, <strong>reported per\nparadigm</strong>. Expect divergent winners — that's not noise, that's the finding.</p>\n<h2>The accumulation loop (the point of running rounds at all)</h2>\n<p>Rounds are experiments, not exhibitions. Each one must revise the topic's canonical\nprep, or it was wasted tokens. The loop:</p>\n<pre><code>PREP.md vN → round → extraction + ballots → REFLECTION → PREP.md vN+1\n   ↑_____________ next round's teams read PREP.md first _____________|\n</code></pre>\n<p><strong>PREP.md</strong> (per topic) is the single concentrated prep file — <strong>self-contained</strong>: full\ncurrent-best case copy both sides, full blocks, weighing, evidence manifest, round\nhistory. A competitor uses it at a real tournament without opening any other file.\nTeams read it first at prep start; detailed artifacts stay in their dirs as the\nworking record behind it.</p>\n<p><strong>Reflection is co-equal with the round</strong> (user directive 2026-07-18): the round's ¥5\nsplits ~¥3 round proper / <strong>≤¥2 reflection</strong>, and a round is not complete until\nreflection runs — <code>run_round.py</code> marks <code>reflected: false</code>, <code>reflect_round.py</code> refuses\nto run before ballots + extraction exist and flips the flag when done. Reflection MUST\nreview the judge feedback, the weighing, and every counter-argument the round\nproduced, and land them in PREP.md (append-only, provenance required). A round whose\ndata never reaches PREP.md is wasted spend by definition.</p>\n<h3>Promotion (the missing step, now required)</h3>\n<p>After every round's extraction, a frontier <strong>promotion pass</strong> revises the canonical\n<code>cases/</code>, <code>blocks/</code>, and a per-topic <code>strategy.md</code> from ledger evidence — never from\ntaste. Every change carries provenance:</p>\n<blockquote>\n<p><em>\"Madison-flips-Hamilton promoted to Pro lead: survived 3/3 rounds, cited in lay and\nflow RFDs (r1, r2).\"</em>\n<em>\"Pro C2 solvency framing demoted: died in every flow ballot; do not lead with it\nuntil the solvency card exists (see evidence gaps).\"</em></p>\n</blockquote>\n<p>Old versions stay in git/history — append-only, files are memory. The canonical files\nare always the current best-known case, and the changelog is the receipt trail.</p>\n<p>Because the next round's teams prep against the <em>promoted</em> case, surviving arguments\nface escalating, increasingly-informed attack. Survival under that is the strongest\nsignal this system can produce.</p>\n<h3>Convergence — when a topic is \"done\"</h3>\n<p>A topic converges when <strong>every major argument holds a terminal state</strong>\n(exhausted-survives / exhausted-dies / stalemate-with-ticket-filled) and the last\nresearch-interlock pass changed none of them. With the resolution phase doing the\nexhausting, this can happen in ONE deep round plus interlock iterations. At that point\n<code>cases/ + blocks/ + strategy.md</code> ARE the best narrative, block file, case, and strategy\nthis system can build — with the ledger as evidence rather than assertion. Note it in\nthe ledger and stop spending on that topic.</p>\n<h3>Cross-topic accumulation: the playbook</h3>\n<p>Cards never cross topics (they stale and bleed — CLAUDE.md rule stands). What crosses\nis <strong>doctrine</strong>. <code>playbook/</code> at repo root accumulates strategy patterns with\nprovenance, e.g. from the war-powers sim already: <em>\"inherency/solvency presses win flow\nand evidence judges but BACKFIRE with lay judges (war-powers r1, validated ballots)\"</em>;\n<em>\"turns built from the opponent's own evidence rate highest — they cost no new cards\nand judges cite them.\"</em> Teams read the playbook during prep on ANY topic — it's public\ncoaching wisdom. Every new topic starts smarter than the last one did.</p>\n<h3>Two rules that protect the loop</h3>\n<ol>\n<li><strong>The four doctrine teams do NOT learn.</strong> They are measurement instruments. If teams\n   absorb the playbook and converge on whatever wins, they homogenize — and the\n   paradigm-split signal (the most valuable thing the system produces) dies with their\n   diversity. The <em>playbook</em> learns; the <em>canonical case</em> learns; the instruments stay\n   fixed and orthogonal.</li>\n<li><strong>Convergence is convergence against OUR simulator</strong> — four doctrines, three judge\n   paradigms. That's overfitting risk, stated plainly. Real tournament results logged\n   via <code>/judge-model</code> are ground truth and can reopen a \"converged\" topic at any time.\n   A case undefeated in here and beaten on Saturday is the simulator's error to learn\n   from, not an anomaly to dismiss.</li>\n</ol>\n<p>(Build note: promotion lands in Phase 2 alongside the ledger — it's one more frontier\npass per round, ~20k tokens.)</p>\n<h2>Quality control (what makes a round productive instead of expensive)</h2>\n<p><strong>A round must end in at least one of exactly four outputs, or it was waste:</strong> a\npromotion, a block diff (new/upgraded blocks from actual clash), a research ticket\n(evidence gap → nightly-research priority queue), or a convergence tick. \"We ran a\nround\" is not an outcome.</p>\n<ol>\n<li><strong>Provenance-gated promotion.</strong> An argument promotes as <em>carded</em> only if the\n   promotion pass verifies the card file exists in the winning team's evidence dir and\n   the quote survives contact with it. Otherwise it promotes labeled <em>analytic</em>.\n   Competitive pressure creates fabrication incentive; this is the trap for it.</li>\n<li><strong>Two-tier promotion threshold.</strong> Defect fixes are immediate (a fatal unanswered\n   attack needs no replication). Strategy promotions — lead changes, reordering,\n   collapse targets — require the pattern to hold across <strong>2+ rounds</strong>. One ballot per\n   paradigm is n=1; promoting strategy on n=1 is thrash, not learning.</li>\n<li><strong>Clash grading.</strong> Extraction scores clash quality per speech (did the rebuttal\n   answer the argument actually made, or a strawman?). Low-clash rounds get their\n   results discounted in the ledger, not recorded as signal.</li>\n<li><strong>The research interlock.</strong> Round N's evidence gaps become nightly-research's top\n   priorities; <strong>round N+1 does not run until the top gaps are addressed</strong> (card found,\n   or confirmed unfindable — itself strategy-shaping). Rounds cannot improve a case\n   past its evidence base — war-powers proved it (Pro loses on solvency in every\n   configuration until the solvency card exists). The interlock is what makes the loop\n   compound instead of spin.</li>\n</ol>\n<h2>Cost &amp; scale (measured basis, not guessed)</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Est.</th>\n<th>Basis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Team prep (research+cards+case), per team</td>\n<td>~¥0.3–0.6</td>\n<td>nightly-research scale runs</td>\n</tr>\n<tr>\n<td>One full round (11 speeches + crossfires)</td>\n<td>~¥0.3–0.5</td>\n<td>wp_selfdebate cost ≈ ¥1 for 20 calls</td>\n</tr>\n<tr>\n<td>Judges + extraction (frontier)</td>\n<td>~130k Claude tokens</td>\n<td>measured: 3 ballots ≈ 90k</td>\n</tr>\n<tr>\n<td>Resolution phase (deep-clash loops, ~4–6 contested args)</td>\n<td>~¥0.5–1</td>\n<td>exchange count est.</td>\n</tr>\n<tr>\n<td><strong>One DEEP round, all-in</strong></td>\n<td><strong>~¥1.5–2.5 + modest quota</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>Wall clock per deep round</td>\n<td>60–120 min (sequential + resolution loops)</td>\n<td>run unattended</td>\n</tr>\n</tbody>\n</table>\n<p>Depth-over-breadth economics: one deep round (~¥2) replaces a six-round robin (~¥6–9)\nand produces <em>stronger</em> signal — terminal states instead of n=1 survivals. Current\nDeepSeek balance ≈ ¥8 → roughly 3–4 deep rounds, i.e., 3–4 topics.</p>\n<h2>Build phases</h2>\n<p><strong>Phase 0 — verify: DONE 2026-07-18.</strong> Results reshaped the build:\n1. No <code>claude</code> CLI exists on this machine (desktop app only) → competitors run on a\n   custom sandboxed agent loop (<code>tools/agent_loop.py</code>). Better outcome: fog of war is\n   code-enforced, not prompt-promised. (Side effect: <code>run-nightly-research.ps1</code>'s\n   <code>claude -p</code> line is broken — fix before scheduling it.)\n2. <strong>Server-side web_search WORKS on DeepSeek</strong> (verified: real search results\n   returned) → teams search independently; the librarian is demoted to fallback.\n3. Regression guard passed (8k budgets, non-empty text with tools attached).</p>\n<p><strong>Phase 1 — one round end-to-end:</strong> <code>debaters/</code> roster (4 doctrine files) →\n<code>/prep-team</code> skill (one team, fog-of-war prep, DeepSeek) → <code>/run-round</code> skill (setup +\nsequential round runner + frontier judges + extraction) → run ONE round on the\nwar-powers sim topic (Technicians vs Narrators), fix what breaks.</p>\n<p><strong>Phase 2 — accumulate to convergence:</strong> extraction feeds <code>ledger.md</code> (terminal states);\npromotion revises canonical files; research interlock fills stalemate tickets; iterate\non war-powers until every major argument is terminal. <code>judge-model</code> consumes ballots.</p>\n<p><strong>Phase 3 — DEPRECATED (round-robin tournament mode).</strong> Depth replaced breadth: the\nresolution phase's all-doctrine rotation delivers the philosophy coverage a round-robin\nwas for, at a fraction of the cost. Revisit only if terminal states look\ndoctrine-biased in practice.</p>\n<h2>What this deliberately does not promise</h2>\n<ul>\n<li>Crossfires are structured text exchanges — useful for extracting concessions, not a\n  simulation of live speed and presence.</li>\n<li>Delivery (tone, pace, presence) is out of scope — that's the Congress branch's lane.</li>\n<li>An \"undefeatable argument\" — the ledger gives survival-under-pressure per judge\n  paradigm, which is the honest version and the more useful one.</li>\n<li>Judge realism is three calibrated paradigms, not your local circuit's actual pool.\n  Real tournament results logged via <code>/judge-model</code> remain the ground truth that\n  corrects the simulation.</li>\n</ul>"}, {"id": "d7", "title": "Team doctrine: aggressors", "group": "Agent guidelines", "html": "<h1>The Aggressors</h1>\n<p><strong>Central logic:</strong> defense never wins a ballot — offense everywhere, and the best\noffense is the opponent's own material turned. Make every speech cost them something;\na team playing defense all round looks like it's losing, and judges vote the look.</p>\n<p><strong>Prep doctrine:</strong> turn-hunting — read the opponent's likely evidence base FIRST and\nprep the flips. Every block ends in offense, never in \"so their point is mitigated.\"\nCut cards that double as weapons on both sides of the flip.</p>\n<p><strong>Speaker 1 — \"the Instigator\"</strong> (Constructive + Summary): constructive plants\ntripwires — framings chosen because the natural responses walk into turns. Summary\nleads with the turn scoreboard: \"we turned their C1; that's our offense now.\"</p>\n<p><strong>Speaker 2 — \"the Finisher\"</strong> (Rebuttal + Final Focus): rebuttal is turn-first,\nanswer-second. Final focus weighs captured offense above native offense — \"you can\nvote Con on Pro's own evidence.\"</p>\n<p><strong>Tells (fixed):</strong> manufactures turns that don't hold under scrutiny (evidence judges\nkill these); neglects its own case's defense; high variance — spectacular when right,\nself-immolating when a claimed turn is fake.</p>"}, {"id": "d8", "title": "Team doctrine: narrators", "group": "Agent guidelines", "html": "<h1>The Narrators</h1>\n<p><strong>Central logic:</strong> a judge votes for the story they can retell in the RFD. One frame,\ncarried from constructive to final focus, beats five arguments. Jargon is a tax;\nplain force is the currency.</p>\n<p><strong>Prep doctrine:</strong> research for the <em>human</em> evidence — the concrete case, the vivid\nnumber, the quote a parent repeats at dinner. Cards chosen for tellability as much as\nstrength; every contention must survive being read aloud to a stranger.</p>\n<p><strong>Speaker 1 — \"the Storyteller\"</strong> (Constructive + Summary): opens with the frame, not\nthe resolution. Contentions are chapters of one story. Summary re-tells the story with\nthe round's events woven in — \"they told you X; you saw Y.\"</p>\n<p><strong>Speaker 2 — \"the Closer\"</strong> (Rebuttal + Final Focus): rebuts by reframing — absorbs\nopponent offense into the story rather than answering line-by-line. Final focus is\n60 seconds of why the story was true all along, aimed at the ballot's write-in line.</p>\n<p><strong>Tells (fixed):</strong> drops technical offense rather than clutter the story; vulnerable\nto disciplined flow judges who count drops; can smuggle uncarded claims inside\nnarrative momentum — evidence judges punish this.</p>"}, {"id": "d9", "title": "Team doctrine: technicians", "group": "Agent guidelines", "html": "<h1>The Technicians</h1>\n<p><strong>Central logic:</strong> rounds are won on the flow, not in the air. Every argument is a link\nchain; break one link and the impact never happens. Concede what you can't win,\ncollapse early, and make the judge's decision mechanical.</p>\n<p><strong>Prep doctrine:</strong> link-precision research — hunt for the exact step opponents cannot\ncard. Prefer one A-grade card over three B's. Cut cards on the <em>mechanism</em>, not the\nimpact; impacts are cheap, links are scarce.</p>\n<p><strong>Speaker 1 — \"the Architect\"</strong> (Constructive + Summary): builds cases as explicit\nchains — claim, warrant, card, impact, weighed. Summary collapses to ONE contention by\nminute zero and spends the rest on comparative weighing. Never extends what isn't\ncleanly ahead.</p>\n<p><strong>Speaker 2 — \"the Surgeon\"</strong> (Rebuttal + Final Focus): line-by-line, numbered\nresponses, strongest first. Explicitly concedes non-threatening arguments to buy time.\nFinal focus is two voters, verbatim from summary, nothing else.</p>\n<p><strong>Tells (kept fixed — instruments don't learn):</strong> under-invests in narrative; can win\nthe flow and lose a lay ballot; allergic to arguments that need more than one leap.</p>"}, {"id": "d10", "title": "Team doctrine: weighers", "group": "Agent guidelines", "html": "<h1>The Weighers</h1>\n<p><strong>Central logic:</strong> rounds are rarely won on whether arguments are true — they're won\non which true argument matters more. Concede 80% of the flow and win the comparison.\nMagnitude, probability, timeframe, scope, reversibility, prerequisite: say the words,\ndo the math, force the judge to use YOUR scale.</p>\n<p><strong>Prep doctrine:</strong> research the <em>sizes</em> — quantified impacts, base rates, time\nhorizons. A card with a number beats a card with an adjective. Prep the meta-weighing\ntoo: why probability outranks magnitude on this topic (or vice versa), carded if\npossible.</p>\n<p><strong>Speaker 1 — \"the Framer\"</strong> (Constructive + Summary): constructive's first 30 seconds\nestablish the weighing mechanism BEFORE any contention. Summary is almost pure\ncomparison: \"even if you grant their whole case, ours outweighs on prerequisite.\"</p>\n<p><strong>Speaker 2 — \"the Comparator\"</strong> (Rebuttal + Final Focus): rebuts by out-weighing, not\ndisproving — \"grant it; it's smaller.\" Final focus is a single weighted comparison\ndone slowly, twice.</p>\n<p><strong>Tells (fixed):</strong> concedes too much truth and can lose to a team that just denies\nits impacts exist; weighing-heavy speeches feel evasive to lay judges who want to know\n\"but is it TRUE?\"; brittle when the opponent contests the scale itself.</p>"}, {"id": "d11", "title": "Skill: blocks", "group": "Agent guidelines", "html": "<hr />\n<p>name: blocks\ndescription: Turn the surviving attacks from a self-debate into frontline blocks — pre-written answers keyed to what an opponent will actually say. Use after self-debate has run. Takes a side (pro/con/both) as args.</p>\n<hr />\n<h1>Blocks</h1>\n<p>Read <a href=\"../../../HANDBOOK.md\">HANDBOOK.md</a> first. This is a <strong>frontliner</strong> role: no\npersona, and never bluff an answer you don't have.</p>\n<p>A block is a pre-written response to an argument the opponent will make. In-round you\nhave 3 minutes of prep for the whole thing — the answers have to already exist.</p>\n<h2>Input</h2>\n<p>Read the most recent <code>topics/&lt;slug&gt;/briefs/*-self-debate.md</code>. The blocks are built\nfrom its two outputs:</p>\n<ul>\n<li><strong>surviving attacks</strong> → each needs a frontline (an answer we give when the opponent\n  runs this on us)</li>\n<li><strong>turns we found</strong> → each needs an extension (how we run it on them)</li>\n</ul>\n<p>If no self-debate brief exists, stop and say so. Blocks written without knowing which\nattacks actually survive are just more case copy — you'd be guessing at what to answer.</p>\n<h2>The time constraint is the whole point</h2>\n<p>Every block carries a <strong>read time</strong>. The second-rebuttal speaker must frontline the\nopponent's offense <em>and</em> extend their own case in 4 minutes. A block that takes 90\nseconds is not a block, it's a second constructive.</p>\n<p>For each block, estimate seconds-to-read and mark whether it fits. If the honest answer\nto an attack cannot be compressed under the time budget, <strong>say that</strong> — that's a signal\nthe underlying case is too fragile, not a prompt to write a longer block.</p>\n<h2>Block format</h2>\n<p><code>topics/&lt;slug&gt;/blocks/&lt;side&gt;-vs-&lt;opposing-argument-slug&gt;.md</code></p>\n<pre><code class=\"language-markdown\">---\nanswers: &lt;the opposing argument this responds to&gt;\nside: pro | con\nread_seconds: &lt;honest estimate&gt;\nfits_rebuttal: yes | no\n---\n\n**They say:** &lt;the argument, in the form the opponent actually makes it&gt;\n\n**We say:**\n1. &lt;response — the strongest first; a judge remembers the first thing, not the fifth&gt;\n2. &lt;response&gt;\n\n**Card:** &lt;if a card answers this, name the file. If not, say &quot;analytic — no card&quot;\nand know that a carded opponent beats an analytic answer on the flow.&gt;\n\n**If they press:** &lt;the follow-up, for crossfire or the next speech&gt;\n</code></pre>\n<h2>Rules specific to blocks</h2>\n<ul>\n<li><strong>Order responses by strength, not by logic.</strong> The judge weights what they hear\n  first. Lead with the response that wins, not the one that comes first chronologically.</li>\n<li><strong>An analytic block is allowed but flagged.</strong> Mark it. When it's answering a carded\n  attack, note that it loses the evidence comparison — that tells the user to prioritize\n  finding a card for it.</li>\n<li><strong>Do not invent the opponent's argument to make it easy to answer.</strong> Write \"they say\"\n  in its strongest form. A block that answers a weak version of the attack is worse than\n  no block, because it breeds false confidence.</li>\n<li><strong>Frontline the turns too.</strong> For every turn we found, write the extension: how we\n  initiate it, and our answer to their most likely response. A turn we can't defend once\n  they respond is not offense, it's a trap we walk into.</li>\n</ul>\n<h2>Output</h2>\n<p>Write blocks to <code>topics/&lt;slug&gt;/blocks/</code>. Update <code>current-topic.md</code> prep status. Then\nreport: how many blocks fit the rebuttal budget and how many don't, and the attack whose\nblock is weakest — that's the next research target.</p>"}, {"id": "d12", "title": "Skill: congress-analyze", "group": "Agent guidelines", "html": "<hr />\n<p>name: congress-analyze\ndescription: Measure the patterns in one ingested Congress speech — pacing, structure, rhetoric, vocabulary — from its transcript. Second stage of the Congress pipeline. Takes a corpus slug as args.</p>\n<hr />\n<h1>Congress analyze</h1>\n<p>Read <a href=\"../../../congress/CONGRESS.md\">congress/CONGRESS.md</a> first. This is a <strong>measurement</strong>\nrole: <strong>no persona.</strong> Telling the model \"you are an expert rhetorician\" degrades factual\naccuracy (handbook). Count what's there; don't perform expertise.</p>\n<h2>Input</h2>\n<p><code>congress/corpus/&lt;slug&gt;/transcript.json</code> and <code>source.md</code>. Read <code>caption_type</code> first — it\nsets how much to trust everything below.</p>\n<h2>What to extract → <code>analysis.md</code></h2>\n<h3>Pacing (the signal auto-captions still carry)</h3>\n<p>From <code>start</code>/<code>duration</code> per cue:\n- Overall words-per-minute. Congress delivery is ~150–200 WPM. <strong>If your computed WPM is\n  under 100 or over 300, the timestamp parse is wrong — stop and say so, don't report a\n  number you know is broken.</strong>\n- WPM by section. The interesting finding is <em>where they slow down</em> — champions slow for\n  impacts and speed through setup. Mark the slow points against what they're saying there.\n- Pauses: gaps between cues over ~0.8s. Where a speaker plants a pause is a delivery choice\n  worth naming.</p>\n<h3>Structure</h3>\n<p>Segment the speech: hook / framing / preview / points / weighing / close. Time budget per\nsection as a fraction of total. This is what makes a speech <em>feel</em> organized to a judge.</p>\n<h3>Rhetoric</h3>\n<p>Count devices that are actually present — anaphora, tricolon, rhetorical question, direct\naddress, antithesis, callback. <strong>Count them, with the line they appear on.</strong> \"Uses vivid\nlanguage\" is not a finding; \"opens three consecutive sentences with 'When we fail to\nact'\" is.</p>\n<h3>Vocabulary</h3>\n<p>Sentence-length distribution, syllable density, ratio of plain words to jargon. Congress\nrewards accessible force over technical density — measure whether this speaker achieves it.</p>\n<h2>The confidence rule</h2>\n<p>Every <code>analysis.md</code> opens with a <strong>confidence line</strong> tied to <code>caption_type</code>:\n- Manual captions → high confidence on vocabulary and rhetoric.\n- Auto-captions → <strong>pacing and structure survive</strong> (timing is roughly right), but\n  vocabulary and exact-wording findings are <strong>low confidence</strong> — auto-captions mangle the\n  fast, jargon-dense delivery that champions use. Say which findings you'd stake a claim on\n  and which you wouldn't. A confident vocabulary analysis off a garbled transcript is noise\n  dressed as insight.</p>\n<h2>Output</h2>\n<p><code>congress/corpus/&lt;slug&gt;/analysis.md</code>. Report the two or three patterns most worth a human's\nattention, and flag explicitly if the transcript was too broken to analyze — that's a\nresult, and it points at needing Whisper instead.</p>"}, {"id": "d13", "title": "Skill: congress-ingest", "group": "Agent guidelines", "html": "<hr />\n<p>name: congress-ingest\ndescription: Pull a champion Congress speech from YouTube into the corpus — captions plus metadata. Takes a YouTube URL as args. First stage of the Congress style pipeline.</p>\n<hr />\n<h1>Congress ingest</h1>\n<p>Read <a href=\"../../../congress/CONGRESS.md\">congress/CONGRESS.md</a> first. This feeds the corpus,\nwhich is quarantined from speech-writing by the firewall.</p>\n<h2>Known limitation — read this first</h2>\n<p>Tested 2026-07-17: <code>youtube_transcript_api</code> is <strong>intermittently IP-blocked by YouTube</strong>\nfrom this machine's residential connection. One fetch was blocked (<code>RequestBlocked</code>); a\nsecond call to a different video succeeded. So the tool works <em>sometimes</em>, throttled by\nYouTube
