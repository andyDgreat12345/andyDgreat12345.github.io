's rate/reputation limits.</p>\n<p>What this means in practice:\n- <strong>Fine for grabbing speeches one at a time, with a human present</strong> to retry a block.\n- <strong>Not reliable for unattended batch ingestion.</strong> Do not schedule this.\n- If it blocks, wait and retry — do not hammer, which worsens the block.\n- <strong>Robust fallback</strong> if blocking becomes constant: <code>yt-dlp</code> (downloads audio, negotiates\n  YouTube's throttling far better) + Whisper via the user's <code>OPENAI_API_KEY</code> (~$0.02/\n  speech, and word-level timestamps, which are <em>better</em> than caption cues). This needs\n  <code>yt-dlp</code> + <code>ffmpeg</code> installed, which the auto-caption path does not — that's the whole\n  reason auto-captions were the default. If you reach for it, install those first.</p>\n<h2>What it does</h2>\n<p>Runs <code>congress/ingest.py &lt;url&gt; &lt;slug&gt;</code> — the caption-fetch is a real, tested script so\nthe API version is pinned in one place. It:</p>\n<ol>\n<li>Extracts the video ID (handles watch URLs, youtu.be, shorts, embed, or a raw 11-char\n   id). Exit 3 on a URL it can't parse.</li>\n<li>Prefers a <strong>manual</strong> caption track over an auto one, and records which it got — that\n   flag drives how much <code>congress-analyze</code> trusts the vocabulary findings.</li>\n<li>Saves raw cues — each <code>{text, start, duration}</code> — plus a <code>meta</code> block (duration, word\n   count, rough WPM) to <code>congress/corpus/&lt;slug&gt;/transcript.json</code>. <strong>Timestamps are the\n   point.</strong> Pacing analysis depends entirely on <code>start</code>/<code>duration</code>; a transcript without\n   them is text, not a speech.</li>\n<li>Exit 2 with a clear message if the video has no captions — never substitutes a summary\n   or a different video.</li>\n<li>If the video has <strong>no captions</strong>, stop and say so plainly. Do not substitute a summary\n   or a different video. A missing transcript is a missing transcript.</li>\n<li>Write <code>source.md</code> with metadata that captions cannot provide — prompt the user for\n   whatever isn't knowable from the page:</li>\n</ol>\n<pre><code class=\"language-markdown\">---\nspeaker: &lt;name, or &quot;unknown&quot;&gt;\ntournament: &lt;e.g. NSDA Nationals 2025&gt;\nplacement: &lt;e.g. finalist, champion, 3rd&gt;\nspeech_type: &lt;authorship | sponsorship | refutation | crystallization | unknown&gt;\nbill: &lt;what the speech was about&gt;\nurl: &lt;source&gt;\ningested: YYYY-MM-DD\ncaption_type: auto | manual\n---\n</code></pre>\n<h2>Slug</h2>\n<p><code>&lt;speaker-lastname&gt;-&lt;tournament&gt;-&lt;year&gt;</code>, kebab-case. If speaker is unknown, use\n<code>unknown-&lt;tournament&gt;-&lt;year&gt;-&lt;n&gt;</code>.</p>\n<h2>Honesty rules</h2>\n<ul>\n<li><strong>Report caption type.</strong> Manual captions are clean; auto-captions are noisy. Everything\n  downstream needs to know which it's looking at, so record it in <code>source.md</code>.</li>\n<li><strong>Do not guess metadata.</strong> If you can't tell whether a speech was an authorship or a\n  crystallization from the content, mark <code>unknown</code> and let the user fill it. A mislabeled\n  speech-type corrupts the synthesis, which sorts patterns by type.</li>\n<li><strong>One speech per directory.</strong> Champions give different speeches in different rounds;\n  merging them averages away exactly the distinctions worth studying.</li>\n</ul>\n<h2>Output</h2>\n<p>The corpus directory with <code>transcript.json</code> + <code>source.md</code>. Report: caption type, rough\nlength, word count, and anything about the transcript that looks broken enough to hurt\nanalysis.</p>"}, {"id": "d14", "title": "Skill: congress-synthesize", "group": "Agent guidelines", "html": "<hr />\n<p>name: congress-synthesize\ndescription: Find the patterns across the whole Congress corpus and present them as style options with tradeoffs — never as an average. Third stage. Run after several speeches are analyzed.</p>\n<hr />\n<h1>Congress synthesize</h1>\n<p>Read <a href=\"../../../congress/CONGRESS.md\">congress/CONGRESS.md</a> first. No persona — this is\nstill measurement, one level up.</p>\n<h2>Input</h2>\n<p>Every <code>analysis.md</code> in <code>congress/corpus/*/</code>. Weight each by its confidence line — a\nhigh-confidence manual-caption analysis counts for more than a low-confidence auto-caption\none. Say how many speeches you're synthesizing from; a \"pattern\" from two speeches is a\ncoincidence, and you should label it as such.</p>\n<h2>The one job: options, not an average</h2>\n<p>The failure mode this skill exists to avoid is producing \"the average NSDA champion.\" That\nperson doesn't exist and ranks like it. So:</p>\n<ul>\n<li><strong>Report where champions diverge.</strong> If three finalists open cold and two open with a\n  story, that is the finding — two viable styles — not \"60% open cold.\" Divergence is the\n  signal, the same reason judge divergence is the best output of PF self-debate.</li>\n<li><strong>Attach a tradeoff to each pattern.</strong> \"Fast, dense delivery covers more ground but loses\n  a lay judge.\" \"A story hook builds warmth but costs 15 seconds you can't spend on\n  weighing.\" The user chooses against tradeoffs, not against a leaderboard.</li>\n<li><strong>Separate what's learnable from what's innate.</strong> Pacing and structure are copyable.\n  Charisma is not. Say which is which so practice time goes where it pays.</li>\n</ul>\n<h2>Output → <code>patterns/synthesis.md</code></h2>\n<p>Organize by dimension (pacing, structure, rhetoric, vocabulary), each as a short menu:</p>\n<pre><code class=\"language-markdown\">## Openings\nObserved across 5 speeches (3 high-confidence):\n- **Cold thesis** (Speaker A, C): straight to the claim. Tradeoff: authoritative, but\n  no warmth banked before the ask.\n- **Story hook** (Speaker B, D): 10–15s narrative. Tradeoff: builds the room, costs\n  weighing time. E divergent — opened with a rhetorical question, neither camp.\n\n→ *For your voice: which of these fits how you actually want to sound? (Not decided here.)*\n</code></pre>\n<p>That closing prompt is the point. Synthesis <strong>surfaces and frames</strong>; it does not decide.\nThe decision is the user's, and it lands in <code>my-style/voice.md</code> — which this skill does\n<strong>not</strong> write.</p>\n<h2>Hard boundary</h2>\n<p>This skill reads <code>corpus/</code> and writes <code>patterns/</code>. It <strong>must not</strong> write <code>my-style/</code> and\n<strong>must not</strong> be invoked by <code>congress-write</code>. The firewall runs right through here: patterns\nare raw material for a human choice, not a style the machine adopts.</p>\n<h2>Report</h2>\n<p>The sharpest divergence you found (the clearest \"two valid ways to do this\"), and how thin\nthe corpus still is — how many more speeches, and of what type, would make the patterns\ntrustworthy.</p>"}, {"id": "d15", "title": "Skill: congress-write", "group": "Agent guidelines", "html": "<hr />\n<p>name: congress-write\ndescription: Draft a Congress speech on a bill in YOUR voice, from your style spec. Final stage. Takes a bill slug (and optionally speech type) as args. Reads ONLY your voice spec — never the champion corpus.</p>\n<hr />\n<h1>Congress write</h1>\n<p>Read <a href=\"../../../congress/CONGRESS.md\">congress/CONGRESS.md</a> first. This is a <strong>case-writer</strong>\nrole: <strong>persona ON</strong> — writing is the one task where a persona measurably helps.</p>\n<p>But the persona is <strong>you</strong>, built from <code>my-style/voice.md</code>. Not a champion. Not \"an\nexpert Congressional debater.\" You.</p>\n<h2>THE FIREWALL — read before doing anything</h2>\n<p>This skill reads <strong>only</strong>:\n- <code>congress/my-style/voice.md</code> — how <em>you</em> sound\n- <code>congress/bills/&lt;slug&gt;/</code> — the bill and your position</p>\n<p>This skill must <strong>never</strong> read <code>congress/corpus/</code> or any <code>analysis.md</code> or <code>transcript.json</code>.\nNot for inspiration, not \"just to check phrasing,\" not ever. If the corpus enters this\ncontext, the output drifts into champions' sentences and becomes plagiarism — an NSDA\nintegrity violation — without anyone noticing the moment it happens.</p>\n<p>If <code>voice.md</code> is empty or missing, <strong>stop.</strong> Do not fall back to the corpus to figure out a\nstyle. Tell the user their voice spec doesn't exist yet and that it's built by choosing from\n<code>patterns/synthesis.md</code>, by hand, by them. A speech written without a voice spec is either\ngeneric or stolen; there is no third option.</p>\n<h2>Writing the speech</h2>\n<p>From <code>voice.md</code> and the bill:</p>\n<ul>\n<li>Match <strong>your</strong> pacing target, sentence-length habits, and rhetorical preferences as the\n  spec records them.</li>\n<li>Structure to the speech type (authorship frames, refutation clashes, crystallization\n  synthesizes) — but in your structural habits, not a template's.</li>\n<li>Congress rewards accessible force. Warrants in plain language, impacts a chamber feels.</li>\n<li>Hit the time. Congress speeches are ~3 minutes; write to the word count your own WPM\n  implies, not a generic one.</li>\n</ul>\n<h2>After writing — the self-check</h2>\n<p>Before returning the speech, verify the firewall held:\n- The only sources in context were <code>voice.md</code> and the bill. Confirm it.\n- If any corpus material somehow reached this context, <strong>discard the draft and restart\n  clean.</strong> A contaminated draft cannot be cleaned by editing — the phrasing is already\n  anchored.</p>\n<p>The repo's verification step greps generated speeches against the corpus for 6-word\nverbatim runs. Write as if that grep is watching, because it is.</p>\n<h2>Output</h2>\n<p><code>congress/bills/&lt;slug&gt;/speech-&lt;type&gt;-&lt;date&gt;.md</code>. Report: the speech, its read-time against\nyour WPM, and which parts of your voice spec were thin enough that you had to improvise —\nthose are the gaps to fill in <code>voice.md</code>.</p>"}, {"id": "d16", "title": "Skill: cut-cards", "group": "Agent guidelines", "html": "<hr />\n<p>name: cut-cards\ndescription: Cut properly cited evidence cards from real, fetched sources for the current PF topic. Use when building a case, filling an evidence gap, or answering an opposing argument. Takes a claim or research question as args.</p>\n<hr />\n<h1>Cut cards</h1>\n<p><strong>Follow <a href=\"../../../EVIDENCE-STANDARD.md\">EVIDENCE-STANDARD.md</a></strong> — the champion-level\ncard-cutting method (anatomy, no-paraphrase/ellipsis/clipping/power-tagging rules,\nmandatory author qualifications, highlighting). This skill applies it to the current topic.</p>\n<p>A card is a verifiable object, not a summary. This skill produces cards we can\nhand to an opposing team during an evidence challenge without embarrassment.</p>\n<h2>The hard rule</h2>\n<p><strong>Every card must come from a source fetched in this session.</strong> Not recalled, not\nreconstructed, not inferred from a search snippet. Fetch the source, read the\npassage, quote it.</p>\n<p>If a source is paywalled, 404s, or can't be retrieved: the card does not exist.\nWrite the gap into the brief and move on. Do not substitute a similar source and\nkeep the original citation. Do not quote from an abstract and cite the paper as\nthough you read it — cite the abstract.</p>\n<p>Fabricating or approximating a citation is worse than having no card. It loses\nrounds, and if it survives to a real tournament it's an integrity problem with\nyour name on it.</p>\n<h2>Card format</h2>\n<p>One card per file: <code>topics/&lt;slug&gt;/evidence/&lt;side&gt;-&lt;claim-slug&gt;.md</code></p>\n<pre><code class=\"language-markdown\">---\nclaim: &lt;the one-sentence claim this card supports&gt;\nside: pro | con | both | prep-out\nstrength: A | B | C\naccessed: YYYY-MM-DD\n---\n\n**&lt;Author last name&gt; &lt;year&gt;** — &lt;Full author name&gt;, &lt;credential — why this person\nis qualified to say this&gt;, &quot;&lt;Title&gt;&quot;, *&lt;Publication&gt;*, &lt;full date&gt;. &lt;URL&gt;\n\n&gt; &lt;Verbatim quoted text. Ellipsis only where the omitted material does not change\n&gt; meaning. Never splice two separate passages into one quote.&gt;\n\n**Warrant:** &lt;why the quoted text actually supports the claim — the logical step,\nstated plainly&gt;\n\n**Vulnerable to:** &lt;the strongest honest attack on this card — author bias, small\nn, old data, correlational, funded by an interested party, contradicted by X&gt;\n</code></pre>\n<h2>Strength grading</h2>\n<ul>\n<li><strong>A</strong> — primary source, qualified author, recent, directly on point, method\n  visible.</li>\n<li><strong>B</strong> — reputable secondary source, or primary but slightly off-point / dated.</li>\n<li><strong>C</strong> — usable but weak: advocacy org, op-ed, thin method, or the warrant needs\n  a leap. Fine for a lay judge, will get called out on circuit.</li>\n</ul>\n<p>Grade honestly. The <code>vulnerable to</code> field is not optional and not a formality —\nit's what makes the self-debate skill able to attack our own evidence, and it's\nwhat stops us from building a case on cards that fold under one question.</p>\n<h2>Process</h2>\n<ol>\n<li>Search for the <em>primary</em> literature, not commentary about it.</li>\n<li>Fetch candidate sources. Read the actual passage.</li>\n<li>Quote verbatim. Check the quote against the source once more before writing.</li>\n<li>Note the credential — \"researcher\" is not a credential; \"Professor of\n   Atmospheric Science, MIT\" is.</li>\n<li>Fill <code>vulnerable to</code> before you consider the card done.</li>\n</ol>\n<h2>Paraphrasing for case copy</h2>\n<p>Case text paraphrases; the card file holds the verbatim. When paraphrasing into a\ncase, the paraphrase must be defensible against the quoted text — if a judge reads\nthe card and it doesn't say what the case claimed, that's a miscut, which is a\nworse look than a weak card honestly stated.</p>"}, {"id": "d17", "title": "Skill: judge-model", "group": "Agent guidelines", "html": "<hr />\n<p>name: judge-model\ndescription: Model what actually wins in front of judges. Two frontier judges score a debated round independently, and their reasoning accumulates into a persistent, cross-topic model of judge preferences. Use after self-debate, or standalone to update the judge model from a real round result.</p>\n<hr />\n<h1>Judge model</h1>\n<p>Read <a href=\"../../../HANDBOOK.md\">HANDBOOK.md</a> first. This is a <strong>judge</strong> role: persona ON,\nbut you judge only on the paradigm you're given, and you never invent facts about a real\nperson.</p>\n<p>The premise: rounds aren't won on paper, they're won in front of a specific human. This\nskill builds a persistent picture of what those humans reward, so prep can aim at the\nballot instead of at abstract correctness.</p>\n<h2>Two judges, both frontier, both \"the real decision\"</h2>\n<p>The self-debate panel uses <em>structural</em> judges — lay, flow, evidence — to expose how a\nround plays to different archetypes. This skill is different: it runs <strong>two independent\nfrontier judges</strong> who each render the <em>actual ballot</em> — the whole round, full reasoning,\nno assigned quirk beyond a real paradigm. Two, not one, because a single judge is a point\nestimate and the disagreement between two is the signal. Where they split is exactly where\nthe round is genuinely close, and that's what the user needs to know.</p>\n<p>Frontier only — no exceptions. A budget model as judge returns a clean bill of health on a\nbroken case (handbook rule 5). A wrong ballot here poisons the accumulated model for every\nfuture topic.</p>\n<h2>Inputs</h2>\n<ul>\n<li>The debated round: cases + attacks + frontlines from the latest self-debate brief, OR</li>\n<li>A <strong>real round result</strong> the user reports (\"lost on the flow judge, they bought the\n  delink\") — this is the most valuable input the model gets, because it's ground truth.</li>\n</ul>\n<h2>What the two judges produce</h2>\n<p>Each writes an independent ballot: who won, the reason for decision, the single argument\nthat decided it, and what they didn't buy. Then compare:</p>\n<ul>\n<li><strong>Agreement</strong> → a robust read. Fold it into the model with confidence.</li>\n<li><strong>Disagreement</strong> → the interesting case. Record <em>both</em> ballots and what separated them.\n  Do not average them into a mush. \"Judge A voted on the prereq weighing, Judge B never\n  bought the link\" is the finding.</li>\n</ul>\n<h2>The persistent model</h2>\n<p>Accumulates at repo root in <code>judges/</code> — <strong>cross-topic</strong>, because a judge's tendencies\noutlast any one resolution.</p>\n<pre><code>judges/\n  what-wins.md        patterns across all rounds: which weighing mechanisms land,\n                      what kind of warrant persuades, where lay and flow diverge\n  archetypes/\n    lay.md            the parent volunteer: narrative, trust, jargon-aversion\n    flow.md           the ex-debater: extensions, drops, technical clash\n    traditional.md    stock/framework-first\n  named/\n    &lt;judge-slug&gt;.md   a SPECIFIC real judge — built ONLY from user observations\n</code></pre>\n<p><code>what-wins.md</code> is append-only and dated. Each entry ties a pattern to the round that\nproduced it, so a later reader can see the evidence, not just the claim.</p>\n<h2>The rule that protects real people</h2>\n<p>Archetype models (<code>lay.md</code>, <code>flow.md</code>) are fair game — they're composites, nobody in\nparticular.</p>\n<p>A <strong>named</strong> judge file may contain <strong>only</strong> what the user has actually observed or been\ntold — a posted paradigm, a past RFD, a reaction the user saw. <strong>Never infer a real\nperson's preferences from their name, school, region, or appearance, and never fabricate\na paradigm.</strong> If the user hasn't given you observations about a named judge, that file\ndoes not exist. Writing \"Judge Smith probably likes X\" because it's plausible is exactly\nthe fabrication the handbook forbids, aimed at a person instead of a card.</p>\n<h2>Output</h2>\n<p>Update <code>judges/</code>. Report: where the two judges split and why, the strongest what-wins\npattern this round reinforced or challenged, and — if a real result was the input — what\nthe model got wrong, because a model that only ever confirms itself is worthless.</p>"}, {"id": "d18", "title": "Skill: nightly-research", "group": "Agent guidelines", "html": "<hr />\n<p>name: nightly-research\ndescription: Scheduled deep research pass on the current PF topic — pursue open research questions, cut new cards, and leave a dated brief. Runs unattended on a schedule; also runnable by hand.</p>\n<hr />\n<h1>Nightly research</h1>\n<p>Runs without the user present. That constrains the design: it must be honest about\nwhat it didn't find, because nobody is watching it work.</p>\n<h2>Guard clause</h2>\n<p>Read <code>current-topic.md</code> first. If status is not <code>active</code>, <strong>stop immediately</strong> and\nwrite nothing. Between topic cycles this skill must be silent — a scheduled task\nthat produces filler because it had nothing to do trains the user to stop reading\nits output, which is the failure mode that kills every scheduled agent.</p>\n<h2>Pick the work</h2>\n<p>Read the most recent brief in <code>topics/&lt;slug&gt;/briefs/</code>. Work the open threads in\nthis priority order:</p>\n<ol>\n<li><strong>Evidence gaps flagged by the last self-debate</strong> — claims we argue but can't\n   card. Highest value: these are known holes.</li>\n<li><strong>Unanswered attacks</strong> — the last brief's \"no good answer\" item. Look for the\n   card or the reframe that answers it.</li>\n<li><strong>Open research directions</strong> from <code>resolution.md</code> not yet closed.</li>\n<li><strong>Topic drift</strong> — news since the last run. PF topics are current-events-driven\n   and a month-old evidence base decays. Check whether anything happened that\n   changes a link chain.</li>\n</ol>\n<p>Pick 2–4 threads. Depth beats breadth on an unattended run — four real cards beat\ntwenty search snippets.</p>\n<h2>Do the work</h2>\n<p>Use <code>/cut-cards</code> rules for anything that becomes a card: fetch the source, quote\nverbatim, grade honestly, fill <code>vulnerable to</code>.</p>\n<p>For each thread, the deliverable is one of:</p>\n<ul>\n<li>A card, filed in <code>evidence/</code></li>\n<li>A <strong>negative result</strong>: \"looked for X, the literature doesn't support it, here's\n  what it says instead\" — this is genuinely valuable and must not be suppressed.\n  Finding that our own argument has no evidence behind it is a <em>good night's work</em>\n  and should be reported as such, not buried.</li>\n<li>A specific reason the thread is blocked (paywall, no primary source exists)</li>\n</ul>\n<h2>Write the brief</h2>\n<p><code>topics/&lt;slug&gt;/briefs/YYYY-MM-DD-research.md</code>:</p>\n<pre><code class=\"language-markdown\"># Research brief — YYYY-MM-DD\n\n## Bottom line\n&lt;2–3 sentences. What would change how we debate this? If nothing, say &quot;nothing\nmaterial&quot; — do not manufacture significance.&gt;\n\n## Threads worked\n### &lt;thread&gt;\n&lt;what was found, or honestly not found. Link cards by filename.&gt;\n\n## New cards\n- `evidence/&lt;file&gt;` — &lt;claim&gt; (grade)\n\n## Negative results\n&lt;claims we tried to support and couldn't. Name them plainly.&gt;\n\n## Still open\n&lt;threads for tomorrow&gt;\n</code></pre>\n<h2>Rules for unattended runs</h2>\n<ul>\n<li><strong>Never fabricate a card.</strong> The absence of supervision makes this rule more\n  important, not less.</li>\n<li><strong>Never pad.</strong> A brief that says \"nothing material today, two threads still\n  blocked on paywalls\" is a good brief. Three pages of restated background is not.</li>\n<li><strong>Never rewrite yesterday's brief.</strong> Append-only.</li>\n<li>Do not touch <code>cases/</code> or <code>blocks/</code> — research feeds them, but changing case copy\n  is a decision the user makes awake.</li>\n<li>If something genuinely urgent surfaces (a ruling, a study that guts a core\n  contention), lead the brief with it.</li>\n</ul>"}, {"id": "d19", "title": "Skill: prep-topic", "group": "Agent guidelines", "html": "<hr />\n<p>name: prep-topic\ndescription: The full PF pipeline. Give it a resolution and it runs analysis, research, both cases, self-debate, blocks, and a brief end to end. Use when a new topic drops and you want everything. Takes the resolution text as args.</p>\n<hr />\n<h1>Prep topic — the pipeline</h1>\n<p>Read <a href=\"../../../HANDBOOK.md\">HANDBOOK.md</a> first. This is the <strong>orchestrator</strong> role. You\nroute and decide; you are bound by the same rules as everyone you route to.</p>\n<p>This is the \"app\": one resolution in, a full prep file out. It runs the other skills in\norder. You stay in the loop between stages — read each output before starting the next,\nbecause a bad stage should stop the line, not feed garbage downstream.</p>\n<h2>Setup</h2>\n<ol>\n<li>Slugify the resolution → <code>&lt;slug&gt;</code>. Create <code>topics/&lt;slug&gt;/</code>.</li>\n<li>Write <code>current-topic.md</code> from the template: resolution text, cycle, date, slug,\n   status <code>active</code>.</li>\n<li>Announce the plan and the stop points below, so a human returning mid-run knows where\n   it is.</li>\n</ol>\n<h2>The line</h2>\n<p>Run these in order. <strong>Each stage has a gate</strong> — a condition that must hold before the\nnext stage is worth running. A gate that fails stops the line and reports; it does not\npush through, because every downstream stage would inherit the defect.</p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Stage</th>\n<th>Skill</th>\n<th>Gate before proceeding</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Analysis</td>\n<td><code>/topic-analysis</code></td>\n<td>Ground assessment exists and names which side is favored.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Research</td>\n<td><code>/cut-cards</code> (loop)</td>\n<td><strong>≥ 8 verified cards</strong>, both sides represented. Fewer → cases argue from priors.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Cases</td>\n<td><code>/write-case both</code></td>\n<td>Both cases written blind, each with a non-empty uncarded-claims list.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Self-debate</td>\n<td><code>/self-debate</code></td>\n<td>Ran to synthesis. Produced attacks, judge ballots, and a named collapse per side.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Blocks</td>\n<td><code>/blocks both</code></td>\n<td>Every surviving attack has a frontline; time budget checked.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Judge model</td>\n<td><code>/judge-model</code></td>\n<td>Round scored; what-wins patterns written to <code>judges/</code>.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Brief</td>\n<td>(synthesize)</td>\n<td>Dated brief in <code>briefs/</code> leading with what matters.</td>\n</tr>\n</tbody>\n</table>\n<h2>Cost routing (from the handbook)</h2>\n<ul>\n<li>Stages <strong>2 (research)</strong> and the fetching inside it are cheap-model work. If running\n  unattended, that's <code>deepseek-v4-flash</code> via <code>run-nightly-research.ps1</code>.</li>\n<li>Stages <strong>4 and 6 (self-debate, judging)</strong> are frontier-only. Budget models return a\n  clean bill of health on a broken case — measured, see handbook rule 5. Never route\n  these to the cheap backend.</li>\n<li>Stage <strong>3 (case writing)</strong> is persona-on frontier work; it's small, don't scrimp.</li>\n</ul>\n<h2>Where to stop and ask a human</h2>\n<p>Most of this runs unattended. Three points genuinely need a person, and the orchestrator\nshould pause and surface rather than guess:</p>\n<ul>\n<li><strong>After stage 1</strong>, if analysis says the topic is lopsided (one side 70/30+). That\n  changes how prep time should be spent, and it's the user's call.</li>\n<li><strong>After stage 4</strong>, if self-debate finds an attack neither side can answer. That's not a\n  prep problem to paper over — it may mean the case strategy is wrong.</li>\n<li><strong>Any stage's gate fails twice.</strong> Don't loop forever burning tokens. Report the\n  blockage and what's needed.</li>\n</ul>\n<h2>Output</h2>\n<p>A complete <code>topics/&lt;slug&gt;/</code> and a top-line report: the ground call, each side's collapse,\nthe turns found, the biggest evidence gap, and the strongest attack we can't answer.\nLead with what a returning human most needs to know, not a recap of the pipeline.</p>\n<h2>Honest note on what this is not</h2>\n<p>This produces a <em>strong first prep file</em>, not a finished one. It cannot watch rounds,\ncannot read a specific judge's face, and cannot know what the local circuit is running.\nIt gets you to the point where a human's time is spent refining rather than starting.\nSay that in the report — overselling it is the one thing that makes it dangerous.</p>"}, {"id": "d20", "title": "Skill: run-round", "group": "Agent guidelines", "html": "<hr />\n<p>name: run-round\ndescription: Run one deep PF round (ROUNDS.md v2) — fog-of-war team prep, full speech sequence with research windows, argument-resolution phase, then frontier judging, extraction, and promotion. Takes a topic slug and two team names.</p>\n<hr />\n<h1>Run round</h1>\n<p>Read <a href=\"../../../ROUNDS.md\">ROUNDS.md</a> first — this skill executes that spec.</p>\n<h2>The engine (built &amp; verified 2026-07-18)</h2>\n<p>Three scripts in <code>tools/</code>, all on DeepSeek V4 Pro via the Anthropic-compat endpoint:</p>\n<ul>\n<li><code>agent_loop.py</code> — sandboxed agent runner. Fog of war is <strong>code-enforced</strong>: reads\n  limited to own team dir + public topic files; writes to own team dir only; fetch_url\n  and server-side web_search (verified working on DeepSeek) exist only when\n  <code>research=True</code>. All calls <code>max_tokens ≥ 8000</code> (reasoning-budget rule).</li>\n<li><code>prep_team.py &lt;round_dir&gt; &lt;team&gt; &lt;side&gt;</code> — 3-stage prep: charter+research+cards →\n  case.md → blocks.md+strategy.md.</li>\n<li><code>run_round.py &lt;round_dir&gt;</code> — the full deep round: 13 steps (speeches, crossfires,\n  research windows) then the argument-resolution phase (contested list → deep-clash\n  loops, all four doctrines rotating as attackers, until 2× NOTHING-NEW). Resumable\n  via <code>state.json</code>; transcript appends incrementally.</li>\n</ul>\n<h2>Procedure</h2>\n<ol>\n<li><strong>Setup:</strong> create <code>topics/&lt;slug&gt;/rounds/&lt;rN&gt;/</code>, coin-flip sides/order into\n   <code>setup.md</code> (see r1's for format). Teams from <code>debaters/</code> roster.</li>\n<li><strong>Prep (parallel, background):</strong> <code>python tools/prep_team.py &lt;round_dir&gt; &lt;team&gt;\n   &lt;side&gt;</code> for each side. Wait for both.</li>\n<li><strong>Round (background, 60–120 min):</strong> <code>python tools/run_round.py &lt;round_dir&gt;</code>.</li>\n<li><strong>Judges (FRONTIER — never DeepSeek, handbook rule 5):</strong> 3 Agent-tool judges using\n   the STANDARDIZED prompts in <a href=\"../../../tools/POSTROUND.md\">tools/POSTROUND.md</a> —\n   don't improvise new ones; consistency across rounds is what makes ballots\n   comparable. Write <code>ballots.md</code>.</li>\n<li><strong>Extraction (frontier):</strong> per argument — terminal state (exhausted-survives /\n   exhausted-dies-to-X / stalemate-on-gap), clash quality, charter audit, fog-of-war\n   grep (speech content appearing only in the OPPONENT'S private files = breach).\n   Write <code>extraction.md</code>; append <code>ledger.md</code>.</li>\n<li><strong>Promotion (frontier):</strong> revise canonical <code>cases/</code>, <code>blocks/</code>, <code>strategy.md</code> per\n   the quality-control rules (provenance-gated; defect fixes immediate, strategy\n   changes need 2+ rounds). Deep-clash exchanges become blocks nearly verbatim.\n   Research tickets → nightly-research queue. Update <code>playbook/</code>.</li>\n<li><strong>Reflection (MANDATORY, DeepSeek, ≤¥2 inside the round's ¥5):</strong> <code>python tools/\n   reflect_round.py &lt;round_dir&gt;</code> — co-equal with the round itself. Refuses to run\n   before ballots + extraction exist; evaluates process/results/feedback (reviewing\n   judge feedback, weighing, and every counter-argument is required, not optional);\n   appends improvements to the topic's self-contained <strong>PREP.md</strong>; runs a\n   client-readiness check; flips <code>reflected: true</code> in state.json. <strong>A round is not\n   complete until this has run</strong> — unreflected rounds are wasted spend. The\n   orchestrator reviews the PREP.md diff.</li>\n<li><strong>Accumulation audit (frontier):</strong> POSTROUND.md §4 — verifies USAGE (teams\n   deployed the mandatory PREP.md lessons), DEPTH (re-litigated clash started from\n   the prior frontier, no rediscovery), GROWTH (PREP.md appended correctly), LEDGER\n   (prior terminal states updated). Four PASS/FAIL verdicts with quoted evidence →\n   <code>accumulation-audit.md</code>. This is the test that the loop actually loops.</li>\n</ol>\n<h2>Watch for</h2>\n<ul>\n<li>DeepSeek balance: check <code>agent_loop.balance()</code> before starting; a full deep round\n  needs ~¥2.5 headroom. The runner prints balance at each phase.</li>\n<li>A <code>DENIED</code> line in a team's <code>round_log.jsonl</code> = attempted fog-of-war breach — note\n  it in extraction (it's a prompt-honesty signal, the sandbox already blocked it).</li>\n<li>Windows console is GBK: scripts write files UTF-8; don't pipe transcript through\n  consoles expecting clean unicode.</li>\n</ul>"}, {"id": "d21", "title": "Skill: self-debate", "group": "Agent guidelines", "html": "<hr />\n<p>name: self-debate\ndescription: Run an adversarial self-debate on the current PF topic — build both cases blind, attack every contention from multiple independent lenses, frontline the surviving attacks, and judge the exchange. Use to stress-test a case, find counters before an opponent does, or decide what to collapse to.</p>\n<hr />\n<h1>Self-debate</h1>\n<p>This is the core of the prep system. The premise: an argument you built is an\nargument you're bad at attacking, because you already believe it. The fix is\nindependence — agents that have never seen the case's reasoning, each assigned a\ndifferent way to break it, none of them rewarded for being agreeable.</p>\n<p>This skill calls the <strong>Workflow</strong> tool. That is intended — the user invoking this\nskill is the opt-in.</p>\n<h2>Before running</h2>\n<p>Check <code>current-topic.md</code> is active and <code>topics/&lt;slug&gt;/evidence/</code> has cards. Running\nself-debate on an empty evidence base produces confident nonsense — the agents will\nargue from priors instead of cards. If evidence is thin, say so and offer to run\n<code>/cut-cards</code> first.</p>\n<h2>Do NOT run this on a budget model</h2>\n<p>Measured 2026-07-17, identical prompt, a Pro contention with <strong>no solvency step at\nall</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Model</th>\n<th>Verdict</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Frontier (Opus)</td>\n<td>missing step is <em>absent</em>, \"not a joint — one bone and no articulation\" + found the turn</td>\n</tr>\n<tr>\n<td>DeepSeek V4 Pro</td>\n<td>\"fatal\" — found the missing step independently. Missed the turn.</td>\n</tr>\n<tr>\n<td>DeepSeek V4 Flash</td>\n<td><strong>\"severity: none — the link chain holds\"</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Flash <em>noticed</em> the missing step and then reasoned itself out of it. That is the\nfailure mode that matters: not a weaker attack, but a <strong>clean bill of health on a\nbroken case</strong>. A brief that says \"no holes found\" is indistinguishable from a brief\nthat found no holes, and you only learn which one it was in an elim round.</p>\n<p><code>run-nightly-research.ps1</code> routes to Flash deliberately — that job fetches and\ndrafts, it does not judge. <strong>Never point that routing at this skill.</strong> The attack\nlenses and judge panel are the one place the money is worth spending; V4 Pro is the\nfloor, and even it misses turns.</p>\n<h2>The workflow</h2>\n<p>Pass the resolution and evidence directory as <code>args</code>. Structure:</p>\n<p><strong>Phase 1 — Cases (barrier).</strong> Two agents, mutually blind, each reading only the\nresolution and the evidence base. One builds Pro, one builds Con. Blind matters:\nif the Con agent sees the Pro case, it writes rebuttals instead of a case, and we\nlose the independent read on what the ground actually is.</p>\n<p><strong>Phase 2 — Attack (pipeline, loop-until-dry).</strong> Every contention from both cases\nenters the pipeline. Each gets attacked by agents on <em>distinct lenses</em> — this is\nperspective-diverse verification, not redundancy, because a contention can fail in\nunrelated ways:</p>\n<ul>\n<li><strong>Link chain</strong> — does the internal link actually resolve, or does the case jump\n  from \"policy passes\" to \"impact happens\" with an unwarranted step?</li>\n<li><strong>Evidence quality</strong> — attack the cards themselves. Read the <code>vulnerable to</code>\n  field in each card file; that's a starting point, not a ceiling.</li>\n<li><strong>Impact calculus</strong> — is magnitude/probability/timeframe overstated? What's the\n  honest number?</li>\n<li><strong>Turn</strong> — can this offense be turned? Turns are the highest-value output here,\n  because a turn is offense we get for free on the other side of the flip.</li>\n<li><strong>Inherency / squo</strong> — is this already happening? Will it happen anyway? Does\n  the resolution actually change the outcome?</li>\n<li><strong>Framework</strong> — is there a weighing frame under which this contention, even if\n  fully true, doesn't matter?</li>\n</ul>\n<p>Loop attack rounds until <strong>two consecutive rounds surface nothing new</strong>. Dedup\nagainst everything seen so far, not against what survived — otherwise rejected\nattacks resurface every round and it never converges. Simple counters (<code>while\nattacks &lt; 10</code>) miss the tail, and the tail is where the attacks an actual opponent\nfinds tend to live.</p>\n<p><strong>Phase 3 — Frontline (pipeline).</strong> Each surviving attack goes back to its own\nside, which writes the tightest response it can. Constraint: the response must fit\nin second rebuttal alongside everything else. A frontline that takes 90 seconds is\nnot a frontline.</p>\n<p><strong>Phase 4 — Judge panel (parallel).</strong> Three judges, deliberately different:</p>\n<ul>\n<li><strong>Lay judge</strong> — a parent volunteer. Follows narrative, not the flow. Doesn't\n  know the topic. Votes on what felt true and clear.</li>\n<li><strong>Flow judge</strong> — ex-debater. Tracks dropped arguments, demands extensions,\n  rewards technical clash.</li>\n<li><strong>Evidence judge</strong> — reads the cards, not the claims. Votes on whether the\n  paraphrases survive contact with the actual quoted text.</li>\n</ul>\n<p>Divergence between these three is the most useful signal the whole system\nproduces. A contention the flow judge loves and the lay judge doesn't understand\nis a contention that loses at a local tournament and wins at a circuit one — and\nyou need to know which you're prepping for.</p>\n<p><strong>Phase 5 — Synthesis.</strong> One agent reads everything and produces:</p>\n<ul>\n<li>Which contentions survived, and which folded under which lens</li>\n<li><strong>Every turn found</strong> — flagged loud, these are the crown jewels</li>\n<li>The recommended collapse for each side (summary is 3 minutes; what do we go for?)</li>\n<li>Evidence gaps: claims we need a card for and don't have</li>\n<li>The strongest attack we have no good answer to (state it plainly — a system that\n  hides its own worst finding is worthless)</li>\n</ul>\n<h2>Output</h2>\n<p>Write to <code>topics/&lt;slug&gt;/briefs/YYYY-MM-DD-self-debate.md</code>. Append-only; never\noverwrite a prior brief. Update <code>blocks/</code> with the frontlines that survived.</p>\n<p>Then report to the user in prose: the turns, the collapse recommendation, and the\nattack we can't answer. Lead with what changed since the last run — not a recap of\neverything the workflow did.</p>\n<h2>Scale</h2>\n<p>Default: 6 lenses, 3-vote adversarial check on turns (turns are high-value and\nalso the most likely to be wishful thinking — verify them hard). If the user says\n\"quick\", drop to 3 lenses and skip the judge panel. If they say \"before a\ntournament\", widen the lens pool and add a second synthesis pass that asks what's\nmissing.</p>"}, {"id": "d22", "title": "Skill: topic-analysis", "group": "Agent guidelines", "html": "<hr />\n<p>name: topic-analysis\ndescription: Break down a new PF resolution into definitions, ground, and research directions. Run this once when a topic drops, before any card cutting. Takes the resolution text as args, or reads it from current-topic.md.</p>\n<hr />\n<h1>Topic analysis</h1>\n<p>The first 48 hours on a new topic decide the month. The goal here is <em>not</em> to\nstart cutting cards — it's to map the territory so that card cutting is aimed.</p>\n<h2>Steps</h2>\n<h3>1. Pin the resolution text exactly</h3>\n<p>Get the verbatim text from speechanddebate.org. Do not work from a paraphrase in\na blog post; wording disputes are real ground and a single word (\"substantially\",\n\"should\", \"on balance\") shifts burdens.</p>\n<h3>2. Definition map</h3>\n<p>For each term of art, find how it is actually defined in the relevant field —\nstatute, agency, standard-setting body, or dominant academic usage. For each:</p>\n<ul>\n<li>Whose definition is this?</li>\n<li>Which side does it advantage, and by how much?</li>\n<li>Is it <em>contestable</em> in PF? (PF has weak theory norms — a definition fight only\n  works if a lay judge can follow why it matters. Note this honestly.)</li>\n</ul>\n<p>Write to <code>topics/&lt;slug&gt;/resolution.md</code>.</p>\n<h3>3. Ground assessment</h3>\n<p>Before writing any case, answer:</p>\n<ul>\n<li>What does Pro <em>structurally</em> get? What's the core offense the resolution hands\n  them?</li>\n<li>Same for Con.</li>\n<li>Which side is favored on a clean read, and what does the underdog have to do to\n  win? (Often: reframe the weighing rather than out-evidence.)</li>\n<li>What is the <strong>squo</strong>? Con usually defends it — is it actually stable, or is\n  there a Con-side \"it's already happening / it'll happen anyway\" inherency\n  problem?</li>\n</ul>\n<p>Be honest here even when it's inconvenient. A system that flatters both sides\nequally is useless. If Pro is 60/40 favored, say so — that changes how we spend\nprep time.</p>\n<h3>4. Research directions</h3>\n<p>Produce 6–10 <em>specific, falsifiable</em> questions that research should answer. Not\n\"research data center energy use\" but \"what is the marginal grid emissions rate\nattributable to a new hyperscale facility in ERCOT vs PJM, and does it differ\nenough to matter?\"</p>\n<p>Good directions have this property: <strong>the answer could come back either way, and\nit would change what we argue.</strong> Directions whose answers we already assume are\nnot research, they're confirmation.</p>\n<h3>5. Write it</h3>\n<p>Output to <code>topics/&lt;slug&gt;/resolution.md</code>. Update <code>current-topic.md</code> status.</p>\n<p>Then report to the user: the ground call, the two or three highest-leverage\nresearch questions, and anything about the topic that looks like a trap.</p>\n<h2>Notes</h2>\n<ul>\n<li>Do not cut cards in this skill. Aim first.</li>\n<li>If prep from a prior year's similar topic exists in <code>topics/</code>, say so, but do\n  not load it wholesale — resolution wording differences invalidate more than\n  they preserve.</li>\n</ul>"}, {"id": "d23", "title": "Skill: write-case", "group": "Agent guidelines", "html": "<hr />\n<p>name: write-case\ndescription: Write speakable Pro and Con case copy for the current PF topic from the verified evidence base. Use after cards exist and before self-debate. Takes a side (pro/con/both) as args, defaults to both.</p>\n<hr />\n<h1>Write case</h1>\n<p>Read <a href=\"../../../HANDBOOK.md\">HANDBOOK.md</a> first. This is a <strong>case writer</strong> role:\npersona ON, and you may never claim what has no card.</p>\n<h2>Before writing</h2>\n<p>Check <code>topics/&lt;slug&gt;/evidence/</code> has cards. Writing a case on a thin evidence base\nproduces confident nonsense — you will argue from priors and call it a contention.\nIf there are fewer than ~6 cards, say so and offer <code>/cut-cards</code> first.</p>\n<h2>Build both sides, blind</h2>\n<p>The coin flip means you debate whichever side you're handed minutes before the round.\n<strong>Cases ship in matched pairs, always.</strong></p>\n<p>When writing both in one session, write Pro completely before reading anything Con,\nand vice versa. If one case is written with the other in view, it stops being a\nconstructive and becomes a rebuttal — you get pre-emptive answers instead of offense,\nand you lose the independent read on what the ground actually is.</p>\n<h2>Shape</h2>\n<p>4-minute constructive ≈ 900 words of speakable copy. Two contentions. Each needs:</p>\n<ul>\n<li><strong>Claim</strong> — the sentence a lay judge repeats back</li>\n<li><strong>Warrant</strong> — <em>why it's true</em>, in plain English. This is where cases die. A claim\n  with a card and no warrant is an assertion with a citation stapled to it.</li>\n<li><strong>Impact</strong> — what happens, weighed on named terms (magnitude / probability /\n  timeframe / scope / reversibility / prerequisite)</li>\n</ul>\n<p>Write for <strong>two altitudes at once</strong>: a lay parent follows the narrative; a flow judge\nfinds the signposting underneath. When they conflict, write for lay — the technical\nlayer lives in <code>blocks/</code>.</p>\n<h2>The uncarded claims list is not optional</h2>\n<p>For every claim with no card behind it, list it. <strong>Be ruthless and complete.</strong> An\nempty list on a small evidence base is a lie, and the list is the most valuable thing\nthis skill produces — it is what <code>/nightly-research</code> works from and what <code>/self-debate</code>\nattacks first.</p>\n<p>Be specific about <em>what kind</em> of gap each is:\n- no card exists in our base (fixable — research it)\n- claim is analytic, not evidentiary (fine, but say so; it can be contested)\n- figure came from our own annotations, not quoted source text (<strong>dangerous</strong> — do not\n  speak it as evidence)\n- it's our characterization of our own fiat (e.g. calling an unspecified moratorium\n  \"temporary\")</p>\n<h2>Read the opposition's best card out loud</h2>\n<p>If a card in our base cuts against us, <strong>do not bury it.</strong> Read it, then go after the\npart that actually limits it. This is not sportsmanship, it's tactics: a judge who\nhears it from us first discounts it when the opponent reads it, and an opponent who\nexpected to spring it has nothing left. It also stops us from building on a card whose\nown authors qualified it.</p>\n<h2>Planned collapse</h2>\n<p>3 minutes cannot extend a whole case. Name the single contention you go for in\nsummary, and <strong>be honest about why</strong>. \"This is the only offense that exists\" is a real\nanswer and a more useful one than \"this is our strongest.\"</p>\n<p>If the collapse target has a known weak link, say so in the plan. The team should know\ngoing in.</p>\n<h2>Output</h2>\n<p><code>topics/&lt;slug&gt;/cases/pro.md</code> and <code>con.md</code>. Then report to the user: the collapse for\neach side, the longest uncarded-claims entry, and the card you most need and don't have.</p>"}, {"id": "d24", "title": "Playbook (cross-topic patterns)", "group": "Agent guidelines", "html": "<h1>Playbook — cross-topic strategy patterns</h1>\n<p>Doctrine only, never cards (cards stale; see CLAUDE.md). Every entry carries\nprovenance. Teams read this during prep on ANY topic.</p>\n<h2>Judge-relative strength (3 replications: self-debate ballots ×1, r1 full round ×2)</h2>\n<p>Solvency/inherency presses win flow and evidence judges and <strong>backfire with lay\njudges</strong> — a parent hears \"the law won't work anyway\" as cynical dodging (\"a reason to\ngive up\"), especially wrapped in jargon. Corollary from r1: <strong>each doctrine team won\nexactly the judge its style targets</strong> (Narrators took lay, Technicians took flow).\nCase selection IS judge selection — scout the pool first.</p>\n<h2>In-round wins ≠ argument truth (r1)</h2>\n<p>CON's enforcement takeout won 2 of 3 ballots and then its strong form DIED in\ndeep-clash (statutes have bound presidents: Boland, OSTP-China). PRO's\ncongressional-capacity survived the speeches and died under exhaustion (zero ex-ante\nexamples). Never promote from ballots alone; the deep-clash column decides prep.</p>\n<h2>Mid-round research is peak miscut risk (r1, predicted then confirmed)</h2>\n<p>Both serious evidence violations in r1 were research-window cards: a reconstructed\ncitation (PRO's Koh) and a law-firm blog dressed as scholarship (CON). Window cards\nget the hardest audit, and any card cited in-speech must exist as a file — the\nprovenance gate blocked every deep-clash blockbuster from promotion because nobody cut\nthem.</p>\n<h2>The concede-then-reassert kill (r1, flow ballot)</h2>\n<p>Conceding a point in crossfire and re-asserting it in final focus is how flow judges\nend rounds (\"PRO conceded JAG never blocked a deployment, then rebuilt FF on JAG\").\nCrossfire concessions are permanent. Speak accordingly.</p>\n<h2>Answer quality gradient (r1, evidence ballot)</h2>\n<p>The round-deciding clash gets your BEST card, not your most convenient one. PRO\nanswered the dispositive enforcement attack with an undergraduate paper about a\ndifferent domain and lost both technical ballots on that single choice.</p>"}, {"id": "d25", "title": "Resolution & analysis", "group": "Topic: war-powers-congressional-approval", "html": "<h1>Topic analysis — War powers / congressional approval</h1>\n<p><strong>Resolution:</strong> Resolved: The United States should eliminate the President's authority\nto deploy military forces abroad without Congressional approval.\n<strong>Source:</strong> NSDA PF, April 2026 monthly topic.\n<strong>Slug:</strong> war-powers-congressional-approval\n<strong>Status:</strong> SIMULATION (top-to-bottom pipeline test, 2026-07-17). Not the live Sept/Oct\ntopic — that drops Aug 1.</p>\n<h2>Terms of art</h2>\n<ul>\n<li><strong>\"Deploy military forces abroad\"</strong> — the fight is here. Does it mean full-scale war,\n  or any use of force (strikes, raids, drones)? Con lives in the gap: Article I gives\n  Congress the power to <em>declare war</em>, but a limited strike is arguably not a \"war.\"\n  Pro wants \"deploy\" read broadly; Con wants it narrowed to declared wars.</li>\n<li><strong>\"Eliminate the authority\"</strong> — statutory or constitutional? Presidents claim Article\n  II. A statute cannot repeal a constitutional claim, which is the heart of the Con\n  solvency press.</li>\n<li><strong>\"Without Congressional approval\"</strong> — does existing AUMF-style pre-authorization\n  count? If Congress can pre-authorize broadly (as in 2001), the resolution changes less\n  than it appears.</li>\n<li><strong>Emergency carve-out</strong> — the resolution is silent on genuine attacks. Both sides will\n  claim the silence: Pro says obviously self-defense is exempt; Con says the silence\n  means dangerous rigidity.</li>\n</ul>\n<h2>Ground assessment</h2>\n<p><strong>Roughly balanced, with Pro holding the framing edge and Con holding the solvency edge.</strong></p>\n<ul>\n<li><strong>Pro gets:</strong> the constitutional high ground (Madison, \"studied care\"), a documented\n  harm (Burns — congressional abdication, unchecked executive war), and a clean\n  narrative (restore the intended default). Pro's job is to make this an <em>originalist\n  correction</em>, not a novel restriction.</li>\n<li><strong>Con gets:</strong> the strongest structural argument (executive speed in emergencies — Yoo/\n  Federalist 70) and, more importantly, <strong>inherency/solvency</strong> (govfacts — presidents\n  ignore statutory limits anyway). Con's best path is not \"the president should have this\n  power\" but \"your resolution doesn't work.\"</li>\n<li><strong>The squo:</strong> presidents deploy force unilaterally, claim Article II, and route around\n  the 1973 War Powers Resolution. Con defends this as functional flexibility; Pro attacks\n  it as abdication. <strong>Note the trap:</strong> Burns (Pro's harm card) and govfacts (Con's\n  solvency card) describe the <em>same fact</em> — congressional passivity — from opposite ends.\n  Whoever frames that shared fact better wins the round.</li>\n</ul>\n<h2>Highest-leverage research questions</h2>\n<ol>\n<li>Does \"deploy forces\" in the resolution's own framing cover limited strikes, or only\n   declared war? (Definitional — decides how much ground each side gets.)</li>\n<li>Is there a real-world case where requiring approval demonstrably <em>prevented</em> a bad\n   deployment, or demonstrably <em>caused</em> a security failure? (Both sides need the\n   empirical, not just the theoretical.)</li>\n<li>Can a statute meaningfully bind a president who claims Article II authority, or is the\n   solvency takeout fatal? (This is the round.)</li>\n<li>Does congressional pre-authorization (AUMF) make the resolution near-meaningless?</li>\n</ol>\n<h2>Prep status</h2>\n<ul>\n<li>[x] Topic analysis</li>\n<li>[x] Cards (4 — 2 Pro, 2 Con; below the 8-card gate, flagged as scoped simulation)</li>\n<li>[ ] Cases → self-debate → blocks → judge-model → brief</li>\n</ul>"}, {"id": "d26", "title": "PRO case", "group": "Topic: war-powers-congressional-approval", "html": "<h1>PRO CASE — War Powers</h1>\n<p><em>Resolved: The United States should eliminate the President's authority to deploy\nmilitary forces abroad without Congressional approval.</em></p>\n<hr />\n<h2>THE CASE (read-aloud, ~750 words / 4:00)</h2>\n<p><strong>Framework.</strong> The question before you is not whether America can defend itself — it\nplainly can and will. The question is <em>who decides</em> when America goes to war. We ask you\nto weigh two things above all: <strong>legitimacy</strong> — whether the decision is made the way the\nConstitution requires — and <strong>reversibility</strong> — whether a mistake can be undone. On both,\nPro wins, so we affirm.</p>\n<p><strong>Contention 1 — The Constitution's Studied Care.</strong>\n<em>Claim:</em> The Constitution deliberately placed the decision to go to war with Congress, not\nthe president.\n<em>Warrant:</em> The framers did this on purpose, and told us why. James Madison wrote that the\nConstitution \"with studied care, vested the question of war in the Legislature\" —\n<em>because</em>, in his words, the executive is \"the branch of power most interested in war, and\nmost prone to it.\" They feared exactly the person most tempted to use force, so they took\nthe choice out of his hands alone.\n<em>Link:</em> Eliminating the president's unilateral authority does not invent a new limit on the\npresidency. It <em>restores</em> the default the founders built — the rule that one person may\nnever commit the nation to war by himself. The status quo, where presidents deploy first\nand inform Congress later, is the deviation; the resolution is the correction.\n<em>Evidence:</em> Madison, Helvidius (1793); Article I, Section 8, vesting the war power in\nCongress.\n<em>Impact:</em> Legitimacy and reversibility. A war begun by one person's order can begin in an\nafternoon and cannot be taken back once soldiers are committed. A war that must first\nsurvive congressional deliberation has to survive daylight — public argument, a recorded\nvote, accountability. That friction is not a flaw in the design. It <em>is</em> the design, and\nit is the strongest protection a democracy has against its own worst impulses.</p>\n<p><strong>Contention 2 — The Abdication Harm.</strong>\n<em>Claim:</em> The status quo is not a balance of powers — it is congressional surrender, and it\ncompounds.\n<em>Warrant:</em> Congress has stopped defending its own authority. Professor Sarah Burns of RIT\nfinds that Congress \"has for the most part registered only feeble and ineffective\nopposition to such executive action.\" Presidents of both parties stretch twenty-year-old\nauthorizations far past anything Congress ever voted for, and Congress does nothing. Every\nunanswered deployment becomes the precedent for the next one — the power ratchets one\ndirection only.\n<em>Link:</em> The resolution changes the default rule. Today, congressional silence means the\npresident acts. Under the resolution, silence means restraint — the burden flips onto the\nperson who wants to use force to first go and win permission.\n<em>Evidence:</em> Burns, <em>The Conversation</em> (2026).\n<em>Impact:</em> Weigh this on magnitude and precedent. The harm is not one bad war. It is the\npermanent transfer of the gravest power a government holds — the power to kill in the\nnation's name — from the many to the one. That is a structural loss to democracy itself,\nand structural losses do not reverse on their own.</p>\n<p><strong>Weighing.</strong> Con will tell you the president needs speed. But speed is only a virtue if\nthe destination is right, and their own founding authority says the executive is the one\n\"most prone to war.\" Prefer the branch the Constitution trusted with this decision.\nLegitimacy comes before convenience, because a fast war is not a good war — it is only a\nfast one. We affirm.</p>\n<hr />\n<h2>BACKUP / ALTERNATE CONTENTIONS (below the 4-min line — swap in per strategy)</h2>\n<p><strong>Alt — Allied Trust / Signaling</strong> <em>(use vs. a Con that concedes the domestic story and\ngoes fully to \"flexibility\"):</em> unilateral deployments make U.S. commitments look\npersonal and reversible to allies; congressional authorization signals durable national\ncommitment. <em>(Needs a card — not yet cut. Do not run uncarded.)</em></p>\n<hr />\n<h2>CASE STRATEGY</h2>\n<p><strong>Collapse:</strong> Go for <strong>C1 (Studied Care)</strong>, carry C2 as the harm that makes it matter.\nC1 is the safest ground — it reframes Pro as <em>restoration</em>, which neutralizes \"the\npresident needs flexibility\" before Con runs it (you don't get flexibility the\nConstitution never granted). In summary: extend Madison for the default, Burns for why\nthe default is broken now, and weigh legitimacy over speed.</p>\n<p><strong>The enforcement problem is answered in the block file, NOT the case.</strong> Con's strongest\nattack is \"the law won't work — presidents ignore statutes.\" Do not pre-empt it in the\nconstructive; keep the case clean. When it comes, go to <code>pro-blocks.md</code> → \"vs. Doesn't\nSolve / Inherency\" (the Boland/OSTP module). This is Pro's single most important block —\nhave it loaded before round one.</p>\n<p><strong>⚠️ The Hulme card is a landmine — do not lead with it.</strong> It contains language Con turns\ninto \"the resolution is unnecessary for major war.\" Use it only narrowly and only with the\nBoland answer pre-loaded (see block file).</p>\n<h3>Adaptive tree (if we speak second, or on hearing Con's case)</h3>\n<ul>\n<li><strong>IF Con leads inherency (\"won't work\")</strong> → they are conceding the moral question. Lean\n  hard into C1 legitimacy, and answer solvency with Boland/OSTP. Press in crossfire: \"name\n  one case in 235 years where waiting for Congress harmed America\" — it wins lay and flow.</li>\n<li><strong>IF Con leads speed/executive-energy</strong> → run the Madison→Hamilton turn (block file):\n  their own author says the executive is \"most prone to war,\" so speed is the danger, not\n  the safety. Concede the narrow self-defense core survives; force them to defend one-person\n  <em>offensive</em> war.</li>\n<li><strong>IF Con runs the emergency carve-out (\"your statute has no exception\")</strong> → block file\n  B2 (burden-shift / avoidance canon). Note this is currently analytic — mitigate, don't\n  over-invest.</li>\n<li><strong>IF the panel is lay</strong> → collapse to the one-person-war story, drop the case-law, keep\n  it plain. <strong>IF the panel is technical</strong> → lead the Boland enforcement answer by name and\n  weigh comparatively.</li>\n</ul>\n<p><em>(Adaptive notes accumulate here after each simulation round.)</em></p>"}, {"id": "d27", "title": "CON case", "group": "Topic: war-powers-congressional-approval", "html": "<h1>CON CASE — War Powers</h1>\n<p><em>Resolved: The United States should eliminate the President's authority to deploy\nmilitary forces abroad without Congressional approval.</em></p>\n<hr />\n<h2>THE CASE (read-aloud, ~750 words / 4:00)</h2>\n<p><strong>Framework.</strong> Pro has to prove two separate things, and they only talk about one. They\nhave to prove eliminating this authority is <em>right</em> — and that it would actually <em>work</em>.\nWe ask you to weigh on <strong>probability</strong>: vote on what will actually happen in the world,\nnot on what the resolution's text wishes would happen. On that standard the resolution\nfails, and we negate.</p>\n<p><strong>Contention 1 — The Resolution Doesn't Solve.</strong>\n<em>Claim:</em> Eliminating the president's authority on paper does not change what presidents\nactually do.\n<em>Warrant:</em> We have already run this experiment. The 1973 War Powers Resolution was written\nto force Congress into the war decision — and for fifty years, across both parties,\npresidents have \"consistently circumvented or ignored\" it: redefining operations to dodge\nits triggers, invoking other legal authorities, or simply ignoring congressional demands.\nThe reason is structural: the president's power to deploy is claimed under Article II of\nthe Constitution, and you cannot repeal the Constitution with a resolution.\n<em>Link:</em> And here is the trap in Pro's own case. Their harm evidence — Burns — says Congress\noffers only \"feeble and ineffective opposition.\" Grant it. That is <em>our</em> argument. A\nCongress unwilling to defend the authority it already has will not suddenly wield new\nauthority handed to it on paper. Pro can win every word about what <em>should</em> happen and not\nmove a single deployment.\n<em>Evidence:</em> the fifty-year compliance record of the War Powers Resolution; Pro's own Burns\ncard on congressional passivity.\n<em>Impact:</em> Probability. If the resolution changes nothing in practice, it carries none of\nPro's benefits — you are voting for a symbol. And a symbol that looks like a check, but\nisn't, is worse than honesty about where the power really sits.</p>\n<p><strong>Contention 2 — Energy in the Executive.</strong> <em>(backstop — see strategy)</em>\n<em>Claim:</em> The president's ability to act fast is a designed feature the country cannot\nsafely give up.\n<em>Warrant:</em> When the nation is genuinely attacked, the response cannot wait for 535 people\nto agree. Hamilton, Federalist 70: \"Decision, activity, secrecy, and dispatch will\ngenerally characterize the proceedings of one man in a much more eminent degree than the\nproceedings of any greater number,\" and executive energy \"is essential to the protection\nof the community against foreign attacks.\" The same founders who gave Congress the war\npower built a single, fast executive on purpose.\n<em>Link:</em> Eliminating unilateral deployment authority removes exactly that speed in the\nmoment it matters most — the hours after an attack, before Congress can convene.\n<em>Evidence:</em> Hamilton, Federalist 70 (quoted in the 2001 OLC analysis).\n<em>Impact:</em> Magnitude and timeframe. The cost of over-restraint does not show up on an\naverage day — it shows up in the one crisis where hesitation is fatal, and there it is\ncatastrophic and irreversible.</p>\n<p><strong>Weighing.</strong> Prefer probability over aspiration. Pro is asking you to trade a real,\nfunctioning system — where the president can act and Congress can push back through\nfunding and politics — for a paper rule its own evidence says will be ignored. Do not buy\na symbol at the price of speed. We negate.</p>\n<hr />\n<h2>BACKUP / ALTERNATE CONTENTIONS (below the 4-min line — swap in per strategy)</h2>\n<p><strong>Alt — Definitional Relocation</strong> <em>(strong vs. a Pro that leans on \"clear rule\"):</em>\n\"deploy\" is undefined; a president will re-label offensive action as core-Article-II\nself-defense or protection of nationals and self-judge the label — so the resolution's\nscope collapses to whatever the president says it is. <em>(Analytic; strong in a technical\nround, invisible to a lay judge — see strategy.)</em></p>\n<hr />\n<h2>CASE STRATEGY</h2>\n<p><strong>Collapse:</strong> Go for <strong>C1 (Doesn't Solve)</strong>. It is stronger and safer — it wins even if\nthe judge thinks Pro is morally right, and it runs off Pro's own evidence. Hold C2 as \"and\neven if you want to restrict him, here's why speed matters.\" <strong>Never let the round become a\nreferendum on whether we like the OLC / Yoo</strong> — C2's evidence is contestable (Fed. 70 is\nabout executive energy in office, not war initiation; Fed. 69 says the president is no\nmonarch). Lead solvency; keep energy in reserve.</p>\n<p><strong>Concede Cooper-Church up front, on our terms.</strong> Pro will bring counterexamples where\nstatutes constrained presidents (Boland, Cooper-Church, the Wolf/OSTP amendment). Do not\ndeny them — concede: yes, Cooper-Church worked, <em>because</em> it was a specific funding\nrestriction on a specific operation Congress was actively watching. That is the opposite of\na blanket prior-authorization requirement on every deployment. The resolution's generality\nis its enforcement weakness. Owning this beats getting caught by it.</p>\n<p><strong>⚠️ Lay-judge repair — this cost the last two practice rounds.</strong> A lay judge reads\ncase-law and acronyms as <em>dodging</em>. Two rules: (1) say the solvency point in plain English\n— \"presidents have ignored every law like this for fifty years, here are three examples\" —\nnever \"solvency\" or \"parchment barrier.\" (2) Have a one-sentence answer ready for \"name one\nFounder / one case where waiting hurt America\": Hamilton, Federalist 70, executive speed is\n\"essential to protection against foreign attacks.\" Do not answer with \"the question is\ncircular.\"</p>\n<h3>Adaptive tree (if we speak second, or on hearing Pro's case)</h3>\n<ul>\n<li><strong>IF Pro leads the legitimacy/Studied-Care story</strong> → do NOT fight the Constitution\n  head-on (you lose the lay judge). Concede the moral point out loud and pivot: \"we agree\n  Congress should matter — this law just doesn't make it matter.\" Go to C1 solvency.</li>\n<li><strong>IF Pro leads the abdication harm (Burns)</strong> → turn it: their evidence of a feeble\n  Congress is proof the resolution won't be enforced. Same card, our offense.</li>\n<li><strong>IF Pro pre-loads the Boland/OSTP enforcement answer</strong> → distinguish (specific funding\n  restriction ≠ blanket rule), and press: name the <em>mechanism</em> in THIS resolution that\n  makes a president comply. There isn't one.</li>\n<li><strong>IF the panel is lay</strong> → collapse to plain-English \"it won't work,\" drop the case-law,\n  and never dodge a plain question. <strong>IF technical</strong> → run the enforcement trilemma and\n  definitional-relocation, weigh probability hard.</li>\n</ul>\n<p><em>(Adaptive notes accumulate here after each simulation round.)</em></p>"}, {"id": "d28", "title": "PRO blocks", "group": "Topic: war-powers-congressional-approval", "html": "<h1>PRO BLOCKS — War Powers</h1>\n<p>Responses PRO runs against CON's arguments. Find the opposing argument, then pick the\nresponse type you need. Each: response · card (or <em>analytic</em>) · read-time.</p>\n<hr />\n<h2>vs. CON \"The Resolution Doesn't Solve / Inherency\" — <em>their round-winner; lead here</em></h2>\n<p><strong>⚠️ This is the block you must have loaded. If you lose enforcement to a technical judge,\nyou lose the round.</strong></p>\n<p><strong>TURN (offense — the strongest answer).</strong> Statutes HAVE bound presidents, and Con's own\nconcession proves it. The Boland Amendment cut off Contra funding; evading it became a\nfirst-rank scandal. The Wolf Amendment froze NASA-China cooperation for eight years after\na formal GAO violation finding. Cooper-Church demonstrably constrained Nixon. So a clear\nstatutory default doesn't just \"hope\" for compliance — it creates real legal and political\ncost. Their \"nothing changes\" claim is empirically false. · <em>ticket-2-boland-ostp-1.md,\nticket-2-boland-ostp-2.md</em> · ~30s</p>\n<p><strong>REBUTTAL.</strong> The 1973 WPR failed because of its <em>specific design</em> — the 60-day clock, the\nvague \"hostilities\" trigger, the Chadha veto problem — not because statutes are inherently\npowerless. This resolution changes the <em>default rule itself</em>, which the WPR never did. ·\n<em>analytic</em> · ~15s</p>\n<p><strong>MITIGATE.</strong> Even if compliance is imperfect, a clear rule raises the political price of\nviolation: \"the President is breaking the law\" is a front-page story, not a footnote. You\ndon't need 100% compliance to shift presidential behavior at the margin — and the margin is\nwhere the unnecessary wars live. · <em>analytic</em> · ~15s</p>\n<p><strong>OVERWEIGH.</strong> Even if you think solvency is uncertain, weigh the direction of the error.\nIf we pass the rule and it underperforms, we've lost little. If we keep the status quo, we\nguarantee the harm. Legitimacy is a reason to act even under uncertainty. · <em>analytic</em> ·\n~12s</p>\n<p><strong>FRONTLINE (when they say \"Article II can't be repealed by statute\").</strong> We're not\nrepealing Article II — we're setting the statutory default for the vast middle ground of\ndeployments that are <em>not</em> genuine self-defense. Their own framing concedes those are\npolicy choices, not constitutional necessities. · <em>analytic</em> · ~15s</p>\n<p><strong>⚠️ If you have NO Boland card in front of you:</strong> do not fight solvency head-on. Pivot to\nlegitimacy (\"the question is whether one person should have this power at all\") and go to\nthe Madison turn. Concede you can't guarantee compliance; make the round about <em>who should\ndecide</em>.</p>\n<hr />\n<h2>vs. CON \"Energy in the Executive\" (speed/Hamilton)</h2>\n<p><strong>TURN (offense — run every speech once they open C2).</strong> Their own author flips on them.\nMadison: the executive is \"the branch most interested in war, and most prone to it.\" So\nexecutive \"energy\" doesn't mean <em>safety</em> — it means a higher chance of rash, unnecessary\nwar. And Hamilton himself, Federalist 69, says the president is no monarch and cannot\ndeclare war — they quote Fed. 70 and hide Fed. 69. Requiring deliberation <em>improves</em>\nsecurity. · <em>pro-original-design-madison.md vs. con-executive-energy-yoo-2001.md — both in\nbase</em> · ~22s</p>\n<p><strong>MITIGATE (the carve-out).</strong> The resolution doesn't touch genuine self-defense against a\nsudden attack — that narrow Article II core survives. What it removes is <em>offensive</em>\ndeployment by one person's choice. So their \"hours after an attack\" scenario is not even in\nscope. Force them to defend one-person <em>offensive</em> war. · <em>analytic — assert the carve-out,\ndon't rest the round on it</em> · ~15s</p>\n<p><strong>INDICT.</strong> The C2 quote is Hamilton's, not the OLC's, and Fed. 70 is about executive\n<em>energy in office</em>, not the power to start wars. If they cite it as OLC authority for\nunilateral war-making, that's a miscut. · <em>analytic</em> · ~10s</p>\n<hr />\n<h2>vs. CON \"Definitional Relocation\" (president re-labels offense as Article II defense)</h2>\n<p><strong>REBUTTAL.</strong> This proves too much — it's an argument that <em>no</em> war-powers rule can ever\nwork, which a judge should reject as nihilism, not analysis. And a re-labeling that's\ntransparently pretextual is exactly what raises the political cost we described. · <em>analytic</em>\n· ~15s</p>\n<p><strong>OVERWEIGH.</strong> Even if some gaming relocates to the Article II label, the resolution still\ncaptures every deployment a president is <em>unwilling</em> to defend as self-defense — which is\nmost of them. Partial solvency on a structural harm still outweighs. · <em>analytic</em> · ~12s</p>\n<hr />\n<h2>vs. CON EMERGENCY-RIGIDITY (their warrant: a general ban with no written exception forces the president to break the law or wait during a real attack)</h2>\n<p><strong>DELINK — the statute never reaches defensive operations, so there's nothing to\nexcept.</strong> Their argument assumes the ban <em>covers</em> a genuine self-defense response in the\nfirst place. It doesn't: statutes are read against their constitutional backdrop, and the\nframers deliberately changed \"make war\" to \"declare war\" specifically to preserve the\npresident's power to repel sudden attacks. A court reads \"deploy\" in that light — so\nemergency self-defense was never in scope, and a missing \"exception\" for something outside\nthe statute's reach is not a gap. The link from \"no written exception\" to \"president must\nbreak the law\" is broken at step one. · <em>analytic — card needed: Ex parte Endo, 323 U.S.\n283; Barron &amp; Lederman on the avoidance canon</em> · ~30s</p>\n<p><strong>OVERWEIGH — even if it reaches emergencies, the avoidance canon resolves it in our\nfavor.</strong> Grant that the text is ambiguous about defensive ops. Courts must construe\nstatutes to avoid serious constitutional questions (<em>DeBartolo</em>, 485 U.S. 568), and\nstripping the president's defensive-war power is exactly such a question — so the\nambiguity is read to <em>include</em> an emergency exception automatically. Their dilemma\nrequires the anti-constitutional reading no court would adopt. · <em>analytic — card needed:\nDeBartolo</em> · ~20s</p>\n<p><strong>MITIGATE — worst case, it's a drafting detail, not a reason to keep one-person war.</strong>\nEven if the exception must be explicit, that's an amendment a sentence long; it is no\nreason to preserve unilateral <em>offensive</em> war-making, which is the actual question. ·\n<em>analytic</em> · ~12s</p>"}, {"id": "d29", "title": "CON blocks", "group": "Topic: war-powers-congressional-approval", "html": "<h1>CON BLOCKS — War Powers</h1>\n<p>Responses CON runs against PRO's arguments. Find the opposing argument, then pick the\nresponse type. Each: response · card (or <em>analytic</em>) · read-time.</p>\n<hr />\n<h2>vs. PRO \"The Constitution's Studied Care\" (Madison / original design)</h2>\n<p><strong>MITIGATE (do NOT rebut head-on — you lose the lay judge if you fight the Founders).</strong>\nConcede the principle, deny the mechanism: \"We agree Congress should have a say. The\nquestion isn't whether the Founders were right — it's whether <em>this law</em> actually delivers\nwhat they wanted. It doesn't; presidents will route around it just like the last one.\" ·\n<em>analytic</em> · ~18s</p>\n<p><strong>REBUTTAL (technical judge only).</strong> Madison's \"studied care\" covered the formal <em>question\nof war</em> — a declaration — not every deployment. The framers deliberately split declaring\n(Congress) from executing (the Commander-in-Chief). The resolution erases that line, which\n<em>breaks</em> the original design rather than restoring it. · <em>analytic — card needed:\nPrakash/Ramsey on the initiation/execution split</em> · ~20s</p>\n<p><strong>INDICT.</strong> The Madison quote is secondhand (via a summary site), not the primary Helvidius\ntext. If pressed on an evidence challenge, they can't produce the original. · <em>analytic</em> ·\n~10s</p>\n<hr />\n<h2>vs. PRO \"The Abdication Harm\" (Burns / Congress is feeble)</h2>\n<p><strong>TURN (offense — this is the money move).</strong> Their own harm is our solvency takeout. If\nCongress is already too feeble to defend the authority it <em>has</em>, it will be just as feeble\nwith authority it's <em>given</em> — the resolution can't manufacture political will. Same card,\nour offense. · <em>pro-congress-abdication-burns-2026.md (their card)</em> · ~18s</p>\n<p><strong>OVERWEIGH.</strong> Even granting the abdication is bad, a paper rule that doesn't reverse it\nisn't the fix — it's a symbol that lets Congress feel solved while changing nothing. Prefer\nthe honest status quo where the accountability (funding, elections) at least exists. ·\n<em>analytic</em> · ~15s</p>\n<hr />\n<h2>vs. PRO enforcement answer (Boland / OSTP / Cooper-Church) — <em>pre-load this; it's how PRO wins the technical judge</em></h2>\n<p><strong>MITIGATE / DISTINGUISH (lead here).</strong> Concede the examples, distinguish the mechanism:\nBoland, Cooper-Church, and Wolf all worked <em>because</em> each was a specific funding restriction\non a specific, watched operation — Congress cut the money for a named thing. That is the\nopposite of a blanket prior-authorization requirement on all future deployments. Those\ncases prove <em>targeted</em> statutes work; they say nothing about a general one. · <em>analytic —\ncard needed: on the specific-vs-general enforcement distinction</em> · ~22s</p>\n<p><strong>INDICT.</strong> Iran-Contra is the <em>counter</em>-example inside their own Boland story — the\nadministration evaded it through third-country and private funding. Their best case of a\nstatute \"working\" is also the most famous case of a president routing around one. ·\n<em>analytic</em> · ~15s</p>\n<p><strong>FRONTLINE.</strong> Ask them in crossfire to name the <em>mechanism</em> in THIS resolution that forces\ncompliance. There isn't one — no funding hook, no named operation, no court that will\nenforce it. Without a mechanism, \"clear default\" is just a wish. · <em>analytic</em> · ~12s</p>\n<hr />\n<h2>vs. PRO congressional capacity (Formosa / Middle East 1957)</h2>\n<p><strong>REBUTTAL.</strong> Formosa and the Middle East Resolution were <em>open-ended delegations</em> — Congress\nhanded the president a blank check to use force as he saw fit. They prove Congress can\n<em>authorize</em>, not that Congress can <em>constrain</em>. They're evidence for executive flexibility,\nnot against it. · <em>analytic</em> · ~18s</p>\n<p><strong>MITIGATE.</strong> Two Cold-War examples from seventy years ago don't establish that a modern,\ngridlocked Congress will authorize a time-sensitive deployment in advance. The exception\nproves the rule. · <em>analytic</em> · ~12s</p>\n<hr />\n<h2>vs. PRO Madison→Hamilton turn (on our C2 energy)</h2>\n<p><strong>MITIGATE (why we collapse away from C2).</strong> Don't defend C2 to the death — concede it and\nreturn to solvency: \"Grant that the executive is prone to war. That's an argument about what\n<em>should</em> be — and we're winning what <em>will</em> be. A war-prone president who ignores the statute\nis worse than one who at least operates in daylight. Their turn doesn't touch inherency.\" ·\n<em>analytic</em> · ~15s</p>"}, {"id": "d30", "title": "Card: con-executive-energy-yoo-2001", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>claim: The executive's structural capacity for speed and decisiveness is essential to national defense and cannot be replicated by a deliberative legislature.\nside: con\nstrength: B\naccessed: 2026-07-17</p>\n<hr />\n<p><strong>Yoo 2001</strong> — John C. Yoo, Deputy Assistant Attorney General, DOJ Office of Legal\nCounsel, \"The President's Constitutional Authority to Conduct Military Operations\nAgainst Terrorists and Nations Supporting Them\", September 25, 2001.\nhttps://irp.fas.org/agency/doj/olc092501.html</p>\n<blockquote>\n<p>\"Decision, activity, secrecy, and dispatch will generally characterize the\nproceedings of one man in a much more eminent degree than the proceedings of any\ngreater number.\"</p>\n<p>\"Energy in the executive is a leading character in the definition of good\ngovernment. It is essential to the protection of the community against foreign\nattacks.\"</p>\n</blockquote>\n<p><strong>Warrant:</strong> A single executive can act faster and more decisively than a 535-member\nlegislature. In a genuine military emergency, the time cost of assembling a\ncongressional majority is itself a national-security risk. This is the core Con\noffense: the president's unilateral authority exists <em>because</em> deliberation is slow.</p>\n<p><strong>Vulnerable to:</strong>\n- <strong>These are Hamilton's words, not Yoo's.</strong> Both quotes are Federalist No. 70, which\n  Yoo is quoting. Cite as \"Yoo 2001, quoting Federalist 70\" — a Pro who knows this and\n  hears it miscited will punish it. The underlying authority is Hamilton; Yoo is the\n  conduit.\n- <strong>Yoo is a radioactive source.</strong> Same author later wrote the \"torture memos\"; his\n  expansive-executive-power views are precisely the position the resolution targets.\n  Reading Yoo approvingly invites a source indict that lands with many judges.\n- <strong>Federalist 70 is about executive <e
