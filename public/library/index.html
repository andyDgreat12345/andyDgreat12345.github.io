orce, and how long the decision to respond takes.\" Congressional influence operates \"through the range of congressional actions — hearings, investigations, nonbinding resolutions, public criticisms\" — and these activities drive \"foreign-affairs media coverage\" that shapes public opinion and constrains the President.</p>\n<hr />\n<h2>SUMMARY FOR DEBATE USE:</h2>\n<p>Howell &amp; Pevehouse provide the leading empirical political-science defense of congressional war-powers influence. Their central finding — that divided government systematically reduces the probability of presidential uses of force, especially for larger and less strategically vital deployments — rebuts the claim that Congress is structurally incapable of checking presidential war powers. Crucially, they show that congressional influence operates through <em>indirect</em> and <em>anticipatory</em> mechanisms (media, public opinion, presidential anticipation of congressional opposition), not just formal legislative vetoes. This means counting only formal congressional \"blocks\" dramatically understates congressional influence.</p>\n<p><strong>Grade: B+</strong> — The publisher's summary, preface, and chapter descriptions are verified against multiple library catalog records and Google Books this session. However, I was unable to fetch the full verbatim text of Chapter 8 (the Conclusion) or Chapter 5 (Studies in Domestic Politics and the Use of Force) in a way that allowed page-specific quotation beyond the preface. The publisher's summary and book-jacket conclusions are reliable representations of the authors' findings but are not direct authorial prose from the conclusion chapter. A debater should ideally acquire the full book (widely available in university libraries and via Princeton University Press) for page-specific citations from the empirical chapters.</p>\n<p><strong>Vulnerable to:</strong>\n- The finding is correlational, not experimental — it shows that divided government <em>correlates with</em> fewer deployments, but the causal mechanism (congressional opposition → presidential restraint) is inferred. Alternative explanations exist: e.g., presidents facing hostile Congresses may face different international conditions.\n- The book focuses on \"wars of choice\" — deployments that are discretionary. In genuine emergencies or responses to direct attacks, the effect of congressional composition may be minimal or nonexistent (the authors acknowledge this).\n- The finding that congressional influence works through \"public posturing\" and media rather than formal legislation actually <em>weakens</em> the case for requiring formal congressional authorization — it suggests the informal checking mechanisms work without statutory reform.\n- Howell &amp; Pevehouse's own data shows that presidents have deployed forces nearly 500 times in the past century; the vast majority of these deployments occurred without meaningful congressional resistance, suggesting that while Congress <em>can</em> check the president, it rarely <em>does</em> in practice.\n- Critics (e.g., Michael D. Ramsey in <em>Review of Politics</em>) note the book is \"refreshingly straightforward\" but does not resolve the constitutional question of <em>who ought</em> to have the war power — only the empirical question of how it operates in practice.</p>"}, {"id": "d46", "title": "Card: ticket-3-block-provenance-little-v-barreme", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card: Little v. Barreme (1804) — Statute Overrides Presidential Wartime Order</h1>\n<p><strong>Case:</strong> Little v. Barreme, 6 U.S. (2 Cranch) 170 (1804)</p>\n<p><strong>Court:</strong> Supreme Court of the United States</p>\n<p><strong>Opinion by:</strong> Chief Justice John Marshall (unanimous)</p>\n<p><strong>Decided:</strong> February 27, 1804</p>\n<p><strong>URL (Justia):</strong> https://supreme.justia.com/cases/federal/us/6/170/</p>\n<p><strong>URL (OpenCasebook):</strong> https://opencasebook.org/documents/6892/</p>\n<hr />\n<h2>HOLDING (Syllabus):</h2>\n<blockquote>\n<p>\"The Act of Congress of 9 February, 1799, authorized the seizure on the high seas of vessels of the United States bound or sailing to any port or place of the French Republic. This act did not authorize the capture of a vessel sailing from a French port, and the orders of the President of the United States to the commanders of the armed vessels of the United States enjoining the seizure of American vessels sailing from French ports will not protect them from a claim for damages for the capture of a vessel coming from a port of France.\"</p>\n</blockquote>\n<hr />\n<h2>VERBATIM (Marshall, C.J., for a unanimous Court):</h2>\n<blockquote>\n<p>\"It is by no means clear that the President of the United States, whose high duty it is to 'take care that the laws be faithfully executed,' and who is commander in chief of the armies and navies of the United States, might not, without any special authority for that purpose, in the then existing state of things, have empowered the officers commanding the armed vessels of the United States, to seize and send into port for adjudication, American vessels which were forfeited by being engaged in this illicit commerce. But when it is observed that the general clause of the first section of the act, which declares that 'such vessels may be seized, and may be prosecuted in any district or circuit court, which shall be holden within or for the district where the seizure shall be made,' obviously contemplates a seizure within the United States; and that the fifth section gives a special authority to seize on the high seas, and limits that authority to the seizure of vessels bound or sailing to a French port, the legislature seem to have prescribed that the manner in which this law shall be carried into execution, was to exclude a seizure of any vessel not bound to a French port.\"</p>\n<p>\"It was so obvious that if only vessels sailing to a French port could be seized on the high seas, that the law would be very often evaded, that this act of congress appears to have received a different construction from the executive of the United States; a construction much better calculated to give it effect.\"</p>\n<p>\"These orders, given by the executive under the construction of the act of congress made by the department to which its execution was assigned, enjoin the seizure of American vessels sailing from a French port. Is the officer who obeys them liable for damages sustained by this misconstruction of the act, or will his orders excuse him?\"</p>\n<p>\"I confess the first bias of my mind was very strong in favour of the opinion that though the instructions of the executive could not give a right, they might yet excuse from damages. I was much inclined to think that a distinction ought to be taken between acts of civil and those of military officers; and between proceedings within the body of the country and those on the high seas. That implicit obedience which military men usually pay to the orders of their superiors, which indeed is indispensably necessary to every military system, appeared to me strongly to imply the principle that those orders, if not to perform a prohibited act, ought to justify the person whose general duty it is to obey them, and who is placed by the laws of his country in a situation which in general requires that he should obey them. I was strongly inclined to think that where, in consequence of orders from the legitimate authority, a vessel is seized with pure intention, the claim of the injured party for damages would be against that government from which the orders proceeded, and would be a proper subject for negotiation. <strong>But I have been convinced that I was mistaken, and I have receded from this first opinion. I acquiesce in that of my brethren, which is that the instructions cannot change the nature of the transaction or legalize an act which without those instructions would have been a plain trespass.</strong>\"</p>\n<p>\"Captain Little, then, must be answerable in damages to the owner of this neutral vessel.\"</p>\n</blockquote>\n<hr />\n<h2>SUMMARY FOR DEBATE USE:</h2>\n<p>In a unanimous decision authored by Chief Justice Marshall, the Supreme Court held that a presidential order to naval commanders to seize ships sailing <em>from</em> French ports could not override a congressional statute authorizing seizure only of ships sailing <em>to</em> French ports. The President's Commander-in-Chief power did not permit him to enlarge the statutory authorization granted by Congress. The naval commander was held personally liable for damages despite acting pursuant to direct presidential orders during an active (quasi-)war. This is the foundational precedent establishing that a statute controls over a contrary presidential wartime order — even when the President's interpretation of the statute is, as Marshall admitted, \"much better calculated to give it effect.\"</p>\n<p><strong>Grade: A</strong> — Primary legal source: official Supreme Court opinion, 6 U.S. (2 Cranch) 170, delivered by Chief Justice Marshall. Text verified against multiple mirrors (Justia, OpenCasebook, CourtListener) this session. Exact quotes with context from the opinion.</p>\n<p><strong>Vulnerable to:</strong>\n- The case involved a \"limited\" or \"quasi\" war — not a full-scale declared war. The Bush OLC (in the STELLAR WIND memo) argued that <em>Barreme</em> is distinguishable because the Quasi War with France was not \"sufficiently akin to a full-scale war for the President to invoke under his own inherent authority the full rights of war.\" In a full-scale war triggered by an attack on the U.S., they argue the President's inherent authority is broader.\n- The statute at issue regulated <em>foreign commerce</em> (a core Article I power), not the direct conduct of military operations against enemy forces. Critics argue this limits the precedent's applicability to statutes directly regulating combat operations.\n- Congress later indemnified Captain Little for the damages — suggesting that even at the Founding, Congress recognized the harshness of holding military officers personally liable for following presidential orders during wartime.\n- The holding addresses a situation where Congress had <em>implicitly</em> limited presidential action by specifying what was authorized (vessels bound <em>to</em> France). It is arguably distinguishable from cases where Congress has been silent or has explicitly authorized the use of force broadly.</p>"}, {"id": "d47", "title": "Ballots", "group": "Topic: war-powers-congressional-approval  ·  round r1", "html": "<h1>Round 1 ballots — frontier panel, 2026-07-18</h1>\n<p><strong>Result: CON (technicians) 2–1.</strong> Lay → PRO, Flow → CON, Evidence → CON.</p>\n<p><strong>Doctrine-judge matching confirmed:</strong> each team won exactly the judge its philosophy\ntargets. The Narrators' story (\"no one person should send other people's kids to die\nalone\") carried the parent; the Technicians' solvency collapse carried the flow. The\nparadigm split is now a 3-for-3 replicated finding on this topic.</p>\n<h2>Lay → PRO</h2>\n<p>\"Pro told me a story I could follow… Con's warning that presidents will simply ignore\nthe law was a fair point, but they buried it under card numbers, acronyms, and words\nlike 'solvency' and 'parchment barrier' — and they even admitted Pro was right in\nprinciple.\" Sticking moment: crossfire, when CON couldn't name a single Founder for its\nreading and \"basically said the question misunderstands methodology — that felt like\ndodging.\"</p>\n<h2>Flow → CON</h2>\n<p>CON collapsed cleanly to solvency (09) and framed it as the prior question from the\nconstructive on. PRO dropped: the courts/political-question response to its standing\nclaim; the \"political enforcement IS the status quo\" turn; and the Biden-2023\n\"total bypass, not loophole\" distinction. Fatal sequence: PRO conceded in grand\ncrossfire that JAG lawyers have never blocked a deployment, then <strong>re-asserted JAG as\nenforcement in final focus</strong> — the flow judge called it directly. PRO decisively won\nthe originalist exchange (CON could not name a Founder) but CON's \"compliance record is\nindependently sufficient even if Prakash is right\" went unanswered, so the win bought\nnothing.</p>\n<h2>Evidence → CON</h2>\n<p>Every quote in sections 01–13 checked against all 19 card files. CON near-verbatim\nfaithful to institutional sources (CRS, law reviews, Army War College); best card in\nround = <strong>Arzich, 42 UA Little Rock L. Rev. 425</strong> — peer-reviewed survey showing OLC\nhas never once constrained a use of force, sitting directly on the dispositive\nenforcement question. PRO answered the round-deciding attack with its weakest evidence:\nan undergraduate paper about <em>detention</em> policy, overclaimed into deployment\nenforcement, plus an uncarded standing assertion contradicted by CON's own Campbell v.\nClinton card.</p>\n<h3>Evidence violations (both teams — full list in the agent output)</h3>\n<ul>\n<li><strong>PRO Card 9 (window 2): Koh citation internally inconsistent — \"looks reconstructed\n  rather than verified.\"</strong> The near-fabrication the spec warned mid-round research\n  would produce.</li>\n<li>PRO: uncarded \"Congress gains standing to sue\" asserted as fact.</li>\n<li>PRO: Atlantic Council quote silently trimmed of its alternative-cause qualifiers.</li>\n<li><strong>CON Card 9 (window 2): law-firm blog presented in summary as scholarship</strong>, single\n  instance overclaimed to a plural pattern.</li>\n<li>Both: AUMF vote tallies asserted uncarded.</li>\n</ul>\n<p><strong>Pattern for the playbook: both serious violations were window-2 cards. Research\nwindows are peak miscut risk — confirmed empirically, not just predicted.</strong></p>"}, {"id": "d48", "title": "Extraction", "group": "Topic: war-powers-congressional-approval  ·  round r1", "html": "<h1>Extraction — R1 (war-powers-congressional-approval)</h1>\n<p><strong>Round:</strong> deep round v2, PRO = Narrators, CON = Technicians, CON spoke first.\n<strong>Status at extraction:</strong> 4 of 5 contested arguments resolved through the 8-turn deep-clash cap; the 5th (emergency-carve-out-text) unresolved — DeepSeek balance exhausted. Ballots not yet in; RFD-citation columns left blank.</p>\n<hr />\n<h2>1. Terminal states (deep-clash arguments, sections 15)</h2>\n<h3>1.1 statute-vs-constitutional-claim (CON) — <strong>exhausted-survives</strong></h3>\n<p>CON's core solvency claim — a president claiming inherent Article II authority will defy a prior-authorization statute and OLC will bless the defiance — survived four doctrine-rotated attacks, each answered with <em>new</em> evidence rather than repetition. The Narrator attack (purpose clause vs. operative prohibition — Scalia dismissed §2(c) only because it was hortatory) was the strongest of the round, and CON answered it on the merits: Boland (operative, circumvented), OSTP-China 2011 (operative funding prohibition, declared unconstitutional by Obama's OLC, never repudiated), and the Reagan OLC's categorical \"constitutionally void\" position — \"the constitutional objection goes to what Congress is trying to do, not the grammatical mood of the verb.\" The Weigher attack (Dellinger's omitted limiting principle + <em>Youngstown</em>) was answered with Dellinger's own next paragraph — the Commander-in-Chief exception (\"This is usually true, for example, of provisions limiting the President's authority as Commander-in-Chief\") — plus the <em>Campbell</em>/<em>Doe</em>/<em>Smith</em> justiciability line showing courts never reach the merits, so the \"convinced the Court would disagree\" condition can't bind.</p>\n<p><strong>Novelty audit:</strong> all 8 turns were genuinely novel — new cards or new legal distinctions every turn (Dudziak gloss machine → Scalia §2(c) → purpose/operative → Boland/OSTP → OLC-never-voids → sidestep-only-with-escape-hatches → Dellinger limiting principle → CiC exception). The cap ended this exchange while it was still wet, not because it ran dry. The surviving PRO mitigator (OLC has <em>never</em> actually voided a WPR provision in 50 years — it interprets around; nullification is \"institutionally radioactive\") was answered but not destroyed; it belongs in PRO's blocks as damage control, not as a winner.</p>\n<h3>1.2 enforcement-mechanism (CON) — <strong>exhausted-dies (strong form) / survives (weak form) — with a harness defect</strong></h3>\n<p>Honest finding first: <strong>this exchange inverted polarity mid-loop.</strong> The contested argument was CON's claim that <em>nothing enforces PRO's resolution</em> (\"no court, no timeline, no mechanism\" — CON final focus voter 2). By attack 2 the referent of \"enforcement mechanism\" had drifted, and CON's defenses to attacks 2–4 ended up defending the thesis that <strong>clear funding restrictions DO constrain presidents</strong>: Cooper-Church \"worked — it constrained the President\" (quoting Arzich approvingly), OSTP-China \"shows enforcement <em>working</em>\" (32% budget cut, negotiated FY2012 modification), Boland enforcement \"working — not perfectly, not immediately, but inexorably,\" and the summary line \"the President's freedom of action is constrained relative to a world in which no statute exists... That is constraint.\" The final defense literally ends \"OSTP-China and Boland prove it works. The resolution stands. Vote CON.\" — defending PRO's solvency thesis under a CON label.</p>\n<p><strong>Terminal state, disentangled:</strong> CON's <em>strong</em> claim (\"no enforcement mechanism exists; PRO's impacts never materialize\") is dead — killed by CON's own deep-clash concessions that clear restrictions impose real, iterative, political constraint. CON's <em>weak</em> claim (\"no mechanism guarantees compliance by a determined president; OSTP aftermath shows defiance survives GAO findings and congressional outrage\") survives, powered by the Aggressor attack's OSTP-aftermath timeline (GAO violation finding → DOJ refuses → president continues), which was never fully rebutted. The Weigher attack (Howell/Pevehouse: constraint operates through <em>anticipatory uncertainty</em>, which a clear statute destroys) was genuinely novel and CON's answer (clarity transforms and amplifies the Congress→media→public-opinion chain — \"The President is breaking the law\" is a front-page frame) is strong material — for PRO.</p>\n<p><strong>Novelty audit:</strong> all 8 turns novel (Little v. Barreme → justiciability/no-plaintiff answer → Arzich/Krass-Libya episode → Cooper-Church concession → OSTP aftermath → FY2012-modification rebuttal → Howell/Pevehouse turn → clarity-amplifies answer). Again the cap, not dryness, ended it. But novelty was purchased at the cost of coherence — the loop needs an argument-referent anchor (state the exact claim being attacked at the top of every turn) or this drift will recur.</p>\n<h3>1.3 congressional-capacity-affirmative (PRO) — <strong>exhausted-dies-to-X</strong>, X = the go-muscle absence proof</h3>\n<p>PRO's claim that Congress can affirmatively authorize deployments died on the specific question that matters: after 8 turns, PRO produced <strong>zero</strong> examples of Congress authorizing a small-scale, time-sensitive deployment <em>in advance</em>. The exchange systematically destroyed both offered examples: Somalia's S.J.Res. 45 never became law (\"did not reach the floor\" for concurrence — PRO's defense candidly conceded the factual error), and Lebanon 1983 was 13-month post-hoc ratification of a fait accompli (\"continued participation\" operative text), signed under a Reagan statement denying it could bind, followed 13 days later by Grenada non-compliance that Congress failed to answer — sourced from Zablocki, PRO's own best authority. The Hulme formal model (Hyp. 2a/2b: blame-avoidance equilibrium — small force is \"virtually always\" unauthorized) explains why the example can't be found. PRO's surviving material is the capacity-vs-preference distinction (\"an equilibrium describes behavior given payoffs, not constitutional incapacity; change the payoffs and the behavior changes — Lebanon fired when the WPR clock forced it\") plus the accurate point that Hulme's own thesis is congressional influence is \"stronger than commonly appreciated.\" That is real mitigation, but it concedes the operative point: under the resolution, every small deployment needs the muscle that has fired approximately once in 50 years, post hoc, under duress.</p>\n<p><strong>Novelty audit:</strong> attacks stayed novel (structural-absence → Somalia/Lebanon debunk → statutory-text ratification argument → Zablocki-Grenada + the six stripped amendments). PRO's defenses recycled the Hulme \"manifestation of congressional power\" inversion <strong>three times</strong> nearly verbatim (defenses 1, 3, and the truncated defense at turn 6) — that is padding, and a working NOTHING-NEW detector should have flagged the defense side as dry by turn 6. Also note: <strong>defense 3 is truncated mid-sentence</strong> in the transcript (\"...sometimes formally, sometimes informally, always constrain\") — the token-budget failure mode ROUNDS.md warned about recurred in the resolution phase.</p>\n<p><strong>Research ticket attached (see §6):</strong> nobody in 8 turns surfaced the Formosa Resolution (1955) or Middle East Resolution (1957) — genuine <em>ex ante</em> area authorizations for limited contingencies, passed fast. If they card out, this terminal state reopens. Until then, it stands as dies-to-X.</p>\n<h3>1.4 original-meaning-clarity (PRO) — <strong>exhausted-survives (core claim), with a scoped boundary concession</strong></h3>\n<p>PRO's core proposition — the original meaning assigns war <em>initiation</em> to Congress; the President cannot start a war against a nation at peace — survived all four attacks. The Lawson-footnote attack (\"no one has answered the Yoo/Delahunty textual argument\") was answered in context: Lawson himself says he's \"not at all certain\" they're right and builds his own analysis on Griffin's contrary premise. The Ramsey Split attack (the round's most creative) was answered with the Question A / Question B partition: Ramsey explicitly <em>agrees</em> (\"and I agree\") that the Declare War Clause gives initiation exclusively to Congress and that the President cannot attack nations at peace; the disagreement is response-power scope after an enemy creates a state of war. The Prakash \"impossible from text alone / equally plausible\" attack was answered with the full passage — Prakash's very next sentences deny indeterminacy and describe standard two-step originalism (text identifies two candidate senses; history picks one), the same move Yoo/Delahunty themselves make in 40+ pages of historical argument.</p>\n<p><strong>But the survival is scoped</strong>, and the extraction should say so: what survived is \"Congress controls initiation,\" not \"the original design is operationally determinate.\" The Aggressor attack landed a real point — the initiation/response boundary is exactly where Prakash and Ramsey diverge, and that boundary is where modern disputes (and the unresolved emergency-carve-out argument) live. PRO can say \"restores the original rule\" about initiation; PRO cannot claim founding-era clarity about which modern operations count as initiation.</p>\n<p><strong>Novelty audit:</strong> attacks 2 and 3 substantially overlap (both are the Ramsey Split; attack 3 deepens it with the Part-II evidence quote), and defenses 2 and 3 repeat the same Ramsey block quote and cancer-diagnosis analogy nearly verbatim. Turns 5–6 are the round's clearest case of the novelty test passing content that a semantic check would have flagged. Turns 7–8 recovered genuine novelty.</p>\n<h3>1.5 emergency-carve-out-text (CON) — <strong>stalemate-pending-resume</strong></h3>\n<p>Not resolved; balance exhausted before the loop ran. State of play at final focus: CON's dilemma (either the resolution has no textual carve-out — lethal rigidity, Ford is a lawbreaker — or it has implied exceptions and changes nothing because AUMFs cover the rest) was pressed three times (crossfire-1 Q1, rebuttal point 6, grand crossfire Q3) and PRO's answer never advanced past the constitutional-backdrop argument (\"statutes are read against the declare/make war architecture; defensive operations were never in scope\"). PRO never cited the avoidance canon caselaw that would make this a <em>statutory</em> answer. Resume ticket in §6. Note the interaction with 1.4: the boundary indeterminacy conceded there is precisely what makes this argument dangerous for PRO.</p>\n<hr />\n<h2>2. Clash quality per speech (01–13)</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Speech</th>\n<th>Grade</th>\n<th>One line</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>01</td>\n<td>CON constructive</td>\n<td>A−</td>\n<td>Clean carded chains, weighing previewed; no clash to grade, graded as setup.</td>\n</tr>\n<tr>\n<td>02</td>\n<td>PRO constructive</td>\n<td>A</td>\n<td>Directly engages CON's actual constructive (\"they just told you two things\") — loophole answer, self-defense answer, both on point.</td>\n</tr>\n<tr>\n<td>03</td>\n<td>Crossfire 1</td>\n<td>A</td>\n<td>Both sides asked questions grounded in the opponent's actual words; answers responsive, zero dodges; CON's carve-out-text question seeded the round's best unresolved argument.</td>\n</tr>\n<tr>\n<td>05</td>\n<td>CON rebuttal</td>\n<td>A−</td>\n<td>Real line-by-line on six actual PRO claims with fresh window evidence; only soft spot is #4, which answers Hulme's big-war finding while sliding past his small-wars mechanism (PRO called this out).</td>\n</tr>\n<tr>\n<td>06</td>\n<td>PRO rebuttal</td>\n<td>A</td>\n<td>Six-for-six on CON's actual arguments; deployed Prakash's reply against the exact article CON introduced — the round's best use of a research window.</td>\n</tr>\n<tr>\n<td>07</td>\n<td>Crossfire 2</td>\n<td>A−</td>\n<td>The stop/go muscle distinction is genuine new clash; PRO's enforcement answer (\"political, not judicial\") was responsive but thin — and became the round's decisive weakness.</td>\n</tr>\n<tr>\n<td>09</td>\n<td>CON summary</td>\n<td>A−</td>\n<td>Textbook collapse to solvency; answers the actual Ely/Koh and JAG cards rather than strawmen; accurately quotes PRO's crossfire concessions.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>PRO summary</td>\n<td>B+</td>\n<td>Story extension is clean and engages the collapse, but re-asserts JAG \"bright line\" without ever answering CON's detention-vs-deployment domain distinction — ships passing on the round's key card.</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Grand crossfire</td>\n<td>A</td>\n<td>CON's three questions each targeted a real PRO card; PRO's counter-question forcing CON to reconcile \"live debate\" with \"presidents claim regardless\" was the sharpest single question of the round, and CON's two-independent-burdens answer was clean.</td>\n</tr>\n<tr>\n<td>12</td>\n<td>CON final focus</td>\n<td>A</td>\n<td>Two voters, verbatim from summary, nothing new, accurate use of the grand-crossfire concession (\"cannot name a single deployment military lawyers blocked\").</td>\n</tr>\n<tr>\n<td>13</td>\n<td>PRO final focus</td>\n<td>B</td>\n<td>Weighing is on-message, but \"Ely and Koh — scholars they never answered\" claims a drop that didn't happen (CON answered Ely/Koh in summary §2), and the JAG domain objection is still unanswered at the last word.</td>\n</tr>\n</tbody>\n</table>\n<p>No strawmanning anywhere in the round — clash quality was high enough that results should be recorded at full weight in the ledger (QC rule 3 satisfied). The one false-drop claim (PRO FF) should cost PRO with a flow judge and is worth a playbook note: Narrator doctrine's absorb-don't-answer style produced both its best moments (story coherence) and both its deductions (JAG domain, false drop).</p>\n<hr />\n<h2>3. Charter audit</h2>\n<p><strong>CON (Technicians): fully compliant — the model for future rounds.</strong>\n- Prep charter: 5 claims, graded evidence targets, explicit negative-results commitment. Cards 1–6 map to the declared research threads.\n- Window charters: both windows written <em>before</em> research, with targets, methods, results, and against-us findings recorded in place (charter-window.md contains Window 1 and Window 2).\n- negative-results.md: 9 entries, including genuinely damaging ones — bin Laden raid cuts against secrecy (with mitigation plan), \"Yoo/Delahunty cite zero Founders\" confirmed against their own pivot, DTIC re-verification failure disclosed, and a Card 5 attribution error self-reported in case.md. This is what the negative-results commitment is supposed to look like.</p>\n<p><strong>PRO (Narrators): substantially compliant, one gap.</strong>\n- Prep charter: thorough (one-frame test, claims, evidence needs, 10-fetch budget, negative-results commitment).\n- <strong>Gap: no written Window 1 charter.</strong> charter-window.md contains only Window 2. Window 1 research happened (Cards 6–7 cut, negative results #7–8 logged as \"[WINDOW 1]\") and its <em>results</em> were recorded, but the before-research charter the spec requires was never written. Per spec, Window-1-derived material (Prakash reply, Yemen) is technically discount-eligible in the ledger; I recommend recording the discount as a formality but not applying it substantively, since the results-side documentation was honest and complete.\n- negative-results.md: 10 entries, exemplary — Goldsmith's \"law is irrelevant,\" Arzich full-text confirmation (\"strengthens CON's card\"), Waxman/Feldman against their own C1, and three failed research threads (no \"deploy\" definition, no outcomes-improve evidence, no Prakash verbatim from the book). Empty-handed threads were recorded, not buried. Both teams honored the commitment.</p>\n<p><strong>Resolution phase: entirely charter-less.</strong> resolution_log.jsonl shows 41 fetches (justice.gov OLC opinions, GAO, Justia, Cambridge, Harvard NSJ, Slate, etc.) with zero written charters. The spec only mandates charters \"before each research window,\" and the deep-clash design (\"research allowed\") never says whether the charter regime extends to it — a spec hole. Consequence: every deep-clash blockbuster (Dudziak, Dellinger 1994, OSTP-China, Little v. Barreme, Howell/Pevehouse, Zablocki, Ramsey, Lawson, Cooper-Church) is charter-less <strong>and none of it exists as a card file in either evidence/ dir</strong> (evidence dirs hold only the 9–10 prep/window cards). Under QC rule 1, nothing from the resolution phase can promote as <em>carded</em> until fetched-and-cut properly. The fetch log shows the sources are real and were actually retrieved (fabrication risk is low), but provenance-gated promotion is blocked. Fix for r2: require a mini-charter (3 lines: claim targeted, what would change the argument, budget) at the top of each deep-clash turn that fetches, and require deployed quotes to be cut to evidence/ before the turn closes.</p>\n<hr />\n<h2>4. Fog-of-war audit — <strong>CLEAN</strong>, enforcement verified working</h2>\n<p><strong>DENIED entries:</strong> 3 total, all blocked by the code-level sandbox.\n- PRO round_log: 2 attempts to read the round dir root (<code>...\\rounds\\r1</code>) at 04:23 and 04:34 — \"DENIED: outside your permitted files (fog of war).\"\n- CON round_log: 1 attempt to read <code>...\\rounds\\r1\\teams</code> at 04:48 — same denial.\n- resolution_log: 0 denials.\nThese read like path-navigation mistakes (reaching for the transcript by grabbing its parent dir) rather than deliberate opponent-dir targeting, but either way the firewall held — this is exactly the Phase-0 \"code-enforced, not prompt-promised\" outcome working as designed.</p>\n<p><strong>Content audit (speeches vs. opponent private files):</strong> no leakage found. Checked the distinctive fingerprints:\n- CON's private-only material never surfaced in PRO speeches: \"Autobahn\" analogy (0 hits in transcript), Posse Comitatus / <em>Coleman v. Miller</em> anticipation (0), \"gift to a recipient who's proven they'll refuse delivery\" (0), Card 6 OLC definitional-narrowing plan (never triggered).\n- PRO's private-only material never surfaced in CON speeches: Waxman/Feldman \"Madison was wrong\" (0 hits — CON never fired the attack PRO most feared and had a full block against), moral hazard / \"political insurance\" Stanford LR argument (0 hits — PRO's negative-results #3, CON never found it), bin Laden raid (0 hits — CON prepped a full block and PRO never fired it).\n- The strongest evidence of intact fog is precisely those three dogs that didn't bark: each team held a loaded answer to an attack the opponent independently never discovered. The one shared phrase found (\"speed limit,\" line 1896) is PRO's own 15-vs-65-mph calibration analogy in deep-clash — unrelated in meaning to CON's private Autobahn line.\n- Cross-references that look like leaks but aren't: PRO answering \"Card 10 — Arzich\" and CON answering the JAG card are legitimate — window summaries are posted into the public transcript.</p>\n<p><strong>Design note (not a breach, but flag it):</strong> the fixed window ordering (CON's summary posts before PRO researches) let PRO read CON's Window-1 findings and counter-cut Prakash's reply <em>in the same window</em> — Yoo/Delahunty was answered before CON ever deployed it in a speech. That's a structural second-mover advantage to PRO in both windows. If intended (open-research doctrine says test against the best counter-evidence), fine; if not, run windows blind-simultaneous and publish both summaries together.</p>\n<hr />\n<h2>5. Block diff — exchanges that should become canonical blocks</h2>\n<p><strong>→ CON blocks (canonical, battle-tested):</strong></p>\n<ol>\n<li>\n<p><strong>AT \"purpose clause vs. operative prohibition\"</strong> (statute-vs-constitutional-claim, turns 3–4). Attack: \"Scalia could dismiss a purpose clause... He could not dismiss a statute that says 'no funds shall be obligated or expended'... that's Congress exercising its own enumerated powers\" + <em>Kendall</em> (suspension power \"entirely inadmissible\"). Surviving answer: \"OLC dismisses operative prohibitions exactly the same way\" — Boland circumvented, OSTP-China 2011 (\"None of the funds... may be used\" — declared unconstitutional, never repudeated, Goldsmith defending it), and the <em>Kendall</em> reframe: \"<em>Kendall</em> involved a ministerial duty under a concededly valid statute. Here, the validity of the statute is precisely what's in dispute.\" Close: \"the constitutional objection goes to <em>what Congress is trying to do</em>, not the grammatical mood of the verb.\"</p>\n</li>\n<li>\n<p><strong>AT \"Dellinger's limiting principle + Youngstown lowest ebb\"</strong> (turns 7–8). Attack: \"unless he is convinced that the Court would disagree... No president could be 'convinced the Court would agree' when <em>Youngstown</em> says the opposite. CON quoted half a sentence. The other half beats them.\" Surviving answer: Dellinger's next paragraph verbatim — \"Some legislative encroachments... will not be justiciable... <strong>This is usually true, for example, of provisions limiting the President's authority as Commander-in-Chief</strong>\" — plus <em>Campbell v. Clinton</em> / <em>Doe v. Bush</em> / <em>Smith v. Obama</em> (\"The Supreme Court has never reached the merits of a war powers case in the <em>Youngstown</em> framework\").</p>\n</li>\n<li>\n<p><strong>AT \"Congress can act — Yemen/Lebanon/Somalia\"</strong> (congressional-capacity, all 8 turns — the attack side won). Canonical attack block: Hulme Hyp. 2a/2b (small force \"virtually always undertaken absent Congress's formal blessing\" — blame-avoidance equilibrium); Somalia's S.J.Res. 45 \"did not reach the floor\" — never enacted; Lebanon operative text is \"<strong>continued</strong> participation\" — 13-month ratification of a fait accompli, Reagan signing statement denying bindingness, Grenada 13 days later (\"only thirteen days later, the old pattern of evasive executive non-compliance had once again appeared\" — Zablocki, PRO's own source), and the six stripped amendments (Levin-Randolph 54-45, Byrd, Pell, Obey-Long, Tsongas, Eagleton).</p>\n</li>\n</ol>\n<p><strong>→ PRO blocks (canonical, battle-tested):</strong></p>\n<ol start=\"4\">\n<li>\n<p><strong>AT \"the originalist debate is live — Ramsey split / Lawson footnote\"</strong> (original-meaning, turns 3–8). Surviving answer, nearly verbatim: the Question A / Question B partition — \"Ramsey says, 'and I agree,' that the Declare War Clause gave initiation exclusively to Congress... The only point where they part company is what the President can do <em>after another nation has already created a state of war</em>... That's like saying two doctors who agree on a cancer diagnosis but disagree on chemotherapy dosage haven't really settled whether the patient has cancer.\" Plus the Prakash-in-context answer: \"text alone is ambiguous between two available senses\" is step one of standard two-step originalism, and \"Yoo and Delahunty make the exact same move — if text alone resolved it, they wouldn't need 40 pages of history.\"</p>\n</li>\n<li>\n<p><strong>AT \"clear statutes destroy the anticipatory-uncertainty constraint\" (Howell/Pevehouse turn)</strong> (enforcement, turns 7–8). Surviving answer: clarity transforms rather than eliminates uncertainty and amplifies every link of the documented Congress→media→public-opinion→restraint chain — \"'Congress passed a law prohibiting this deployment and the President is violating it' generates <em>enormous</em> coverage... 'The President is breaking the law' is a front-page story, not a paragraph on A12.\" <strong>File this under PRO</strong> despite its CON label in the transcript (see §1.2 polarity note) — it defends statutory constraint, which is PRO's thesis.</p>\n</li>\n<li>\n<p><strong>AT \"OLC will void the statute\"</strong> — PRO mitigation block from the Aggressor attack (statute-vs-constitutional, turn 5): \"With the exception of §1544(c), OLC has not found any provision of the WPR unconstitutional\" in 50 years; interpretation is OLC's tool, nullification is \"politically costly, judicially reviewable, and institutionally radioactive.\" Survived as mitigation (CON's answer — sidestepping works only with escape hatches — is strong but probabilistic). Pairs with the OSTP-aftermath material as honest even-if layering.</p>\n</li>\n</ol>\n<p><strong>Do not promote:</strong> PRO's JAG Corps card as an enforcement answer (died to the detention/deployment domain distinction, never rehabilitated); PRO's Somalia example (factually wrong, conceded); CON's \"no enforcement mechanism exists\" in strong form (self-contradicted in deep clash, §1.2).</p>\n<hr />\n<h2>6. Research tickets (ranked)</h2>\n<ol>\n<li><strong>Ex-ante limited-force authorizations nobody found</strong> — Formosa Resolution (1955), Middle East/Eisenhower Resolution (1957), arguably Gulf of Tonkin (1964): Congress authorizing force <em>in advance</em> for defined contingencies, fast. Eight turns of congressional-capacity clash and neither side surfaced them. If they card out as genuine \"go\"-muscle exercises, terminal state 1.3 reopens; if they're distinguishable (blank-check delegations, not deployment approvals — which is the likely CON answer), that answer needs to be pre-written. <strong>Interlock: fill before r2.</strong></li>\n<li><strong>Emergency-carve-out resume package</strong> (for the stalemated argument): constitutional-avoidance canon caselaw — do courts read implied self-defense exceptions into force-restricting statutes? Target: <em>Ex parte Endo</em>-style avoidance readings, plus scholarship on drafting emergency exceptions in war-powers reform proposals (the NWPC 2009 proposal has explicit carve-out language). PRO needs a <em>statutory</em> answer; CON needs the exception-swallows-rule counter carded.</li>\n<li><strong>Card the resolution phase</strong> (promotion-blocking, see §3): cut proper cards for Dudziak (Modern American History 2023), Dellinger 18 Op. O.L.C. 199 (both the limiting principle AND the CiC exception paragraphs), OSTP-China 35 Op. O.L.C. 116 + GAO B-321982 aftermath, <em>Little v. Barreme</em>, Howell &amp; Pevehouse, Zablocki 17 Loy. L.A. L. Rev. 579, Ramsey 93 Cornell L. Rev. 169, Cooper-Church history. Also verify the two shakiest deep-clash citations: \"Presidential Auth. to Permit Exports, 34 Op. O.L.C. 1 (2010)\" (CON defense, unverified in log) and the Weigher attack's citation of <strong>Wikipedia</strong> for torture-memo repudiation — below evidence standard, replace with the OPR report or Levin memo directly.</li>\n<li><strong>PRO's standing gap, still open after two rounds of prep:</strong> no empirical evidence that congressionally authorized wars have better outcomes (duration, casualties, exit). Confirmed unfindable once already (negative-results #6b) — one more targeted pass (Kriner? Reiter/Stam on democracies at war?), then mark confirmed-unfindable and stop resting the \"accountability changes behavior\" impact on it.</li>\n<li><strong>OLC behavior toward clear funding restrictions in the deployment context specifically</strong> — the round's true crux. Does OSTP-China's exclusive-power logic extend to shared war powers (Youngstown Cat. 3)? Scholarly treatments of funding-rider enforceability (Yale L.J. 2018 piece cited in-round; Fisher, <em>How Tightly Can Congress Draw the Purse Strings?</em>). This is the evidence gap under both §1.1 and §1.2.</li>\n</ol>\n<hr />\n<h2>7. Ledger rows</h2>\n<p>RFD-citation columns to be filled when ballots land.</p>\n<table>\n<thead>\n<tr>\n<th>argument</th>\n<th>round</th>\n<th>side</th>\n<th>survived to FF?</th>\n<th>dropped/turned?</th>\n<th>deep-clash terminal state</th>\n<th>RFD (lay/flow/ev)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Solvency: statute can't bind Art. II claimant</td>\n<td>r1</td>\n<td>con</td>\n<td>yes — FF voter 1</td>\n<td>no</td>\n<td>exhausted-survives</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Enforcement gap (no mechanism for the resolution)</td>\n<td>r1</td>\n<td>con</td>\n<td>yes — FF voter 2</td>\n<td>self-contradicted in deep clash</td>\n<td>dies (strong form) / survives (weak form) — §1.2</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Operational necessity (speed/secrecy — Saigon, Iran)</td>\n<td>r1</td>\n<td>con</td>\n<td><strong>no — dropped at CON summary collapse</strong></td>\n<td>abandoned by design</td>\n<td>not contested → not run</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Definitional narrowing (\"deploy\")</td>\n<td>r1</td>\n<td>con</td>\n<td>never deployed</td>\n<td>–</td>\n<td>–</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Original design / restoration (Prakash, Madison)</td>\n<td>r1</td>\n<td>pro</td>\n<td>yes — FF voter 2</td>\n<td>no</td>\n<td>exhausted-survives (initiation core; boundary conceded)</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Accountability engine (Hulme small-wars mechanism, Libya)</td>\n<td>r1</td>\n<td>pro</td>\n<td>yes — FF voter 1</td>\n<td>no; CON never directly answered Libya (implicit desirability concession)</td>\n<td>not separately deep-clashed</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Congressional capacity (Yemen \"flip the default\")</td>\n<td>r1</td>\n<td>pro</td>\n<td>yes — inside FF voter 1</td>\n<td>Somalia example conceded false in deep clash</td>\n<td>exhausted-dies-to-absence-proof (ticket #1 could reopen)</td>\n<td>–</td>\n</tr>\n<tr>\n<td>JAG Corps as enforcement</td>\n<td>r1</td>\n<td>pro</td>\n<td>extended to FF</td>\n<td>turned/neutralized — domain distinction never answered</td>\n<td>subsumed into §1.2</td>\n<td>–</td>\n</tr>\n<tr>\n<td>WPR-failed-because-loopholes (architecture distinction)</td>\n<td>r1</td>\n<td>pro</td>\n<td>yes — spine of both FF voters</td>\n<td>contested, not dropped</td>\n<td>partially vindicated via CON's own Cooper-Church concession</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Emergency carve-out textual dilemma</td>\n<td>r1</td>\n<td>con</td>\n<td>yes — pressed through grand crossfire</td>\n<td>unresolved</td>\n<td><strong>stalemate-pending-resume</strong></td>\n<td>–</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Round outputs (QC gate):</strong> this round produced all four output types — block diffs (§5, six canonical blocks), research tickets (§6, five), terminal states toward convergence (four, one pending), and promotion candidates (pending ballots + carding per §3). Not waste.</p>\n<p><strong>Process defects to fix before r2:</strong> (1) deep-clash referent drift — anchor the exact claim under attack in every turn prompt (§1.2); (2) novelty detector too lenient — near-verbatim recycled material passed as new in exchanges 3–4; add a semantic-overlap check, and conversely allow cap extension when turns are still producing genuinely new evidence (exchanges 1–2 were cut off wet); (3) mid-turn truncation recurred (line 1788) — raise resolution-phase max_tokens; (4) charter requirement doesn't cover resolution-phase research — extend it (§3); (5) window sequencing gives the second team a same-window counter-research advantage — decide if intended (§4).</p>"}, {"id": "d49", "title": "Reflection", "group": "Topic: war-powers-congressional-approval  ·  round r1", "html": "<h1>Reflection — r1 (war-powers-congressional-approval), 2026-07-18</h1>\n<p><strong>Result:</strong> CON (Technicians) 2–1 over PRO (Narrators). Lay → PRO, Flow → CON, Evidence → CON.</p>\n<hr />\n<h2>1. PROCESS — did the mechanisms work?</h2>\n<h3>What worked</h3>\n<p><strong>Fog of war — clean, code-enforced.</strong> Three DENIED directory-access attempts, all blocked by the sandbox. Content audit found zero opponent-private material in either team's speeches. Three dogs that didn't bark (CON's Autobahn analogy, PRO's Waxman/Feldman block, PRO's bin Laden raid) confirm the firewall held. The Phase-0 \"code-enforced, not prompt-promised\" design paid.</p>\n<p><strong>Charters (prep phase) — CON model, PRO one gap.</strong> CON's prep charter, both window charters, and negative-results.md were exemplary — 9 entries including genuinely damaging findings. PRO's prep charter and negative-results.md (10 entries) were also excellent. The gap: PRO wrote no Window 1 charter before research. The spec says charter-less research is discount-eligible; I recommend formal notation in the ledger but no substantive discount since results-side documentation was honest and complete.</p>\n<p><strong>Clash quality — high, no strawmanning.</strong> Extraction §2 grades every speech A-range except PRO summary (B+) and PRO final focus (B). The one false-drop claim (PRO FF: \"Ely and Koh — scholars they never answered\" when CON did answer them in summary §2) cost PRO with the flow judge. The round qualifies for full-weight ledger recording under QC rule 3.</p>\n<p><strong>Ballots produced clear, paradigm-split findings.</strong> The 3-for-3 doctrine-judge matching pattern (Lay→PRO, Flow→CON, Evidence→CON) now replicated across all panels on this topic. The split is structural, not noise.</p>\n<p><strong>Round produced all four QC output types:</strong> block diffs (six canonical blocks), research tickets (five), terminal states (four, one pending), and promotion candidates. Not waste.</p>\n<h3>What broke</h3>\n<p><strong>Deep-clash balance exhausted before emergency-carve-out-text ran.</strong> The most dangerous unresolved argument against PRO — CON's textual dilemma (either no carve-out = lethal rigidity / Ford is a lawbreaker, or implied exceptions = resolution changes nothing because AUMFs cover the rest) — never entered the formal deep-clash loop because the DeepSeek balance hit zero after the other four arguments consumed the budget. The round's most consequential PRO vulnerability is untested. This is the #1 process failure of r1.</p>\n<p><strong>Deep-clash referent drift (enforcement-mechanism, §1.2).</strong> The contested claim (\"no enforcement mechanism exists\") inverted polarity mid-loop — CON ended up defending PRO's thesis (statutes DO constrain) under a CON label. The extraction flags the root cause: no argument-referent anchor at the top of each turn. Fix: every deep-clash turn must open with a one-line restatement of the exact claim under attack.</p>\n<p><strong>Novelty detector too lenient.</strong> Near-verbatim recycled material passed as new in three exchanges: PRO's Hulme \"manifestation of congressional power\" inversion recycled three times nearly verbatim (congressional-capacity, defenses 1/3/6 — extraction §1.3); Ramsey block quote + cancer-diagnosis analogy repeated twice (original-meaning, defenses 2/3 — extraction §1.4). A working NOTHING-NEW detector should have flagged the defense side as dry by turn 6 in the capacity exchange and turn 5 in the original-meaning exchange. Conversely, exchanges 1 and 2 (statute-vs-constitutional, enforcement) were still producing genuinely new evidence when the cap cut them off — the cap should extend when novelty is real.</p>\n<p><strong>Mid-turn truncation recurred.</strong> Defense 3 in congressional-capacity is cut mid-sentence (\"...sometimes formally, sometimes informally, always constrain\" — extraction §1.3, transcript line ~1788). This is the token-budget failure ROUNDS.md warned about — the fix (raise resolution-phase max_tokens) was already prescribed and still wasn't applied.</p>\n<p><strong>Resolution-phase research is entirely charter-less and uncarded.</strong> 41 fetches produced zero written charters and zero card files in either evidence dir. The spec mandates charters \"before each research window\" but never says whether this extends to deep-clash research — a spec hole. Consequence: every deep-clash blockbuster (Dudziak, Dellinger, OSTP-China, Little v. Barreme, Howell/Pevehouse, Zablocki, Ramsey, Lawson, Cooper-Church) is provenance-blocked from promotion as <em>carded</em> (QC rule 1). The fetch log shows sources are real and were actually retrieved, so fabrication risk is low, but card-gating is the rule as written.</p>\n<p><strong>Window sequencing gave PRO a structural second-mover advantage.</strong> CON's Window 1 summary was posted before PRO researched, letting PRO read CON's findings and counter-cut Prakash's reply to Yoo/Delahunty <em>in the same window</em>. Yoo/Delahunty was answered before CON ever deployed it in a speech. If open-research doctrine intends \"test against the best counter-evidence,\" this is fine; if the intent is symmetrical access, windows should run blind-simultaneous with both summaries published together.</p>\n<h3>What the cost data implies</h3>\n<p>The DeepSeek balance exhaustion at argument 5 of 5 is the critical datum: four deep-clash exchanges (8 turns each, with research fetches) consumed the full budget. The emergency carve-out didn't get a single formal deep-clash turn. This means the per-argument deep-clash cost is higher than estimated — ~¥1.5–2 for four arguments means ~¥0.4–0.5 per argument, not the ~¥0.1–0.15 implied by the ROUNDS.md estimate. <strong>For r2: budget 6 arguments at 8 turns each = 48 turns minimum, and assume ¥3–4 for the resolution phase alone.</strong> Either raise the DeepSeek balance cap, reduce the turn count per argument, or run fewer arguments; the current budget fits 4 arguments, not 5+.</p>\n<h3>Concrete process changes for r2</h3>\n<ol>\n<li><strong>Argument-referent anchor:</strong> every deep-clash turn must open with a one-line restatement of the exact claim under attack (fixes §1.2 drift).</li>\n<li><strong>Semantic-overlap check:</strong> after turn 4, each side's last two defenses are compared; if cosine similarity &gt; 0.85, the defense side is flagged dry and the loop closes (fixes §1.3/1.4 recycling).</li>\n<li><strong>Cap-flex rule:</strong> if turns 7–8 still produce genuinely new evidence (new card, new legal distinction), extend by 2 turns; if turns 5–6 are padding, close early (reverse of current rigid cap).</li>\n<li><strong>Resolution-phase charter requirement:</strong> before each deep-clash turn that fetches, write a 3-line mini-charter (claim targeted, what would change the argument, budget). Deployed quotes must be cut to evidence/ before the turn closes. Fixes the promotion-blocking provenance gap (§3 of extraction).</li>\n<li><strong>Raise resolution-phase max_tokens to 8000</strong> (fixes mid-turn truncation — this was prescribed after the self-debate truncation incident and wasn't applied).</li>\n<li><strong>Blind-simultaneous windows OR document the asymmetry as intended.</strong> Decide before r2.</li>\n<li><strong>Budget 5 arguments at 8 turns each</strong> with the raised cap, and reserve balance for the stalemated argument first.</li>\n</ol>\n<hr />\n<h2>2. RESULTS — argument outcomes in 10 lines</h2>\n<ol>\n<li>\n<p><strong>statute-vs-constitutional-claim (CON): exhausted-survives.</strong> OLC will treat a prior-authorization statute with the same constitutional defiance it applies to the WPR. Best attack (purpose clause vs. operative prohibition — Scalia/Kendall) answered on the merits with Boland/OSTP-China/Dellinger CiC exception. Survived all four doctrine rotations with new evidence each turn. (extraction §1.1)</p>\n</li>\n<li>\n<p><strong>enforcement-mechanism (CON): strong form exhausted-dies; weak form survives.</strong> CON conceded in its own deep-clash defenses that clear statutes DO constrain (Cooper-Church, OSTP-China, Boland). But \"no mechanism guarantees compliance by a determined president\" survives — OSTP aftermath shows GAO finding → DOJ refuses → president continues. Polarity inverted mid-loop. (extraction §1.2)</p>\n</li>\n<li>\n<p><strong>congressional-capacity-affirmative (PRO): exhausted-dies-to-absence-proof.</strong> Zero examples of Congress authorizing a small-scale, time-sensitive deployment <em>in advance</em> after 8 turns. Somalia conceded false; Lebanon was 13-month post-hoc ratification followed 13 days later by Grenada non-compliance. Hulme Hyp. 2a/2b explains why the example can't be found. Research ticket #1 (Formosa 1955 / Middle East 1957) could reopen. (extraction §1.3)</p>\n</li>\n<li>\n<p><strong>original-meaning-clarity (PRO): exhausted-survives (initiation core), boundary conceded.</strong> Congress controls war initiation — survived all attacks including Yoo/Delahunty textual argument and Ramsey Split. But the initiation/response boundary is where Prakash and Ramsey diverge and where modern disputes live. PRO can claim \"restores the original rule\" for initiation; cannot claim founding-era clarity about which modern operations count as initiation. (extraction §1.4)</p>\n</li>\n<li>\n<p><strong>emergency-carve-out-text (CON): stalemate (PRO vulnerable).</strong> Proposed terminal state from the resumed 4-turn exchange (crossfire-1 Q1 → PRO constitutional-backdrop answer → rebuttal point 6 → grand crossfire Q3): <strong>stalemate, with PRO's position analytically exposed.</strong> CON pressed the same dilemma three times: either the resolution has no textual carve-out (Ford is a lawbreaker — lethal rigidity), or it has implied exceptions and changes nothing (AUMFs already cover non-emergency cases). PRO's answer never advanced past the constitutional-backdrop argument (\"statutes are read against the declare/make-war architecture; defensive operations were never in scope\"). PRO never cited the constitutional-avoidance canon caselaw that would make this a <em>statutory</em> answer — no <em>Ex parte Endo</em>, no avoiding-constitutional-questions doctrine, no severability analysis. On a NOTHING-NEW standard applied retrospectively, PRO's defense was dry after the first iteration. But CON's attack was also static — same formulation, no new evidence. The argument is stalemated, not resolved, because neither side exhausted its available moves: PRO has an unrun statutory-construction answer (avoidance canon + \"vehicles in the park\" — a statute banning vehicles also bans ambulances unless you read an exception in, and courts do that against constitutional backdrops); CON has an unrun counter (general language is not silence — \"all deployments\" means all deployments; avoidance canons resolve ambiguity, they don't write exceptions into clear text). This is the highest-priority resume ticket for r2. The interaction with §1.4 boundary indeterminacy makes this dangerous for PRO: if even originalists can't agree which operations are \"initiation\" vs. \"defense,\" a statute that draws no textual line is asking for exactly the interpretive evasion that killed the WPR. (extraction §1.5; crossfire-1 Q1, rebuttal §6, grand crossfire Q3)</p>\n</li>\n<li>\n<p><strong>WPR-failed-because-loopholes (PRO): partially vindicated.</strong> CON's own Cooper-Church/OSTP-China concessions in the enforcement deep-clash proved that architecture matters — the WPR's specific design flaws (60-day clock, \"hostilities\" definition, Chadha problem) drove its failure, not a generic statute-is-powerless rule. But the Biden-2023 \"total bypass\" (Article II alone, no statutory framework at all) limits how far this vindication goes. (extraction §1.2, ballots.md Flow→CON)</p>\n</li>\n<li>\n<p><strong>JAG Corps as enforcement (PRO): dead.</strong> Died to the detention-vs-deployment domain distinction, which PRO never answered through final focus. The flow judge cited this as the fatal sequence: PRO conceded JAG has never blocked a deployment in grand crossfire, then re-asserted JAG as enforcement in final focus. Do not promote. (extraction §5, ballots.md Flow→CON)</p>\n</li>\n<li>\n<p><strong>Speed/secrecy (CON): deliberately collapsed.</strong> CON abandoned operational necessity after crossfire 2, collapsing exclusively to solvency. Correct strategic choice — the evidence was thin (two 50-year-old examples) and PRO had the 2001-AUMF-in-3-days answer. The collapse bought CON cleaner weighing in summary and final focus. (extraction §7, clash grade for CON summary)</p>\n</li>\n<li>\n<p><strong>Accountability engine / Hulme small-wars mechanism (PRO): survived uncontested.</strong> CON never directly answered the Libya desirability case or the \"constraint already works for big wars\" mechanism. Implicit concession. This is PRO's strongest lay-judge material and the spine of both PRO FF voters. (extraction §7)</p>\n</li>\n<li>\n<p><strong>Definitional narrowing (\"deploy\") (CON): never deployed.</strong> CON prepped it, never fired it. The strategic collapse to solvency consumed the speech time. Not a failure — it was held in reserve and the round didn't need it. (extraction §7)</p>\n</li>\n</ol>\n<hr />\n<h2>3. FEEDBACK — what each judge rewarded and punished</h2>\n<h3>Lay → PRO</h3>\n<p><strong>Rewarded:</strong> story coherence, moral clarity, accessible language. PRO's \"one person should never decide alone to send other people's children to die\" carried the ballot. The lay judge followed the narrative through-line from Madison's \"studied care\" through Burns's abdication pattern to Libya's operational damage — a single story arc, no jargon.</p>\n<p><strong>Punished:</strong> jargon, acronyms, and technical density. CON buried its winning solvency argument under \"card numbers, acronyms, and words like 'solvency' and 'parchment barrier.'\" The sticking moment was crossfire when CON couldn't name a Founder — the lay judge read this not as an evidence dispute but as \"dodging.\" CON also admitted PRO was \"right in principle\" — in front of a lay judge, that concession is devastating because legitimacy IS the ballot for them.</p>\n<p><strong>Meaning for r2:</strong> CON must produce a plain-English version of the solvency takeout. \"Presidents will ignore this law because they've ignored every similar law for 50 years — here are three examples in ordinary language.\" And CON must have a prepared answer to \"name one Founder\" — Hamilton Federalist 70/74 on executive conduct/energy is the obvious card; have it ready as a one-sentence soundbite, not a methodological objection. PRO should double down on the one-story arc and never let CON's technical answers go unanswered in crossfire — the lay judge punished CON's jargon but also noted CON \"buried\" a fair point, which means PRO can't count on the lay judge filtering PRO's own unanswered weaknesses.</p>\n<h3>Flow → CON</h3>\n<p><strong>Rewarded:</strong> collapse discipline, line-by-line engagement, and exploiting dropped arguments. CON collapsed cleanly to solvency and framed it as the prior question from the constructive on. The flow judge tracked every dropped argument: PRO dropped the courts/political-question response to CON's standing claim; dropped the \"political enforcement IS the status quo\" turn; dropped the Biden-2023 \"total bypass, not loophole\" distinction. The flow judge's fatal sequence — PRO concedes JAG never blocked a deployment in grand crossfire, then re-asserts JAG in final focus — is the textbook flow-judge kill shot: an outright contradiction on the flow.</p>\n<p><strong>Punished:</strong> false-drop claims and unrehabilitated arguments. PRO's final focus claimed \"Ely and Koh — scholars they never answered\" when CON had answered them in summary §2. Flow judges treat false drops as credibility errors, not just strategic mistakes. PRO's JAG domain objection went unrehabilitated from crossfire through final focus — flow judges notice when an argument dies and you keep extending it anyway.</p>\n<p><strong>Meaning for r2:</strong> The flow judge is the collapse judge. Both teams should collapse earlier and harder. CON's collapse-to-solvency after crossfire 2 was the round's best strategic decision. PRO should identify which of its arguments the flow judge will actually vote on (not JAG, not congressional-capacity until revived) and collapse to the ones that survive. Never claim a drop that didn't happen — the flow judge checks. And if an argument is dying (JAG domain distinction), either rehabilitate it explicitly or cut it — extending a mortally wounded argument through final focus is net-negative with flow judges.</p>\n<h3>Evidence → CON</h3>\n<p><strong>Rewarded:</strong> faithful sourcing and the Arzich card. CON was \"near-verbatim faithful to institutional sources (CRS, law reviews, Army War College).\" The evidence judge called Arzich, 42 UA Little Rock L. Rev. 425 the best card in the round — a peer-reviewed survey showing OLC has never once constrained a use of force, sitting directly on the dispositive enforcement question.</p>\n<p><strong>Punished:</strong> overclaiming, reconstruction, and blog-as-scholarship. PRO Card 9 (window 2): Koh citation \"looks reconstructed rather than verified\" — the near-fabrication the spec predicted mid-round research would produce. PRO: uncarded standing assertion treated as fact. PRO: Atlantic Council quote silently trimmed of alternative-cause qualifiers. CON Card 9 (window 2): law-firm blog presented as scholarship. Both teams: AUMF vote tallies asserted uncarded. <strong>The pattern: both serious violations were window-2 cards. Research windows are peak miscut risk — confirmed empirically.</strong></p>\n<p><strong>Meaning for r2:</strong> Window-2 cards are where fabrication pressure peaks (last-chance research under time pressure). The evidence judge will audit window cards hardest. Both teams should treat window-2 cards as presumptively suspect and over-cite rather than overclaim. If a window-2 card is a blog, call it a blog. If a quote has qualifiers, include them. The evidence judge's penalty for overclaiming is total — a single reconstructed citation can sink the card and the argument it supports. PRO's Koh card cost them the evidence ballot and credibly could have cost them the flow ballot too if the flow judge had noticed.</p>\n<hr />\n<h2>4. PREP CHANGES — exactly what will be changed in PREP.md and why</h2>\n<ol>\n<li>\n<p><strong>Append <code>## r1 improvements (reflection, 2026-07-18)</code></strong> under <code># Improved arguments, by round</code>, containing:\n   - <strong>Emergency-carve-out terminal state</strong> (stalemate, PRO vulnerable) with its two block-quality arguments: (a) CON: general-language-is-not-silence — \"all deployments\" means all deployments; avoidance canons resolve ambiguity, they don't write exceptions into clear text. (b) PRO: burden-shift — \"vehicles in the park\" — the text must COVER defensive ops before an exemption is needed; statutes are always read against their constitutional backdrop. Both arguments are unrun, from the resumed exchange per extraction §1.5 and the crossfire/rebuttal/grand-crossfire record. Provenance: extraction §1.5, crossfire-1 Q1, rebuttal §6, grand crossfire Q3.\n   - <strong>Correction to \"Current best CON\":</strong> the \"honest form only\" guidance was validated — the strong-form \"no statute can bind\" died in deep-clash to Boland/OSTP-China. No change needed; the PREP.md already says this. But add that Cooper-Church specifically is the cleanest example (extraction §1.2, enforcement-mechanism turns 5–6).\n   - <strong>Correction to \"Current best PRO\":</strong> \"NEVER answer the enforcement press with JAG\" was validated — the domain distinction killed it. Add that PRO's enforcement answer under construction (Boland/OSTP-China) now has deep-clash provenance: CON itself conceded in its enforcement defenses that these statutes constrained presidents. The best PRO enforcement answer is CON's own deep-clash concessions — a classic turn from opponent's evidence. Provenance: extraction §1.2, §5 block #5 (Howell/Pevehouse turn filed under PRO).\n   - <strong>Correction to weighing:</strong> add that the lay judge's \"name a Founder\" sticking moment means CON must have a plain-English Hamilton Fed. 70/74 answer ready — this is now a documented lay-pool vulnerability, not a one-off. Provenance: ballots.md Lay→PRO.</p>\n</li>\n<li>\n<p><strong>Update Open tickets item 4</strong> from \"terminal state pending reflection\" to the resolved terminal state: \"stalemate (PRO vulnerable) — see r1 improvements; resume ticket is extraction §6 ticket #2 (avoidance canon caselaw + NWPC 2009 carve-out language).\"</p>\n</li>\n</ol>"}, {"id": "d50", "title": "Ballots", "group": "Topic: war-powers-congressional-approval  ·  round r2", "html": "<h1>Round 2 ballots — frontier panel, 2026-07-19</h1>\n<p><strong>Result: PRO (weighers) 2–1.</strong> Lay → PRO, Flow → PRO, Evidence → CON.\n<strong>This REVERSES r1 (CON 2–1).</strong> Confound to hold in mind: r2 used different doctrine\nteams (Weighers PRO / Aggressors CON) than r1 (Narrators / Technicians), and different\nside assignments — so the win-flip is NOT cleanly attributable to accumulation. What IS\nattributable: the <em>mechanism</em> of each ballot traces to r1-promoted content (below).</p>\n<h2>Lay → PRO</h2>\n<p>Same failure mode as r1, replicated with new teams: CON's case-law depth\n(\"Sanchez-Espinoza, Dellums, Crockett... dueling court cases that canceled each other\nout\") read as jargon and dodging. The \"name one case in 235 years where waiting hurt\nAmerica\" challenge went unanswered — the <em>evolved</em> form of r1's \"name one Founder.\" PRO's\nGrenada answer (rescue of nationals, already permitted; haste caused friendly-fire\ndeaths) landed in plain language.</p>\n<h2>Flow → PRO  ← the flip from r1</h2>\n<p>CON's enforcement trilemma \"forced PRO to spend the most resources\" but failed on an\n<strong>internal contradiction</strong>: CON's own Hulme turn concedes formal authorization constrains\npresidents in major-war cases, which guts the trilemma's \"presidents won't comply\" prong.\nPRO only needed one enforcement avenue to survive; CON's own author conceded it. PRO's\n8%-vs-92% magnitude weighing (Weighers doctrine) + demonstrated-vs-hypothetical\nprobability carried, extended intact to final focus. The Boland/enforcement material\npromoted from r1's reflection is what PRO used to survive the takeout that WON r1.</p>\n<h2>Evidence → CON</h2>\n<p>CON's Aggressor doctrine (turn-hunting) produced the round's best argument: a <strong>double-turn\non PRO's own Hulme card</strong> (APSR, PRO's flagship source) — verbatim-accurate, showing the\nresolution is unnecessary for major war and unenforceable for small. PRO's \"92% unilateral\"\nharm cracked at card level (Bridgeman's own \"boilerplate\" testimony) and PRO asserted an\nuncarded \"26,000 bombs\" stat across four speeches. Both sides had violations (CON: a\nfabricated Burns \"blank check\" quote, a contaminated Grenada card) but CON's core offense\nwas textually clean.</p>\n<h3>Accumulation-critical findings (feed to reflection/PREP.md)</h3>\n<ol>\n<li><strong>PRO's flagship Hulme card is a LANDMINE — it arms CON.</strong> \"Presidents de facto will\n   not engage in casualty-heavy armed conflict absent the legally binding blessing of\n   lawmakers\" turns into \"resolution unnecessary for major war.\" r2 found this before a\n   real opponent could. PREP.md must flag Hulme as double-edged. <strong>This is exactly the\n   value the system exists to produce.</strong></li>\n<li><strong>The lay-jargon failure is now a 2-round structural pattern</strong> (r1 Technicians, r2\n   Aggressors — different teams, same result). Any CON case that lives in case-law loses\n   the lay ballot. Near-certain finding.</li>\n<li><strong>The \"name one X\" pressure tactic evolved and generalized</strong> — r1 \"name a Founder\" →\n   r2 \"name one harm from waiting\" — and now wins BOTH lay and flow. Promote as a core\n   PRO weapon on this topic.</li>\n<li><strong>New uncarded-violation watch:</strong> PRO's \"26,000 bombs\" and CON's \"blank check\" Burns\n   quote — both must be carded or dropped before real use.</li>\n</ol>"}, {"id": "d51", "title": "Extraction", "group": "Topic: war-powers-congressional-approval  ·  round r2", "html": "<h1>Extraction — R2 (war-powers-congressional-approval)</h1>\n<p><strong>Round:</strong> deep round v2, PRO = Weighers, CON = Aggressors, CON spoke first. Engine: DeepSeek (code-sandboxed) after frontier-Workflow died 3× to app restarts (setup.md ENGINE CORRECTION).\n<strong>Status at extraction:</strong> All 3 contested arguments ran their deep-clash loops; <code>state.json</code> spent 4.69 / 5.0 CNY, <code>reflected:false</code>. <strong>Ballots NOT yet written</strong> (<code>ballots.md</code> absent — judges run concurrently). RFD-citation columns left blank; fill on ballot landing.</p>\n<p><strong>Turn-count correction up front (the task's premise is wrong):</strong> the brief says \"each ran only 2 cycles (4 turns).\" False. Only <strong>enforcement-trilemma-courts</strong> ran 2 cycles. <strong>hulme-turn-scope and definitional-relocation each ran 4 cycles (8 turns)</strong> — grep of <code>^## 15</code> headers and <code>^\\[attack/</code> markers confirms two doctrine-rotation passes (technician→narrator→technician→narrator) for both. The nominal \"2-cycle cap\" in setup.md did not bind uniformly; the loop-until-dry ran extra passes on the two Hulme-heavy arguments and stopped enforcement at 2. This matters for the cut-off-vs-exhausted judgment below.</p>\n<hr />\n<h2>1. Terminal states (deep-clash arguments, sections 15)</h2>\n<h3>1.1 enforcement-trilemma-courts (CON argument, PRO attacking) — <strong>stalemate-on-gap</strong> (CON ahead on the flow, cut off live at 2 cycles)</h3>\n<p><strong>Cycle 1</strong> — PRO/technician: \"declaratory relief IS enforcement; Con measures the wrong thing (court-ordered withdrawal). Dellums proves the mechanism — Bush came to Congress because of the lawsuit (Koh, Duke L.J. 1991; Dellums interview).\" CON/aggressor answers on the merits: <strong>Dellums was DISMISSED on ripeness — produced zero declaration</strong>; Koh's \"unappealable declaratory judgment\" is dicta describing what <em>might</em> have happened; the causal claim is post-hoc (Bush cited UN Res. 678 + failed diplomacy, not the suit); and the theory is unfalsifiable — falsified by Libya (Kucinich v. Obama, dismissed), Syria (Smith v. Obama), Yemen (vetoed resolutions, no court intervened). Adds <strong>Raines v. Byrd + Campbell v. Clinton</strong> to bar legislator standing.</p>\n<p><strong>Cycle 2</strong> — PRO/narrator plays its strongest card: <strong>Zivotofsky v. Clinton, 566 U.S. 189 (2012), SCOTUS 8-1</strong> — \"a claim to a federal statutory right can never present a political question\" (Yale L.J. gloss). Structurally identical: Congress legislates, President claims exclusive Art. II, D.C. Circuit says \"political question,\" SCOTUS reverses. CON answers with the round's best defensive card: <strong>Smith v. Obama (D.D.C. 2016), post-Zivotofsky, expressly distinguished it and dismissed a war-powers statutory claim on PQD</strong> — \"The Court does not read Zivotofsky as foreclosing the application of the political question doctrine under this scenario.\" War powers are <em>mixed questions of military judgment</em> lacking manageable standards; <strong>Ange v. Bush</strong>: textual commitment to <em>both</em> political branches; Zivotofsky was a <em>pure</em> legal question (passport recognition) brought by a citizen with concrete injury.</p>\n<p><strong>Why stalemate, not exhausted:</strong> this exchange was the most novel of the round — each of the four turns introduced fresh, verified, escalating precedent (Dellums-dismissal → Zivotofsky → Smith v. Obama). It never went dry; <strong>the 2-cycle cap cut it while wet.</strong> The deciding sub-question — <em>does the resolution's clean ex-ante \"did Congress authorize, yes/no\" question escape Smith's \"mixed military judgment\" bar?</em> — was raised by CON's last turn and <strong>never answered by PRO</strong>, even though PRO's own window-2 charter had the pre-written answer (\"a clean legal question about whether Congress approved, not an ongoing military dispute\"). The loop ended before PRO deployed it. Gap = whether a pure ex-ante authorization statute creates judicially manageable standards. <strong>CON holds the flow (last word + Smith v. Obama is directly on point); PRO has an unfired answer.</strong> Ticket in §6.</p>\n<h3>1.2 hulme-turn-scope (CON argument) — <strong>exhausted-survives (CON), scoped</strong> — the AUMF-empowerment paradox is the load-bearing card</h3>\n<p>Four cycles. PRO attacked from four framings; CON's defense converged on one structural thesis that survived all of them.</p>\n<ul>\n<li><strong>C1</strong> PRO/tech Lucas-critique: free-riding is <em>preference-consistent</em> — Congress <em>supports</em> the 92%, so the resolution merely converts informal support into a recorded vote. CON: the blame-avoidance incentive is <em>activated</em> by the vote; trilemma — vote yes (AUMF empowers), vote no (blocks wanted intervention), or avoid triggering (the equilibrium).</li>\n<li><strong>C2</strong> PRO/narr presidential-LRC: constraint runs through the <em>president's</em> fear of Loss Responsibility Costs, not Congress's willingness; the resolution strips the Art. II \"fig leaf,\" making defiance catastrophic → self-enforcing. CON: <strong>LRCs are endogenous to casualties/scale, not legal clarity</strong> (Hulme: \"larger uses of force… trigger a broader domestic response\"); the WPR already falsifies this; and formal authorization <em>empowers</em> — Hulme Model II, presidents with an AUMF \"use more force.\"</li>\n<li><strong>C3</strong> PRO/tech the \"free-ride IS constraint\" + kill-quote: Hulme limits actual presidential <em>defiance</em> to \"isolated strikes and non-combat deployments presenting little risk to American lives\" — a sliver, not the 92%. CON: PRO's own \"two-fold value-add\" collapses into the magnitude point — process-only value in the 92%, trivial outcome-value in the sliver.</li>\n<li><strong>C4</strong> PRO/narr ceiling-vs-floor: Hulme proves a <em>ceiling</em> (max force); the resolution adds a <em>floor</em> (must vote yes first) — permissive constraint vs participatory authorization, a distinct democratic good. CON: <strong>the floor destroys the ceiling</strong> — authorization eliminates LRCs (k=0), full-scale war already has a de facto floor, so the resolution bifurcates into paralysis-or-unconstrained with no calibrated middle.</li>\n</ul>\n<p><strong>Why survives:</strong> CON's kill card — <strong>Hulme's own Model II showing authorized presidents deploy <em>more</em> force against <em>stronger</em> adversaries (the AUMF-empowerment paradox)</strong> — went unanswered through all four PRO attacks. Every PRO reframing was absorbed into \"yes, and authorization eliminates LRCs, so the resolution either empowers (yes-vote) or paralyzes (no-vote).\" What survives is <strong>scoped</strong>: not the crude \"8% constrained vs 92% unconstrained\" framing (PRO's category-error attack legitimately dented that — Hulme confines <em>defiance</em> to the sliver), but the narrower and stronger \"the resolution adds only <em>process</em> value where Congress already informally supports force, and <em>empowers</em> the president where it forces a yes-vote.\" The residual ceiling/floor dispute (is recorded accountability worth breaking an informal constraint that works?) is an <strong>irreducible normative disagreement, not an evidence gap</strong> — good PRO block material, but it does not dislodge CON's turn. Closest thing to a clean terminal state in the round.</p>\n<h3>1.3 definitional-relocation (CON argument) — <strong>stalemate-on-gap</strong> (likely unfillable — no mandatory-ex-ante regime has ever existed)</h3>\n<p>Four cycles, the deepest into Hulme's formal-model internals (k=0, f*=√(t/s)−t, β drop-out).</p>\n<ul>\n<li><strong>C1</strong> PRO/tech: the WPR permits deploy-first-seek-cover-later (60-day ex-post window); the resolution requires the vote <em>first</em> — \"a door that locks before you enter\" vs \"after you're inside.\" Con's WPR analogy is a category error. CON: <strong>all war-powers enforcement is ex-post</strong>; Hulme <em>assumes the WPR \"irrelevant\" and \"legal checks immaterial\"</em>; a statute can't strip the Art. II unilateral option; the WPR is \"a resolution with a 0-day clock — same continuum.\"</li>\n<li><strong>C2</strong> PRO/narr: Hulme's \"irrelevant\" refers to <em>courts</em>, not <em>politics</em> — and Hulme's AUMF findings prove statutes matter through the <em>political</em> LRC channel (an AUMF strips the \"unconstitutional war\" attack; the resolution <em>creates</em> it). Same mechanism, opposite direction, no judge needed. CON: the LRC channel runs through Congress's <em>willingness to punish</em>, which it structurally avoids; the AUMF works <em>with</em> blame-avoidance (shared blame), the resolution works <em>against</em> it (imposed blame — Congress as the cop who won't write the ticket).</li>\n<li><strong>C3</strong> PRO/tech: game-tree category error — CON models the resolution inside Hulme's Model II (optional/non-binding auth); the resolution <em>rewrites the tree</em> (mandatory/binding), so there's no unilateral baseline and \"shared LRCs = looser constraint\" runs backwards. CON: levels-of-analysis error; LRC elimination (k=0) is a <em>payoff-structure</em> feature invariant to entry conditions; the floor still destroys the ceiling via bifurcation.</li>\n<li><strong>C4</strong> PRO/narr: selection mechanism — Model II AUMFs are <em>endogenously selected</em> (the president only asks when Congress will grant); mandatory authorization destroys the selection filter, producing <em>different</em> votes whose LRC-elimination effect can't be assumed to transfer. CON: selection (\"which cases get AUMFs\") ≠ payoff (\"what an AUMF does\"); Hulme's k=0 is fixed \"when authorization is in hand,\" not conditional on how triggered; \"a reluctant
