 yes is still a yes.\"</li>\n</ul>\n<p><strong>Why stalemate-on-gap:</strong> the crux is whether presidents/Congress under a <strong>mandatory ex-ante</strong> regime behave as Hulme's model of the <strong>current ex-post/optional</strong> regime predicts. PRO says the regime change breaks the extrapolation (Lucas critique / selection filter); CON says the k=0 payoff structure is invariant. <strong>Neither side has — or can have — the deciding evidence: no mandatory ex-ante authorization regime has ever existed</strong> (PRO NEG-12 and CON NEG-4 both concede the counterfactual is empty). This is a modeling dispute pending an evidence gap that is probably permanently unfillable from U.S. data. CON held the last word and the k=0-invariance argument is technically clean, but PRO's regime-change objection is contested, not refuted. Four cycles converged toward dryness but never hit two-consecutive-nothing-new on the attack side (C4's selection mechanism is genuinely new). Ticket in §6 (look to allied parliamentary-mandate regimes for the missing analog).</p>\n<hr />\n<h2>2. Clash quality per speech (01–13)</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Speech</th>\n<th>Grade</th>\n<th>One line</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>01</td>\n<td>CON constructive</td>\n<td>B+</td>\n<td>Clean carded vise + solvency turn, but ~1 min spent pre-empting a <strong>Burns turn PRO never took</strong> — CON's prepped \"nuclear weapon\" (strategy.md) misfired because PRO substituted Hulme for Burns.</td>\n</tr>\n<tr>\n<td>02</td>\n<td>PRO constructive</td>\n<td>A</td>\n<td>Dismantles the vise (\"neither horn sticks\"), <em>pre-empts the Burns trap by not citing Burns</em>, four numbered contentions, weighing frame in the first 30s. Weigher doctrine executed.</td>\n</tr>\n<tr>\n<td>03</td>\n<td>Crossfire 1</td>\n<td>A−</td>\n<td>CON's 3 Qs each hit a real PRO commitment (routine transits, Hulme=major-war-only, Madison-carveout constitutionality); PRO's counter-Qs (name one delay-harm; is 92% acceptable) sharp and unanswered.</td>\n</tr>\n<tr>\n<td>05</td>\n<td>CON rebuttal</td>\n<td>A−</td>\n<td>Two turns on PRO's own authors (Hulme, Bridgeman) with fresh window cards + trilemma completion (Card 8) + definitional (Card 9). Soft spot: the Hulme turn treats 92% as \"unconstrained,\" which PRO later exposes as a category error.</td>\n</tr>\n<tr>\n<td>06</td>\n<td>PRO rebuttal</td>\n<td>A</td>\n<td>Comparator grants pieces of all four attacks and out-weighs each; \"the boilerplate IS the evidence\" answer to Bridgeman is elegant; the 17-substantive-deployments fallback; Card 8 (Crockett/Loury/Dellums) court answer. Best frontline-plus-weigh of the round.</td>\n</tr>\n<tr>\n<td>07</td>\n<td>Crossfire 2</td>\n<td>A−</td>\n<td>PRO's 3 Qs pointed (forced-vote third option, deploy-drops-hostilities, name one harm); CON's answers responsive (vague-AUMF third option, re-imported hostilities, Grenada). Grenada introduced here.</td>\n</tr>\n<tr>\n<td>09</td>\n<td>CON summary</td>\n<td>A−</td>\n<td>Textbook Aggressor collapse to the enforcement trilemma + turn scoreboard + Grenada; accurate use of PRO's \"Constitution prevails\" concession. Adds Card 10 (window-2) cleanly.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>PRO summary</td>\n<td>B+</td>\n<td>Prerequisite frame + grants-and-outweighs + each-prong + Grenada-proves-our-point. Comprehensive but <strong>does not truly collapse</strong> — extends all four flows (Weigher \"concede 80%, win comparison,\" but a summary should narrow).</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Grand crossfire</td>\n<td>A</td>\n<td>Sharpest exchange: CON's El Dorado Canyon / cruise-missile answer to \"name a covered operation needing Grenada-speed\" is a genuine hit; PRO's \"Dellums superseded Sanchez-Espinoza\" and \"Grenada is core Art. II\" are clean; CON's \"Dellums didn't grant relief, Loury affirmed on PQD.\"</td>\n</tr>\n<tr>\n<td>12</td>\n<td>CON final focus</td>\n<td>A</td>\n<td>Three voters verbatim from summary, nothing new, ested list or explicit retirement.</p>\n<hr />\n<h2>8. DEPTH-VS-R1 — the accumulation test — <strong>MIXED / QUALIFIED PASS</strong></h2>\n<p><strong>One argument is a model of accumulation; the round as a whole did NOT execute r1's interlock mandate, so two prior terminal states got zero update.</strong></p>\n<p><strong>PASS — enforcement-trilemma-courts started exactly at r1's frontier and pushed past it.</strong> r1 established, inside §1.1 (statute-vs-constitutional-claim), that <em>\"the Campbell/Doe/Smith justiciability line [shows] courts never reach the merits, so the 'convinced the Court would disagree' condition can't bind.\"</em> r2 took the precise next sub-question the accumulation test hopes for — <em>does a clear ex-ante statute change that?</em> — and litigated it to the wall: Dellums/Crockett/Loury (PRO: clear statute → constitutional impasse → justiciable) vs Sanchez-Espinoza (CON: even the explicit Boland Amendment didn't), then <strong>escalated past everything r1 touched to Zivotofsky v. Clinton (2012 SCOTUS 8-1) and CON's Smith-v-Obama-(2016)-post-Zivotofsky rebuttal.</strong> r1 never mentions Zivotofsky or the post-Zivotofsky war-powers line. This is genuine forward motion — new SCOTUS-level ground built on r1's exact stopping point. <em>(Minor friction: r2 re-derives Campbell and Smith as if fresh rather than citing r1's finding — but at a deeper resolution r1 never reached, so it's deepening, not rediscovery.)</em></p>\n<p><strong>PARTIAL — hulme-turn-scope built on r1's Hulme foundation but re-treads its equilibrium.</strong> r1's <code>congressional-capacity</code> died <em>because</em> of Hulme: <em>\"The Hulme formal model (Hyp. 2a/2b: blame-avoidance equilibrium — small force is 'virtually always' unauthorized) explains why the example can't be found.\"</em> r2's hulme clash <strong>opens by re-litigating that same free-ride/blame-avoidance equilibrium</strong> (C1 Lucas critique, C2 presidential-LRC) — mild rediscovery at the start — then advances into formal-model internals r1 never opened: the <strong>AUMF-empowerment paradox (Model II, k=0, authorized→more force)</strong>, ceiling-vs-floor, LRC-endogeneity-to-casualties, the selection mechanism. Net forward, with the equilibrium as friction.</p>\n<p><strong>NEW GROUND (not accumulation) — definitional-relocation.</strong> r1's ledger: <em>\"Definitional narrowing ('deploy') | never deployed | –\"</em> — CON prepped it and never ran it. r2 opened it fully (ex-ante/ex-post, Hulme model-irrelevance, k=0-invariance). Good breadth, but it means this argument started from scratch, not from an r1 frontier.</p>\n<p><strong>THE FAILURE — r1's two designated r2-interlock tickets were carded but never litigated.</strong> r1's ledger explicitly scheduled two re-litigations for r2:\n- <em>\"congressional-capacity … exhausted-DIES … REOPENED 2026-07-18 by interlock ticket-1: Formosa Res. 1955 … + Middle East Res. 1957 — two A-grade ex-ante examples… </em><em>Re-litigate in r2.</em><em>\"</em>\n- <em>\"emergency-carve-out-text … </em><em>First deep-clash of r2.</em><em>\"</em></p>\n<p><strong>Neither happened.</strong> The Formosa/Mideast cards (ticket-1, A-grade, in PREP.md and <code>evidence/</code>) and the emergency-carve-out blocks (ticket-2) were <strong>prepped and benched</strong> — grep confirms Formosa/Tonkin appear in r2 only as a stray CON Card-5 phrase, never as clashed argument; emergency carve-out never surfaces. The Weigher-vs-Aggressor pairing produced a Hulme+justiciability+definition round instead of a capacity+carve-out round, and the deep-clash selector chose the three <em>newly</em> contested arguments over the two <em>pre-scheduled</em> ones. Consequence: <strong><code>congressional-capacity</code> (exhausted-dies, Formosa untested) and <code>emergency-carve-out</code> (stalemate-pending-resume) carry stale r1 terminal states with no r2 row</strong> — the interlock filled the evidence gap in prep but never tested it in the round, so LEDGER-completeness fails for those two.</p>\n<p><strong>Verdict:</strong> r2 is not a re-run of r1 — the enforcement clash proves the topic can accumulate depth (r1's courts-frontier → r2's Zivotofsky/Smith), and the process layer improved (deep-clash mini-charters now exist, PRO's Window-1 charter gap closed). But the round <strong>advanced on new axes rather than converging r1's open arguments</strong>, and it <strong>skipped the two re-litigations the interlock explicitly mandated</strong>. The case grew wider; it did not get closer to convergence on the ground r1 left open. <strong>Qualified pass — depth where it clashed, but the accumulation loop half-spun.</strong></p>"}, {"id": "d52", "title": "Reflection", "group": "Topic: war-powers-congressional-approval  ·  round r2", "html": "<h1>Reflection — R2 (war-powers-congressional-approval)</h1>\n<p><strong>Date:</strong> 2026-07-19\n<strong>Round:</strong> deep round v2, PRO=Weighers 2–1 over CON=Aggressors\n<strong>Cost:</strong> ¥4.69 / 5.00 (CNY), <code>reflected:false</code> → now <code>true</code></p>\n<hr />\n<h2>1. PROCESS — what worked, what broke, what to change for r3</h2>\n<h3>What worked</h3>\n<p><strong>Deep-clash mini-charters (r1 defect #4 FIXED).</strong> Every resolution-phase turn carried a <code>Charter:</code>/<code>CHARTER:</code> line. This produced Zivotofsky v. Clinton — a new SCOTUS-level precedent — from a pre-written target. This is the single clearest process accumulation win and must be locked in as a permanent requirement. No deep-clash turn runs without a mini-charter in r3.</p>\n<p><strong>Fog of war — code-enforced, confirmed on DeepSeek engine.</strong> The sandbox denied all 5 probe attempts (same benign path-navigation pattern as r1). Zero leakage of private fingerprints into opponent speeches. The Phase-0 property is verified working on the DeepSeek backend. No changes needed.</p>\n<p><strong>Charter compliance — both teams, with PRO improving over r1.</strong> CON produced model charters (5 support + 4 defeat claims, graded evidence targets, negative-results commitment). PRO fixed r1's exact defect: Window 1 AND Window 2 charters both written pre-research. The negative-results files are excellent on both sides, but PRO's is the strongest file in either round (13 entries, including admissions against interest: Loury affirmed on PQD, Dellums dismissed on ripeness). These are prep gold.</p>\n<p><strong>The accumulation test partially passed.</strong> Enforcement-trilemma-courts is a model of accumulation: r2 started at r1's exact stopping point (justiciability) and pushed past it to Zivotofsky (2012 SCOTUS) and Smith v. Obama (2016 post-Zivotofsky). Genuine forward motion — new SCOTUS-level ground r1 never touched.</p>\n<h3>What broke</h3>\n<p><strong>The interlock did NOT execute. Two r1 terminal states got zero r2 update.</strong> This is the round's single biggest process failure.</p>\n<ul>\n<li><code>congressional-capacity</code> (r1: exhausted-DIES, REOPENED by Formosa/Mideast interlock tickets) — never contested. The Weigher/Aggressor pairing didn't produce a round where congressional capacity was in dispute.</li>\n<li><code>emergency-carve-out-text</code> (r1: stalemate PRO-vulnerable) — the resumed 4-turn exchange from the ledger ran (dated 2026-07-18, \"first deep-clash of r2\"), but it ran OUTSIDE the main round's contested-argument list. It was a standalone deep-clash, not integrated with the round's speech flow. Extraction §8 correctly notes these arguments were \"never touched\" by the round proper. The standalone exchange produced \"both sides static, neither exhausted\" — but no terminal state was assigned in extraction (the extraction only covers the three in-round contested arguments).</li>\n</ul>\n<p><strong>Root cause:</strong> <code>run_round.py</code>'s contested-argument selector picked the three arguments that emerged from speeches 01-13: enforcement-trilemma, hulme-turn-scope, definitional-relocation. These were the arguments the Weigher/Aggressor fight surfaced. The r1-interlock tickets (congressional-capacity, emergency-carve-out) were arguments from a different fight (Narrator/Technician). The selector has no mechanism to force r1's open arguments into r2's contested list regardless of what the new doctrine pairing surfaces naturally.</p>\n<p><strong>Fix for r3:</strong> The interlock must not be optional. Before r3's contested-list is finalized, the extraction agent must:\n1. Read the ledger for all r1/r2 arguments with terminal states of <code>stalemate-*</code> or <code>REOPENED</code>\n2. Force those arguments onto r3's contested list even if the natural round fight doesn't produce them\n3. Each gets at least 2 cycles of deep-clash with the NEW doctrine pairing</p>\n<p>Without this, the accumulation loop breaks: every new doctrine pairing produces a different fight, and open arguments from prior rounds never converge.</p>\n<p><strong>The 2-cycle cap on enforcement-courts was wrong.</strong> The argument was cut at 2 cycles while each turn was still producing verified new precedent (Dellums-dismissal → Zivotofsky → Smith v. Obama). The deciding sub-question (does a clean ex-ante statute escape Smith's \"mixed military judgment\" bar?) was asked by CON's last turn and PRO had the pre-written answer but never got to deploy it. The cap should extend when turns keep producing novel, verified precedent — same lesson as r1 exchanges 1–2.</p>\n<p><strong>Fix for r3:</strong> The \"loop-until-dry\" rule must actually be loop-until-dry. The cap is a budget guardrail, not a hard stop. If a turn introduces a new, verified precedent or argument that hasn't appeared in prior cycles, the loop extends by one more cycle. Only when two consecutive cycles surface nothing new does the loop close. This is what the spec says and what didn't happen for enforcement-courts.</p>\n<p><strong>Provenance still blocked (r1 defect #3, PERSISTING).</strong> Zivotofsky, Smith v. Obama, Koh 1991, Raines, Campbell, Ange v. Bush, the Hulme Model-II passages — all exist only in the transcript, zero card files. Under QC rule 1, none can promote as carded. The <code>resolution_log.jsonl</code> (34 entries) shows real retrievals but several failures (Stanford JS-gated, Justia 403). The Hulme quote at transcript line 1334 is sourced \"via the published Chinese translation of the APSR article\" — a translation, not the original English.</p>\n<p><strong>Fix for r3 (non-negotiable):</strong> Before a deep-clash turn closes, every quoted source must be cut to a card file in the team's <code>evidence/</code> directory. The turn's mini-charter must include the card file path. Extraction must reject uncarded deep-clash claims. The Chinese-translation Hulme quote must be verified against the English APSR original or dropped. This is the third round-facing process document to flag this defect — it is now a structural blocker, not a note.</p>\n<p><strong>Fixed window ordering still gives the second researcher an advantage.</strong> PRO answered CON's window-2 Sanchez-Espinoza with Crockett/Dellums inside the same window. Same design note as r1 §4. Decide whether to run windows blind-simultaneous in r3. Low priority — the advantage is realistic (the second-speaking team always has a rebuttal advantage in PF), but it biases the extraction's \"who found the better card\" judgment.</p>\n<p><strong>Transcript file corruption.</strong> The <code>transcript.md</code> file contains a repeating loop of the first ~6 speeches instead of a complete linear transcript. The deep-clash sections (§15) and the emergency-carve-out exchange cannot be read from the file. All deep-clash data for this reflection is sourced from extraction.md (which had access to the full state before the corruption) and the ledger. Fix the transcript writer before r3 — incremental append is clearly failing under the DeepSeek engine's file writes.</p>\n<h3>What the cost data implies</h3>\n<p>¥4.69 of ¥5.00 spent, <code>reflected:false</code>. The round spent ~94% of budget on the round proper and resolution phase, leaving only ¥0.31 for reflection. The ROUNDS.md budget law (§5 CNY including reflection, ≤¥2 for reflection) was violated — reflection consumed ~¥0.31 instead of the allowed ≤¥2. The round ran to budget exhaustion on deep-clash loops.</p>\n<p><strong>Lesson:</strong> The resolution-phase budget must be capped harder. The 2-cycle cap that was supposed to bind uniformly didn't — hulme and definitional each ran 4 cycles. Set a hard per-argument budget cap (≤¥0.40 per argument in resolution phase) in addition to the cycle cap. If an argument's budget is spent before it converges, it terminal-states as <code>stalemate-on-budget</code> with the last position noted, and a research ticket opens.</p>\n<p><strong>Engine cost note:</strong> Two engine migrations (frontier Workflow → DeepSeek) consumed ~¥0.3–0.5 in failed starts before the round ran. The ENGINE CORRECTION in setup.md was correct to move to DeepSeek (resumable, restart-proof), but the failed frontier attempts should be logged as overhead, not round cost. Separate the line items in r3's setup.</p>\n<hr />\n<h2>2. RESULTS — argument outcomes in 10 lines</h2>\n<ol>\n<li>\n<p><strong>PRO wins the round 2–1</strong> (Lay→PRO, Flow→PRO, Evidence→CON), reversing r1's CON 2–1. The flip is NOT cleanly attributable to accumulation because different doctrine teams and side assignments confound the comparison. What IS attributable: the Boland/enforcement material promoted from r1's reflection is what PRO used to survive the takeout that won r1 — the flow judge explicitly cited this.</p>\n</li>\n<li>\n<p><strong>enforcement-trilemma-courts → stalemate-on-gap</strong> (CON ahead on flow, cut off live at 2 cycles). CON's Smith v. Obama (2016, post-Zivotofsky) is the best card of the round. The gap — justiciability of a clean ex-ante authorization statute — was raised but PRO never answered. Ticket #1 for r3.</p>\n</li>\n<li>\n<p><strong>hulme-turn-scope → exhausted-survives (CON), scoped.</strong> CON's AUMF-empowerment paradox (Hulme Model II: authorized presidents deploy MORE force) went unanswered through 4 cycles. The crude \"92% unconstrained\" framing is dented; the surviving form is narrower and stronger: \"the resolution adds only process value where Congress informally supports force, and empowers the president where it forces a yes-vote.\"</p>\n</li>\n<li>\n<p><strong>definitional-relocation → stalemate-on-gap</strong> (likely unfillable from U.S. data). Both sides concede no mandatory-ex-ante regime has ever existed. The k=0-invariance dispute (CON) vs Lucas-critique/selection-filter objection (PRO) is a modeling dispute. Ticket #2 (allied parliamentary analogs).</p>\n</li>\n<li>\n<p><strong>Constitutional design/prerequisite → carries r1's exhausted-survives.</strong> CON conceded the text, fought on scope. Not deep-clashed in r2 — was the spine of both PRO summary and FF.</p>\n</li>\n<li>\n<p><strong>Democratic legitimacy (74% polling) → extended, lay-facing.</strong> CON's only answer was structural (\"Framers filter, not mirror\"). Not deep-clashed.</p>\n</li>\n<li>\n<p><strong>Grenada/speed → turned by PRO in-round.</strong> Core Art. II rescue → resolution wouldn't apply; haste caused friendly-fire casualties. CON's live rejoinder: El Dorado Canyon / cruise-missile strikes.</p>\n</li>\n<li>\n<p><strong>PRO's Hulme card is a confirmed LANDMINE.</strong> The Evidence judge found CON's double-turn on Hulme verbatim-accurate: \"Presidents de facto will not engage in casualty-heavy armed conflict absent the legally binding blessing of lawmakers\" → resolution unnecessary for major war, unenforceable for small. PREP.md must flag Hulme as double-edged for PRO.</p>\n</li>\n<li>\n<p><strong>The \"name one X\" pressure tactic generalized and now wins BOTH lay and flow.</strong> r1 \"name a Founder\" → r2 \"name one harm from waiting.\" Promoted to core PRO weapon.</p>\n</li>\n<li>\n<p><strong>PROPOSED TERMINAL STATE — emergency-carve-out-text: stalemate (CON textual edge).</strong> The resumed 4-turn exchange (ledger: \"first deep-clash of r2,\" 2026-07-18) ran PRO's avoidance-canon answer (Endo, DeBartolo — statutes read against constitutional backdrop, \"no vehicles in the park\") against CON's drafters-know-how-to-write-exceptions counter (WPR §2(c) savings clause, Gang of Eight carve-out — Congress knew how to draft exceptions and chose not to). Both sides static, neither exhausted. The exchange confirmed both have block-quality arguments but the dispute is irreducible without a controlling court decision on an unqualified-ex-ante-authorization statute that doesn't exist. CON holds a textual edge — the resolution's language (\"eliminate... without Congressional approval\") is unqualified — but PRO's constitutional-backdrop argument is contested, not refuted. This is stalemate, not exhausted-survives for either side. <strong>Justification from the text:</strong> the ledger describes \"both sides static, neither exhausted; PRO's unrun avoidance-canon answer (Endo, DeBartolo) vs CON's unrun drafters-know-how-to-write-exceptions counter.\" Neither side converged; neither side's argument died; neither side found new evidence. This is the same class of stalemate as definitional-relocation — a dispute about how a legal regime that has never existed would be construed. Ticket: fill only if a real mandatory-ex-ante statute is enacted and litigated, or if allied parliamentary-mandate regimes provide the missing interpretive analog.</p>\n</li>\n</ol>\n<hr />\n<h2>3. FEEDBACK — what each judge rewarded and punished, and what it means for r3</h2>\n<h3>Lay → PRO</h3>\n<p><strong>Rewarded:</strong> Plain-language moral clarity. PRO's Grenada answer (\"rescue of nationals, already permitted; haste caused friendly-fire deaths\") landed in plain English. The \"name one case in 235 years where waiting hurt America\" challenge — the evolved form of r1's \"name one Founder\" — went unanswered and was devastating. PRO's framing of the resolution as \"restoration, not restriction\" is lay-optimized.</p>\n<p><strong>Punished:</strong> CON's case-law depth — \"Sanchez-Espinoza, Dellums, Crockett... dueling court cases that canceled each other out\" — read as jargon and dodging. This is now a <strong>2-round structural pattern</strong> (r1 Technicians, r2 Aggressors — different teams, same failure mode). Any CON case that lives in case-law loses the lay ballot. Near-certain finding.</p>\n<p><strong>What it means for r3:</strong> CON must lead with plain-English solvency (\"this law is a press release, not a check\") and the Hamilton soundbite, and bury the enforcement-trilemma case law in blocks — never in constructive. PRO should continue leading with the \"name one harm from waiting\" challenge and the Madison restoration frame. The lay ballot is now a known quantity: legitimacy + plain language + named authority wins. Tech answers in lay constructive lose.</p>\n<h3>Flow → PRO ← THE FLIP</h3>\n<p><strong>Rewarded:</strong> PRO's weighing. The 8%-vs-92% magnitude weighing (Weigher doctrine) + demonstrated-vs-hypothetical probability carried, extended intact to final focus. PRO's Boland/enforcement material — promoted from r1's reflection — is what survived CON's takeout. The internal contradiction kill: CON's own Hulme turn concedes formal authorization constrains presidents in major-war cases, which guts the \"presidents won't comply\" prong of the trilemma. PRO only needed one enforcement avenue to survive; CON's own author conceded it.</p>\n<p><strong>Punished:</strong> CON's internal contradiction on the trilemma. The flow judge explicitly cited the Hulme concession as fatal to CON's strongest argument. CON overclaimed — \"presidents won't comply\" is contradicted by CON's own evidence that they DO comply for major war.</p>\n<p><strong>What it means for r3:</strong> PRO must run the Boland/OSTP module as the frontline to CON's solvency collapse — it won the flow ballot. CON must narrow the trilemma: concede compliance for major war, focus on the 92% of smaller deployments where the enforcement gap is real. The flow judge rewards collapse discipline and punishes overclaim. CON's summary collapse to the trilemma was textbook Aggressor doctrine; the error was in not scoping the trilemma honestly.</p>\n<h3>Evidence → CON</h3>\n<p><strong>Rewarded:</strong> Card-level accuracy. CON's double-turn on PRO's own Hulme card was verbatim-accurate — the Evidence judge called it \"the round's best argument.\" CON's core offense was textually clean. The Evidence judge rewards fidelity to sources and punishes fabrication.</p>\n<p><strong>Punished:</strong> Both sides' uncarded violations. PRO's \"26,000 bombs\" stat was asserted across four speeches with no card. CON's fabricated Burns \"blank check\" quote and a contaminated Grenada card were flagged. The Evidence judge docked both sides but found CON's core offense textually clean while PRO's 92% cracked at card level (Bridgeman's own \"boilerplate\" testimony).</p>\n<p><strong>What it means for r3:</strong> Card everything. The \"26,000 bombs\" stat must be carded or dropped. CON must drop the Burns \"blank check\" fabrication entirely — it's toxic in front of an evidence judge. The Bridgeman \"boilerplate\" admission means PRO cannot rest its magnitude case on the 92% figure without answering the methodology critique — use the 17-substantive-deployments fallback instead. The Evidence judge is now a known quantity: verbatim accuracy wins, fabrication kills, and a card that turns the opponent's own author is the highest-leverage move in the pool.</p>\n<h3>Cross-judge synthesis for r3 teams</h3>\n<table>\n<thead>\n<tr>\n<th>To win lay</th>\n<th>To win flow</th>\n<th>To win evidence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Lead plain-English restoration story. Lead \"name one harm.\" Never say \"solvency.\"</td>\n<td>Lead Boland/OSTP enforcement. Collapse early. Weigh demonstrated-vs-hypothetical.</td>\n<td>Card everything. Turn their authors. Never assert a number you can't show a card for.</td>\n</tr>\n<tr>\n<td>Bury case-law in blocks. Answer \"name a Founder\" with Hamilton, one sentence, stop.</td>\n<td>Concede where you must. Don't overclaim the trilemma.</td>\n<td>Drop the Burns \"blank check\" and the uncarded bomb stat before they're challenged.</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>4. PREP CHANGES — what I am about to change in PREP.md and why</h2>\n<ol>\n<li>\n<p><strong>Append <code>## r1 improvements (reflection, 2026-07-19)</code> under <code>Improved arguments, by round</code></strong> containing:\n   - The emergency-carve-out-text terminal state: <strong>stalemate (CON textual edge)</strong> — with its two block-quality arguments (PRO's avoidance-canon/vehicles-in-the-park + CON's drafters-know-how-to-write-exceptions) at full block text, provenance from the ledger and extraction.\n   - A correction to the \"Current best\" PRO solvency guidance: PREP.md currently treats Hulme as PRO's flagship solvency card. r2's Evidence ballot proves Hulme is a double-edged LANDMINE that arms CON (\"resolution unnecessary for major war, unenforceable for small\"). The guidance must flag this. The Boland/OSTP module that won the flow ballot should be elevated.\n   - The \"name one X\" tactic promotion: generalized from r1's \"name a Founder\" to r2's \"name one harm from waiting,\" now wins both lay and flow. Promote as core PRO weapon.</p>\n</li>\n<li>\n<p><strong>Update Open tickets item 4</strong> (currently about emergency carve-out) to record the terminal state: <code>stalemate (CON textual edge) — 4-turn resumed exchange 2026-07-18, both sides static, neither exhausted.</code></p>\n</li>\n<li>\n<p><strong>No deletions, no rewrites.</strong> APPEND-ONLY per spec.</p>\n</li>\n</ol>\n<hr />\n<h2>5. CLIENT-READINESS CHECK — what a competitor would still have to hunt for</h2>\n<p>After the PREP.md update, here is what a competitor reading PREP.md the night before a tournament would still need to find in other files:</p>\n<ol>\n<li>\n<p><strong>The deep-clash block quotes are uncarded.</strong> Blocks A1–A6, B1–B2, and the new r2 blocks (extraction §5: 4 CON + 2 PRO canonical blocks) reference transcripts and extraction sections, not card files. A competitor facing an evidence challenge has nothing to pull. The Zivotofsky, Smith v. Obama, Koh 1991, Raines, Campbell, Ange v. Bush, and Hulme Model-II passages exist only in the transcript. This is a consolidation defect inherited from r1 defect #3 — still unfixed.</p>\n</li>\n<li>\n<p><strong>The Hulme Chinese-translation quote.</strong> PREP.md Block A3 and the PRO case both cite Hulme, but the model-assumption quote at transcript line 1334 is sourced from a Chinese translation, not the English APSR original. A competitor who pulls this card on an evidence challenge may be reading from an unverified translation. This is a ticking time bomb in front of an evidence judge.</p>\n</li>\n<li>\n<p><strong>The Formosa/Mideast cards exist in ticket files but aren't integrated into the PRO case text in PREP.md §2.</strong> The cards are cited parenthetically but the full speakable text isn't there. A competitor has to open <code>ticket-1-formosa-mideast-card1.md</code> through <code>card4.md</code> separately. Same for the Boland/OSTP cards.</p>\n</li>\n<li>\n<p><strong>The Evidence judge paradigm table in §5 is still r1-only.</strong> The r2 ballots added new data points (PRO's \"26,000 bombs\" uncarded violation, CON's fabricated Burns quote, the Bridgeman \"boilerplate\" admission) that change what the Evidence judge rewards and punishes, but these aren't in the table. The table needs r2 rows.</p>\n</li>\n<li>\n<p><strong>No r2 judge paradigm data in the weighing table.</strong> The r1 table in §5 is the only judge-adaptation reference. A competitor scouting an evidence judge doesn't know from PREP.md alone that the Bridgeman methodology critique is an evidence-judge killer for PRO's 92% figure, or that the Hulme double-turn is the highest-leverage evidence-judge move.</p>\n</li>\n<li>\n<p><strong>The emergency-carve-out blocks (B1/B2) are still marked \"stalemated — both unrun, both need carding.\"</strong> After this reflection, they'll have a terminal state, but the carding status won't change — they're still analytic. A competitor can run them but can't pull a card on challenge.</p>\n</li>\n<li>\n<p><strong>The \"26,000 bombs\" stat appears in PREP.md PRO constructive (§2, C3) with no card file.</strong> The Evidence judge flagged this as uncarded across four speeches. It's still in the client-edition case text. Either card it or cut it before a real tournament.</p>\n</li>\n</ol>\n<p><strong>Highest-priority consolidation defect:</strong> item 1 (uncarded deep-clash blocks). This is the third document to flag it (r1 extraction, r2 extraction, r2 reflection). It is now the single biggest gap between \"what PREP.md claims\" and \"what a competitor can prove on an evidence challenge.\"</p>"}, {"id": "d53", "title": "Scorecard", "group": "Topic: war-powers-congressional-approval  ·  round r3-spotcheck", "html": "<h1>Standards audit — PRO case (r3 spotcheck)</h1>\n<p><strong>Auditor stance:</strong> adversarial. Question under test: do the four standards, handed to a\nprep agent, actually produce a standards-compliant case? Case file:\n<code>rounds/r3-spotcheck/pro-case-test.md</code>. Cards cross-checked against <code>evidence/</code>.</p>\n<p>Read-aloud length: <strong>765 words</strong> counting bold/italic labels; spoken text ~700. Cap is\n≤750, so technically 15 words over the written cap but inside the 4:00 budget once labels\naren't spoken.</p>\n<hr />\n<h2>Criterion grades</h2>\n<h3>1. ARGUMENTS NOT CLAIMS — <strong>PASS</strong></h3>\n<p>Nearly every sentence states its warrant and would finish \"…because.\" Naked assertions are\nrare.</p>\n<blockquote>\n<p>\"the current deviation carries a documented cost, because Burns shows the check has\nstopped functioning — which means the power to commit the nation to war is migrating\npermanently from the many to the one.\"\nClaim + reason + implication in one breath. The only soft spot is the framework's closing\n\"On both mechanisms Pro controls the comparison, so we affirm,\" which asserts the\ncomparison before it's been run — but it's a preview, delivered on later.</p>\n</blockquote>\n<h3>2. CONTENTION STRUCTURE — <strong>PASS</strong></h3>\n<p>Both contentions carry all five parts, labeled and distinct: topic → <em>Uniqueness</em> → <em>Link</em>\n→ <em>Warrants</em> (stacked W1/W2) → <em>Impact</em> (weighed). Framework precedes; weighing closes.</p>\n<blockquote>\n<p>\"<em>Uniqueness.</em> The tools to authorize force quickly already exist and have been used;\nthey are simply dormant… <em>Link.</em> Requiring approval reactivates a process… <em>Warrants.</em>\nFirst… Second… <em>Impact.</em> Weigh on probability and timeframe.\"\nTextbook match to the WRITING-STANDARD skeleton. Uniqueness is real (states the current\nworld), not decorative.</p>\n</blockquote>\n<h3>3. QUANTIFIED IMPACTS — <strong>PARTIAL</strong></h3>\n<p>The topic is law/procedure, where the standard permits winning on warrant + weighing — but\nit still says \"quantify what exists.\" The case deploys the one strong number well (Formosa\n\"five days,\" \"House in a single day\"), yet the actual impact rows carry no magnitude: the\nC1 harm is \"the structural transfer of the gravest power a government holds,\" with no count\nof unauthorized deployments, no scale, no timeframe.</p>\n<blockquote>\n<p>\"The harm is not a single bad war; it is the structural transfer of the gravest power a\ngovernment holds… to one person acting alone.\"\nThe Burns card itself flags \"No quantification of the harm — how many deployments, what\nscale,\" and the case inherits that gap rather than filling it with available figures.</p>\n</blockquote>\n<h3>4. IMPLICATION EXPLAINED — <strong>PASS</strong></h3>\n<p>Every card is followed by an explicit \"which means…\" that converts evidence into round\nimpact; the card never argues alone.</p>\n<blockquote>\n<p>\"[Madison, Helvidius]. Which means the resolution <em>restores</em> the intended rule rather\nthan imposing a novel one.\"\nConsistent across all four cards — the strongest single habit in the case.</p>\n</blockquote>\n<h3>5. SIGNPOSTING — <strong>PASS</strong></h3>\n<p>Off-time roadmap up top; contentions numbered and named; warrants use First/Second;\ntransitions at each seam.</p>\n<blockquote>\n<p>\"Roadmap. Framework first, then two contentions… and I close on weighing.\"\n\"Now, on practicability — because Con's entire case rests on one empirical claim…\"\nSigns to the flow, not to itself. Caveat: the italic <em>Uniqueness/Link/Warrants/Impact</em>\nmarkers are flow-layer scaffolding — if literally spoken to a lay panel they are the exact\njargon SPEECH/STYLE forbids. They read as silent structure here, which is fine.</p>\n</blockquote>\n<h3>6. WORDING — <strong>PASS</strong></h3>\n<p>Claim-first, active, concrete subjects, filler cut, no vague intensifiers (no \"very,\"\n\"massive\"); numbers used where present.</p>\n<blockquote>\n<p>\"Congress moved from the President's request to signed law in five days — the House in a\nsingle day, before any U.S. forces were engaged.\"\nWeakness (not enough to fail the stated criterion): several impact sentences pile em-dash\nclauses and break STYLE §3's \"one idea per sentence\" — e.g. the 40-word C1 impact sentence\nabove — which would tax a lay judge on read-aloud.</p>\n</blockquote>\n<h3>7. WEIGHING — <strong>PASS</strong></h3>\n<p>Explicit comparative weighing on named mechanisms in the framework, in <em>both</em> impact rows,\nand again in the weighing block. Best-executed criterion in the case.</p>\n<blockquote>\n<p>\"A demonstrated harm outweighs a speculative one, which means you should not trade a real\nand worsening structural loss for a danger the historical record shows the system already\nabsorbs.\"\nNames the mechanism (probability), does the comparison, and repeats it in the closer\n(\"probability controls a close round\").</p>\n</blockquote>\n<h3>8. EVIDENCE DISCIPLINE — <strong>PARTIAL</strong></h3>\n<p>All four cards are real and in <code>evidence/</code>; quoted wording is <strong>verbatim-accurate</strong> to the\ncard bodies (Burns \"feeble and ineffective opposition,\" Madison \"with studied care… vested\nthe question of war in the Legislature,\" Formosa \"pre-authorization to use American forces\nabroad,\" Eisenhower \"would make clear the unified and serious intentions\"). Quals are\npresent (Prof. Burns/RIT, Eisenhower \"a five-star general,\" House Historian). No fabrication,\nno power-tagging.\n<strong>The overclaim is provenance, not wording.</strong> Two cards reach their quote through a\nsecondary source, and the case cites them as if primary:</p>\n<blockquote>\n<p>\"Eisenhower — a five-star general — sought that very resolution on the ground that 'it\nwould not be prudent to await the emergency before coming to Congress. Then it might be\ntoo late' … [Eisenhower 1955].\"\nThat quote, per its own card, comes from Gary Hess's scholarly treatment, not the primary\nCQ record — the card explicitly deducts for \"reliance on a secondary source for the most\npowerful quote.\" Likewise the Madison quote is pulled from usconstitution.net, which its\ncard says \"should be upgraded before real use,\" yet the case labels it \"[Madison,\nHelvidius]\" as though cut from the 1793 letter. An evidence judge indicts exactly this.\nVerbatim-faithful, but the citation layer smooths over provenance the cards flagged.</p>\n</blockquote>\n<h3>9. ~750 WORDS / REGISTER — <strong>PASS</strong></h3>\n<p>765 written words / ~700 spoken — on target. Register is mostly lay-clean narrative in the\nread-aloud; the true jargon (\"double-turns,\" \"inherency,\" \"solvency\") is quarantined below\nthe line in CASE STRATEGY, where it belongs.</p>\n<hr />\n<h2>Overall verdict: <strong>MOSTLY</strong></h2>\n<p>Seven of nine criteria pass cleanly, and the two that pass hardest — implication and\nweighing — are the ones amateur cases usually fail. Handing the agent these standards\n<strong>demonstrably produced a structurally compliant, warrant-first, explicitly-weighed case.</strong>\nIt falls short of a clean YES on two counts the standards did not force: impact\nquantification and citation provenance.</p>\n<p><strong>Single biggest remaining weakness:</strong> citation provenance. The case presents two\nsecondhand quotes (Eisenhower via Hess, Madison via usconstitution.net) as if drawn from\nthe primary source. Each card's own \"Vulnerable-to\" line names this flaw; the case ignores\nthe flag and cites the original as primary. This is the highest-value indict an opponent's\nevidence judge gets for free, and nothing in the writing surfaced it.</p>\n<p><strong>One concrete fix — to the STANDARDS, not the case:</strong> add a <em>provenance-honest citation</em>\nrule to EVIDENCE-STANDARD (§ \"hard rules\"): <strong>the in-case verbal citation must match the\nprovenance recorded in the card — when a quote reaches the card through a secondary source,\nthe case cites that secondary source or says \"as quoted in,\" and never attributes it to the\noriginal as if primary.</strong> Pair it with a one-line WRITING-STANDARD checklist item: \"No card\nis used in the case in a way its own Vulnerable-to line forbids.\" Today the standards\ngovern how a <em>card</em> is cut but say nothing about carrying the card's provenance caveats into\n<em>case</em> copy — which is precisely the gap this case fell through.</p>"}, {"id": "d54", "title": "Argument ledger", "group": "Topic: war-powers-congressional-approval  ·  history", "html": "<h1>Argument ledger — war-powers topic</h1>\n<p>Append-only. In-round survival and deep-clash terminal states are SEPARATE columns on\npurpose — r1 proved they diverge (an argument can win the ballot and die under\nexhaustion, and vice versa).</p>\n<table>\n<thead>\n<tr>\n<th>argument</th>\n<th>round</th>\n<th>side</th>\n<th>in-round fate</th>\n<th>RFD citations</th>\n<th>deep-clash terminal state</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>constitutional-default (Madison/Prakash originalism)</td>\n<td>r1</td>\n<td>pro</td>\n<td>won its exchange decisively (CON couldn't name a Founder) but bought no ballot</td>\n<td>lay ✓, flow (won exchange, no solvency), evidence (praised Prakash)</td>\n<td><strong>exhausted-survives</strong> — initiation core only; initiation/response boundary conceded indeterminate</td>\n</tr>\n<tr>\n<td>abdication harm / story (Burns + Libya)</td>\n<td>r1</td>\n<td>pro</td>\n<td>collapse target, carried lay</td>\n<td>lay ✓</td>\n<td>not contested-listed (unchallenged as harm)</td>\n</tr>\n<tr>\n<td>congressional-capacity (Congress CAN act ex ante)</td>\n<td>r1</td>\n<td>pro</td>\n<td>extended, contested</td>\n<td>—</td>\n<td><strong>exhausted-DIES</strong> — zero ex-ante \"go\" examples in 8 turns; Somalia conceded false. <strong>REOPENED 2026-07-18 by interlock ticket-1</strong>: Formosa Res. 1955 (5 days, 410-3/85-3, House Historian: \"pre-authorization\") + Middle East Res. 1957 — two A-grade ex-ante examples the exchange never found. Re-litigate in r2.</td>\n</tr>\n<tr>\n<td>enforcement-gap / solvency takeout</td>\n<td>r1</td>\n<td>con</td>\n<td>round-winner (both tech ballots)</td>\n<td>flow ✓, evidence ✓</td>\n<td><strong>strong form DIES</strong> in deep-clash (OSTP-China/Boland showed statutes can bind) — weaker \"usually unenforced\" survives</td>\n</tr>\n<tr>\n<td>statute-vs-Article-II (law can't repeal constitutional claim)</td>\n<td>r1</td>\n<td>con</td>\n<td>extended, contested</td>\n<td>flow ✓</td>\n<td><strong>exhausted-survives</strong></td>\n</tr>\n<tr>\n<td>speed/secrecy (executive energy)</td>\n<td>r1</td>\n<td>con</td>\n<td>deliberately collapsed away after crossfire 2</td>\n<td>none</td>\n<td>not contested (dropped)</td>\n</tr>\n<tr>\n<td>emergency-carve-out-text</td>\n<td>r1</td>\n<td>con</td>\n<td>contested at round end</td>\n<td>—</td>\n<td><strong>stalemate (PRO vulnerable)</strong> — resumed 4-turn exchange 2026-07-18; both sides static, neither exhausted; PRO's unrun avoidance-canon answer (Endo, DeBartolo) vs CON's unrun drafters-know-how-to-write-exceptions counter. First deep-clash of r2.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The headline the ledger exists to catch:</strong> CON's enforcement takeout WON the round\nand its strong form LOST the exhaustion test. Ballots measure performance; deep-clash\nmeasures truth. Prep decisions follow the deep-clash column; tournament collapses\nfollow the ballot column.</p>"}],ROUNDS=[{"winner": "CON", "score": "2-1", "votes": {"lay": "PRO", "flow": "CON", "evidence": "CON"}, "round": "r1"}, {"winner": "PRO", "score": "2-1", "votes": {"lay": "PRO", "flow": "PRO", "evidence": "CON"}, "round": "r2"}],STATS={"standards": 7, "guidelines": 18, "cards": 17, "rounds": 2, "docs": 55};
const nav=document.getElementById('nav'),view=document.getElementById('view'),q=document.getElementById('q');
function dash(){
 let t=`<a class="back" href="/debate">&larr; back to the site</a><h1>Debate System — full library</h1>
 <p style="color:var(--mut)">Everything the agents learn and follow — the standards, the agent guidelines, and every public topic's cases, evidence cards, rounds, and reflections. Live competitive prep is never here.</p>
 <div class="tiles">
  <div class="tile"><b>${STATS.standards}</b><span>standards &amp; method docs</span></div>
  <div class="tile"><b>${STATS.guidelines}</b><span>agent guideline files</span></div>
  <div class="tile"><b>${STATS.cards}</b><span>evidence cards</span></div>
  <div class="tile"><b>${STATS.rounds}</b><span>judged rounds</span></div>
 </div>`;
 if(ROUNDS.length){t+='<h2>Rounds &amp; the paradigm split</h2><div class="rounds">';
  ROUNDS.forEach(r=>{t+=`<div class="rcard"><h4>Round ${r.round.toUpperCase()} — <span class="win ${r.winner}">${r.winner} wins ${r.score}</span></h4><div class="jrow">`+
   ['lay','flow','evidence'].map(j=>{const v=(r.votes[j]||'?');return `<div class="jcell ${v}"><span>${j}</span><span class="v">${v}</span></div>`}).join('')+'</div></div>'});
  t+='</div><p style="color:var(--mut);font-size:13px">Read across the rows: each round the panel splits by judge type — the same argument wins one judge and loses another. That split, repeated across rounds, is the system’s core finding.</p>'}
 view.innerHTML=t;window.scrollTo(0,0);
}
function show(id){const d=DOCS.find(x=>x.id===id);if(!d)return;document.querySelectorAll('a.item').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
 view.innerHTML='<a class="back" onclick="dash();return false" href="#">&larr; dashboard</a><div id="doc">'+d.html+'</div>';window.scrollTo(0,0);}
window.dash=dash;
function buildNav(filter){nav.innerHTML='';const groups={};DOCS.forEach(d=>{if(filter&&!(d.title+d.group).toLowerCase().includes(filter))return;(groups[d.group]=groups[d.group]||[]).push(d)});
 const home=document.createElement('a');home.className='item';home.textContent='⌂ Dashboard';home.onclick=dash;nav.appendChild(home);
 for(const g in groups){const h=document.createElement('div');h.className='grp';h.textContent=g;nav.appendChild(h);
  groups[g].forEach(d=>{const a=document.createElement('a');a.className='item';a.dataset.id=d.id;a.textContent=d.title;a.onclick=()=>show(d.id);nav.appendChild(a)})}}
q.oninput=()=>buildNav(q.value.trim().toLowerCase());
buildNav('');dash();
</script></body></html>
