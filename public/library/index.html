m>energy in office</em>, not war initiation.</strong> Hamilton\n  elsewhere (Fed. 69) explicitly says the president is NOT a monarch and lacks the\n  power to declare war. Pro can turn the Federalist against this card.\n- <strong>\"Emergency\" is doing unstated work.</strong> The card justifies speed in a true attack;\n  the resolution's carve-outs for actual emergencies are a Pro answer that this card\n  does not address.</p>"}, {"id": "d31", "title": "Card: con-inherency-govfacts-2026", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>claim: Presidents already circumvent and ignore statutory limits on war-making, so eliminating the authority on paper does not change behavior.\nside: con\nstrength: B\naccessed: 2026-07-17</p>\n<hr />\n<p><strong>GovFacts 2026</strong> — GovFacts, \"How the War Powers Resolution Works—And Why It Rarely\nStops Presidents\" (accessed 2026-07-17).\nhttps://govfacts.org/policy-security/military/war-powers/how-the-war-powers-resolution-works-and-why-it-rarely-stops-presidents/</p>\n<blockquote>\n<p>\"Presidents have consistently circumvented or ignored the War Powers Resolution's\nprovisions through various mechanisms—redefining operations to avoid triggering the\nresolution's requirements, relying on alternative legal authorities, or simply\nignoring congressional demands.\"</p>\n</blockquote>\n<p><strong>Warrant:</strong> This is the Con <strong>inherency / solvency takeout</strong>. The 1973 War Powers\nResolution already tried to require congressional involvement, and presidents route\naround it — redefining \"hostilities,\" invoking Article II, or ignoring Congress\noutright. A resolution that \"eliminates the authority\" runs into the same wall: the\nauthority presidents actually use is claimed as constitutional, and a statute cannot\nrepeal a constitutional claim. Pro wins the harm and still loses on solvency.</p>\n<p><strong>Vulnerable to:</strong>\n- <strong>Source quality is the weak point.</strong> GovFacts is a general explainer site, not a\n  named scholar or a government/CRS document. Grade B and shop for a stronger version —\n  a CRS report or a law-review piece says the same thing with more weight.\n- <strong>Proves too much.</strong> If no law can bind the president, that's an argument against\n  <em>any</em> war-powers reform, which a judge may read as nihilistic rather than responsive.\n  Con should cabin it: <em>this</em> resolution doesn't solve, not \"nothing ever could.\"\n- <strong>Pro's turn is available.</strong> \"Presidents ignore it\" can flip to \"then codify a\n  clearer default so ignoring it carries a real legal and political cost.\" The card\n  describes circumvention of a <em>weak</em> statute; Pro argues the resolution is stronger.\n- <strong>Description, not causation.</strong> Says presidents circumvent; doesn't prove the\n  resolution specifically would be circumvented. The link to <em>this</em> mechanism is\n  inferential.</p>"}, {"id": "d32", "title": "Card: pro-congress-abdication-burns-2026", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>claim: Congress has abdicated its war-powers role, letting presidents wage prolonged hostilities on outdated authorizations with no effective check.\nside: pro\nstrength: A\naccessed: 2026-07-17</p>\n<hr />\n<p><strong>Burns 2026</strong> — Sarah Burns, Associate Professor of Political Science, Rochester\nInstitute of Technology, \"Congress once fought to limit a president's war powers —\nmore than 50 years later, its successors are less willing to assert their authority\",\n<em>The Conversation</em>, March 4, 2026 (updated March 5, 2026).\nhttps://theconversation.com/congress-once-fought-to-limit-a-presidents-war-powers-more-than-50-years-later-its-successors-are-less-willing-to-assert-their-authority-277435</p>\n<blockquote>\n<p>\"Congress has for the most part registered only feeble and ineffective opposition to\nsuch executive action.\"</p>\n</blockquote>\n<p><strong>Warrant:</strong> A political-science scholar documents that the status quo is not a\nfunctioning balance — it is congressional surrender. Presidents of both parties stretch\n2001–2002 authorizations far past their original scope while Congress mounts no\neffective resistance. This is Pro's <em>harm</em> card: the squo is unchecked executive war,\nand it names the mechanism (abdication), not just the vibe.</p>\n<p><strong>Vulnerable to:</strong>\n- <strong>Cuts toward inherency, which is Con ground.</strong> If Congress is <em>already unwilling</em> to\n  assert itself, why would eliminating the president's authority on paper change\n  anything? The same abdication that is Pro's harm is Con's \"resolution doesn't solve.\"\n  This card and the Con govfacts card describe the same fact from opposite directions —\n  whoever frames it better wins it.\n- <strong>Op-ed format.</strong> <em>The Conversation</em> is scholar-written but editorial, not\n  peer-reviewed. Strong author credential carries it, but it's argument, not study.\n- <strong>\"Feeble opposition\" is about will, not authority.</strong> Con: the problem is political\n  will, and a statute can't manufacture will. Pro must show the resolution changes the\n  default rule such that inaction favors restraint rather than deployment.\n- No quantification of the harm — how many deployments, what scale. The card asserts a\n  pattern; a skeptical judge may want the count.</p>"}, {"id": "d33", "title": "Card: pro-original-design-madison", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>claim: The Constitution deliberately vested the power to initiate war in Congress, not the President — congressional approval is the intended default, not a modern constraint.\nside: pro\nstrength: B\naccessed: 2026-07-17</p>\n<hr />\n<p><strong>Madison</strong> — James Madison, \"Letters of Helvidius\" (1793), as quoted by\nusconstitution.net, \"What Happens if Congress and the President Disagree on War?\"\n(accessed 2026-07-17). https://usconstitution.net/war-powers-disputes/</p>\n<blockquote>\n<p>\"The constitution supposes, what the History of all Governments demonstrates, that\nthe Executive is the branch of power most interested in war, and most prone to it.\nIt has accordingly with studied care, vested the question of war in the Legislature.\"</p>\n</blockquote>\n<p>Supporting, same source on Article I:</p>\n<blockquote>\n<p>\"Congress has the power to declare war, as stated in Article I, Section 8.\"</p>\n</blockquote>\n<p><strong>Warrant:</strong> The framers didn't accidentally leave war power with Congress — Madison\nsays they did it \"with studied care,\" precisely <em>because</em> executives are the branch\n\"most prone\" to war. The resolution doesn't restrict the presidency; it restores the\nconstitutional default. That reframes Pro from \"new limit\" to \"originalist correction,\"\nwhich is a much easier sell.</p>\n<p><strong>Vulnerable to:</strong>\n- <strong>\"Declare war\" ≠ \"deploy forces.\"</strong> The strongest Con answer: Article I gives\n  Congress the power to <em>declare</em> war, but modern deployments (strikes, raids, limited\n  operations) are not \"wars\" in the declared sense. Madison's quote doesn't close that\n  gap, and the resolution's word is \"deploy,\" not \"declare.\"\n- <strong>Quoted secondhand.</strong> Pulled from usconstitution.net, not the primary Helvidius\n  text. Defensible as a famous quote, but a card cut from the original letter is\n  stronger and this should be upgraded before real use.\n- <strong>Originalism cuts both ways.</strong> Hamilton (Federalist 70, see the Con Yoo card)\n  argued for executive energy. A judge can treat dueling founders as a wash.\n- <strong>1793 vs. 2026.</strong> \"The framers intended\" is an is-ought move a practical judge may\n  discount against modern security realities. Pairs better with a consequences card\n  than standing alone.</p>"}, {"id": "d34", "title": "Card: r2-avoidance-canon-debartolo", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>topic: war-powers-congressional-approval\nside: PRO (burden-shift on emergency carve-out via constitutional avoidance)\ncard: r2-avoidance-canon-debartolo\nsource: Edward J. DeBartolo Corp. v. Florida Gulf Coast Building &amp; Construction Trades Council, 485 U.S. 568 (1988)\nauthor: Justice White, for the Court (6-0; O'Connor &amp; Scalia concurring in judgment; Kennedy not participating)\nfetch: https://www.law.cornell.edu/supremecourt/text/485/568\ndate_fetched: 2025-07-16</p>\n<hr />\n<h2>VERBATIM QUOTES</h2>\n<p><strong>The Canon Stated:</strong></p>\n<p>\"Another rule of statutory construction, however, is pertinent here: where an otherwise acceptable construction of a statute would raise serious constitutional problems, the Court will construe the statute to avoid such problems unless such construction is plainly contrary to the intent of Congress. Catholic Bishop, supra, 440 U.S., at 499-501, 504. This cardinal principle has its roots in Chief Justice Marshall's opinion for the Court in Murray v. The Charming Betsy, 2 Cranch 64, 118 (1804), and has for so long been applied by this Court that it is beyond debate. E.g., Catholic Bishop, supra, 440 U.S., at 500-501; Machinists v. Street, 367 U.S. 740, 749-750 (1961); Crowell v. Benson, 285 U.S. 22, 62 (1932); Lucas v. Alexander, 279 U.S. 573, 577 (1929); Panama R. Co. v. Johnson, 264 U.S. 375, 390 (1924); United States ex rel. Attorney General v. Delaware &amp; Hudson Co., 213 U.S. 366, 407-408 (1909); Parsons v. Bedford, 3 Pet. 433, 448-449 (1830) (Story, J.). As was stated in Hooper v. California, 155 U.S. 648, 657 (1895), '[t]he elementary rule is that every reasonable construction must be resorted to, in order to save a statute from unconstitutionality.'\"</p>\n<p><strong>The Rationale — Congress Is Presumed to Respect the Constitution:</strong></p>\n<p>\"This approach not only reflects the prudential concern that constitutional issues not be needlessly confronted, but also recognizes that Congress, like this Court, is bound by and swears an oath to uphold the Constitution. The courts will therefore not lightly assume that Congress intended to infringe constitutionally protected liberties or usurp power constitutionally forbidden it. See Grenada County Supervisors v. Brogden, 112 U.S. 261, 269 (1884).\"</p>\n<p><strong>Deference Displaced When Constitutional Questions Loom:</strong></p>\n<p>\"Even if this construction of the Act were thought to be a permissible one, we are quite sure that in light of the traditional rule followed in Catholic Bishop, we must independently inquire whether there is another interpretation, not raising these serious constitutional concerns, that may fairly be ascribed to § 8(b)(4)(ii)(B).\"</p>\n<hr />\n<h2>APPLICATION TO WAR POWERS DEBATE</h2>\n<p>The constitutional-avoidance canon operates as a doctrinal burden-shift. Under ordinary Chevron or NLRA deference, an agency's interpretation prevails if reasonable. But DeBartolo teaches that when a statute \"touches\" on constitutional prerogatives—here the President's war power versus Congress's Article I power to declare war—the court must <strong>independently</strong> search for a narrowing construction that avoids the constitutional question. The PRO side argues: Congress enacted the War Powers Resolution against the backdrop of this canon. Statutes granting the President emergency military authority (e.g., the AUMF, the WPR's 60-day clock) must be read to accommodate the \"greatest possible\" constitutional role for Congress. If a broad presidential-emergency reading would raise serious separation-of-powers problems (by reading Congress out of warmaking), the avoidance canon requires courts to adopt a narrower reading—one that preserves a meaningful congressional check. The canon thus shifts the interpretive burden to those arguing that emergency exceptions swallow the rule of congressional approval.</p>\n<hr />\n<h2>VULNERABLE TO</h2>\n<ol>\n<li>\n<p><strong>\"Serious constitutional problems\" threshold is not met.</strong> DeBartolo requires \"serious\" constitutional doubts. A textualist might argue that the President's Article II Commander-in-Chief power plus historical practice make the emergency-authority reading constitutionally uncontroversial—so the canon never triggers.</p>\n</li>\n<li>\n<p><strong>Canon yields to clear congressional intent.</strong> DeBartolo itself says the canon applies \"unless such construction is plainly contrary to the intent of Congress.\" If statutory text or legislative history clearly delegates emergency discretion to the President, the canon gives way.</p>\n</li>\n<li>\n<p><strong>DeBartolo is a First Amendment case, not a separation-of-powers case.</strong> The canon's application in individual-rights contexts (free speech, due process) is far more established than in inter-branch disputes. Some judges and scholars argue the canon should not be used to resolve structural constitutional questions between the political branches.</p>\n</li>\n</ol>\n<hr />\n<h2>GRADE</h2>\n<p><strong>A−</strong> — The opinion is a canonical (no pun intended) Supreme Court holding, unanimous in result, written by Justice White for six Justices. The statement of the rule is among the clearest in the U.S. Reports. The vulnerability is that the case arises in a statutory-labor/First Amendment context rather than a war-powers/separation-of-powers context, and the \"serious constitutional problems\" trigger requires an antecedent showing that a broad reading of the President's emergency power would genuinely threaten the constitutional order—a contestable premise.</p>"}, {"id": "d35", "title": "Card: r2-avoidance-canon-endo", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<hr />\n<p>topic: war-powers-congressional-approval\nside: PRO (burden-shift on emergency carve-out via constitutional avoidance)\ncard: r2-avoidance-canon-endo\nsource: Ex parte Endo, 323 U.S. 283 (1944)\nauthor: Justice Douglas, for a unanimous Court\nfetch: https://caselaw.findlaw.com/court/us-supreme-court/323/283.html (confirmed against https://www.law.cornell.edu/supremecourt/text/323/283)\ndate_fetched: 2025-07-16</p>\n<hr />\n<h2>VERBATIM QUOTES</h2>\n<p><strong>The Interpretive Approach — Narrow Construction of Wartime Grants of Power:</strong></p>\n<p>\"We mention these constitutional provisions not to stir the constitutional issues which have been argued at the bar but to indicate the approach which we think should be made to an Act of Congress or an order of the Chief Executive that touches the sensitive area of rights specifically guaranteed by the Constitution. This Court has quite consistently given a narrower scope for the operation of the presumption of constitutionality when legislation appeared on its face to violate a specific prohibition of the Constitution. We have likewise favored that interpretation of legislation which gives it the greater chance of surviving the test of constitutionality. Those analogies are suggestive here. We must assume that the Chief Executive and members of Congress, as well as the courts, are sensitive to and respectful of the liberties of the citizen. In interpreting a war-time measure we must assume that their purpose was to allow for the greatest possible accommodation between those liberties and the exigencies of war. We must assume, when asked to find implied powers in a grant of legislative or executive authority, that the law makers intended to place no greater restraint on the citizen than was clearly and unmistakably indicated by the language they used.\"</p>\n<p><strong>No Implied Power Beyond Statutory Purpose:</strong></p>\n<p>\"The purpose and objective of the Act and of these orders are plain. Their single aim was the protection of the war effort against espionage and sabotage.\"</p>\n<p>\"A citizen who is concededly loyal presents no problem of espionage or sabotage. Loyalty is a matter of the heart and mind, not of race, creed, or color. He who is loyal is by definition not a spy or a saboteur. When the power to detain is derived from the power to protect the war effort against espionage and sabotage, detention which has no relationship to that objective is unauthorized.\"</p>\n<p><strong>Constitutional Avoidance Over Deciding the Underlying Question:</strong></p>\n<p>\"First. We are of the view that Mitsuye Endo should be given her liberty. In reaching that conclusion we do not come to the underlying constitutional issues which have been argued. For we conclude that, whatever power the War Relocation Authority may have to detain other classes of citizens, it has no authority to subject citizens who are concededly loyal to its leave procedure.\"</p>\n<p><strong>Syllabus Holdings (authoritative headnotes):</strong></p>\n<p>\"Wartime measures are to be interpreted as intending the greatest possible accommodation between the Constitutional liberties of the citizen and the exigencies of war.\"</p>\n<p>\"Power to detain a concededly loyal citizen may not be implied from the power to protect the war effort against espionage and sabotage.\"</p>\n<p>\"The power to detain a concededly loyal citizen or to grant him a conditional release cannot be implied as a useful or convenient step in the evacuation program.\"</p>\n<hr />\n<h2>APPLICATION TO WAR POWERS DEBATE</h2>\n<p>Endo is the Supreme Court's most direct application of the constitutional-avoidance principle to wartime executive power. The Court explicitly declined to reach the constitutional question (whether detention of a loyal citizen violates the Fifth Amendment) and instead resolved the case through statutory construction—reading the executive orders and ratifying statute narrowly against their stated purpose (espionage/sabotage prevention). For the war-powers debate, Endo stands for the proposition that <strong>courts will not imply broad emergency powers into ambiguous statutory grants touching constitutional liberties or structural commitments.</strong> Just as the War Relocation Authority could not imply a detention power beyond the \"single aim\" of the statute, the President cannot imply an open-ended emergency-war power from ambiguous AUMF or WPR language that would swallow Congress's Article I war-declaration role. Endo's rule—that implied powers in wartime grants must be limited to what is \"clearly and unmistakably indicated\"—shifts the interpretive burden: the executive bears the burden of showing clear textual authorization, not merely plausible or convenient implication.</p>\n<hr />\n<h2>VULNERABLE TO</h2>\n<ol>\n<li>\n<p><strong>Endo is a civil-liberties case, not a separation-of-powers case.</strong> The Court's solicitude flowed from the Fifth Amendment's Due Process Clause and the Suspension Clause—individual rights provisions—not from Article I structural commitments. The \"greatest possible accommodation\" language speaks to \"Constitutional liberties of the citizen,\" not the institutional prerogatives of Congress. Extending Endo to inter-branch disputes requires an analogy the Court itself has not clearly drawn.</p>\n</li>\n<li>\n<p><strong>Endo involved a concededly loyal citizen—the emergency case is different.</strong> Endo turned on the fact that the government conceded loyalty; the Court expressly reserved the question of what detention powers exist where disloyalty is alleged. By analogy, a genuine emergency (imminent attack) is the war-powers equivalent of \"disloyalty\"—it is precisely the case where the Court has not constrained the executive.</p>\n</li>\n<li>\n<p><strong>Endo is a 1944 case; modern war-powers doctrine has moved on.</strong> Post-9/11 jurisprudence (Hamdi v. Rumsfeld, Hamdan v. Rumsfeld) shows the Court is willing to reach constitutional questions in wartime rather than avoid them, and the \"clear statement\" rule Endo deployed has been unevenly applied in national-security cases. The Court in Hamdi, 542 U.S. 507, did not use constitutional avoidance to read the AUMF narrowly; it found detention authority but imposed due-process limits.</p>\n</li>\n</ol>\n<hr />\n<h2>GRADE</h2>\n<p><strong>A</strong> — Unanimous Supreme Court precedent; Justice Douglas writing for the full Court; directly addresses the methodology of construing wartime executive power to avoid constitutional collision. The syllabus holdings are crisp and on point. The vulnerability is real but not fatal: Endo remains good law and its \"clearly and unmistakably indicated\" standard for implied wartime powers has never been overruled. Its extension to structural separation-of-powers rather than individual rights is a fair debate move but not compelled by the holding itself.</p>"}, {"id": "d36", "title": "Card: ticket-1-formosa-mideast-card1-formosa", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card 1: The Formosa Resolution (1955) — Ex-Ante Congressional Authorization of Force</h1>\n<h2>Source</h2>\n<p><strong>Author:</strong> U.S. House of Representatives, Office of the Historian\n<strong>Publication:</strong> \"The House Approval of the Formosa Resolution,\" Historical Highlights, History, Art &amp; Archives, U.S. House of Representatives\n<strong>Date:</strong> Published online; resolution signed January 29, 1955\n<strong>URL:</strong> https://history.house.gov/HistoricalHighlight/Detail/35781</p>\n<h2>Verbatim Quote</h2>\n<p>\"The House approved 409 to 3 a resolution requested by President Dwight D. Eisenhower to authorize the president to defend Formosa (Taiwan) and the Pescadores Islands 'as he deems necessary.' Passage of the resolution was precipitated in the fall of 1954 when Chinese Communist forces shelled Nationalist Chinese garrisons on the small islands of Quemoy and Matsu off the Chinese coast. The Senate approved the measure three days after the House, and it became law on the 29th of January. <strong>The Formosa Resolution revived the practice, dating to the 1790s, whereby Congress occasionally granted presidents pre-authorization to use American forces abroad.</strong>\"</p>\n<h2>Key Analytical Points</h2>\n<ul>\n<li><strong>Timing:</strong> Eisenhower requested authorization on January 24, 1955. The House voted 410-3 on January 25 (one day). The Senate voted 85-3 on January 28 (three days of debate). Signed into law January 29. <strong>Total: 5 days from request to law.</strong></li>\n<li><strong>Ex Ante:</strong> The authorization was passed <em>before</em> any direct U.S. military engagement. Communist China had shelled Nationalist-held offshore islands, but no U.S. forces were yet engaged in combat. Eisenhower explicitly framed this as a <em>deterrent</em> measure: passing it before hostilities would prevent war.</li>\n<li><strong>Content:</strong> The resolution authorized the President \"to employ the Armed Forces of the United States as he deems necessary for the specific purpose of securing and protecting Formosa and the Pescadores against armed attack, this authority to include the securing and protection of such related positions and territories of that area now in friendly hands.\"</li>\n<li><strong>The House Historian explicitly characterizes this as \"pre-authorization\"</strong> — Congress acting before the fact, not ratifying after.</li>\n</ul>\n<h2>Vulnerable To</h2>\n<ul>\n<li>The resolution was open-ended: no expiration date, no geographic limit on \"related positions,\" effectively a blank check. CON can argue this is <em>delegation</em>, not responsible authorization.</li>\n<li>The shelling of Quemoy/Matsu had already begun (September 1954), so it wasn't purely <em>ex ante</em> with respect to crisis conditions — though no U.S. combat was underway.</li>\n<li>The resolution was later repealed (1974) and the State Department by 1971 had disclaimed it as authority.</li>\n</ul>\n<h2>Grade: A</h2>\n<p>Primary source (official House historian), specific dates, vote counts, clear characterization of the resolution as \"pre-authorization.\" Verbatim quote directly on point.</p>"}, {"id": "d37", "title": "Card: ticket-1-formosa-mideast-card2-eisenhower-rationale", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card 2: Eisenhower's Own Rationale — Congress Must Act BEFORE the Emergency</h1>\n<h2>Source</h2>\n<p><strong>Author:</strong> President Dwight D. Eisenhower\n<strong>Publication:</strong> Special Message to Congress, January 24, 1955; published in Congressional Quarterly Almanac 1955, pp. 277-280; also in Public Papers of the Presidents\n<strong>Date:</strong> January 24, 1955\n<strong>URL (CQ text via scanned archive):</strong> https://www.govinfo.gov/content/pkg/GPO-CRECB-1955-pt1/pdf/GPO-CRECB-1955-pt1-14.pdf (see also CQ Weekly Report, week ending Jan. 28, 1955)</p>\n<h2>Verbatim Quote</h2>\n<p>From the Congressional Quarterly Weekly Report (week ending Jan. 28, 1955, p. 101), quoting Eisenhower's January 24 message:</p>\n<blockquote>\n<p>\"Authority for some of the actions is inherent in his power, Mr. Eisenhower said, but a Congressional resolution 'would clearly and publicly' grant permission and 'would make clear the unified and serious intentions' of the U.S.\"</p>\n</blockquote>\n<p>And from the text of Eisenhower's message as printed in CQ (p. 101):</p>\n<blockquote>\n<p>\"The situation has become sufficiently critical to impel me... to ask the Congress to participate now, by specific resolution, in measures designed to improve the prospects for peace. These measures would contemplate the use of the armed forces of the United States if necessary to assure the security of Formosa and the Pescadores.\"</p>\n</blockquote>\n<p>And the critical ex-ante rationale (from scholarly treatment of the message in Gary R. Hess, \"Presidents and Congressional War Resolutions,\" in <em>Divided Power: The Presidency, Congress, and the Formation of American Foreign Policy</em>, citing the original message):</p>\n<blockquote>\n<p>\"The United States must remove any doubt regarding our readiness to fight ... To make this plain requires not only Presidential action but also Congressional action. <strong>In a situation such as now confronts us, and under modern conditions of warfare, it would not be prudent to await the emergency before coming to Congress. Then it might be too late. Already the warning signals are flying.</strong>\"</p>\n</blockquote>\n<h2>Key Analytical Points</h2>\n<ul>\n<li>Eisenhower explicitly argued that waiting until an attack actually occurred would be <em>too late</em> — the whole point was to act <em>before</em> the shooting started.</li>\n<li>He conceded he had <em>inherent</em> authority but sought Congress's <em>ex-ante</em> endorsement to signal national unity and strengthen deterrence.</li>\n<li>This directly refutes the claim that Congress cannot or should not act ex ante. Eisenhower — a five-star general who understood military necessity — insisted that ex-ante congressional authorization was <em>essential precisely because</em> modern war left no time for deliberation after an attack.</li>\n</ul>\n<h2>Vulnerable To</h2>\n<ul>\n<li>Eisenhower also said he had \"inherent\" authority and would act without Congress if necessary — CON can argue this shows the resolution was symbolic/political rather than constitutionally required.</li>\n<li>The Middle East Resolution two years later was amended by the Senate to remove the word \"authorize,\" suggesting Congress itself had second thoughts about the Formosa precedent.</li>\n</ul>\n<h2>Grade: A-</h2>\n<p>Eisenhower's message is the primary source for the ex-ante rationale. The last quote is from a secondary scholarly treatment (Hess) but it faithfully reproduces Eisenhower's message text. The first two quotes are directly from the CQ record. Slight deduction for reliance on a secondary source for the most powerful quote — but the CQ text independently confirms the ex-ante framing.</p>"}, {"id": "d38", "title": "Card: ticket-1-formosa-mideast-card3-mideast", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card 3: The Middle East Resolution (1957) — Ex-Ante Regional Force Authorization</h1>\n<h2>Source</h2>\n<p><strong>Author:</strong> Matthew Waxman, Professor of Law, Columbia Law School; Chair, National Security Law Program; former senior official at State Department, Defense Department, and National Security Council\n<strong>Publication:</strong> \"Remembering Eisenhower's Middle East Force Resolution,\" <em>Lawfare</em>, March 9, 2019\n<strong>URL:</strong> https://www.lawfaremedia.org/article/remembering-eisenhowers-middle-east-force-resolution</p>\n<h2>Verbatim Quotes</h2>\n<blockquote>\n<p>\"On this date in 1957, President Eisenhower signed into law perhaps the most open-ended force resolution in American history.\"</p>\n<p>\"In an address to Congress on Jan. 5, 1957, Eisenhower requested congressional support for a program of military and economic aid for Middle East nations, anticipating the possibility of communist aggression. He also sought authorization to use military force to protect such nations. The 'Eisenhower Doctrine' would thus combine largesse with threats of armed intervention.\"</p>\n<p>\"Two months later, Congress passed legislation that authorized the military and economic aid. As to the requested force authorization, Congress included the following provision: [T]he United States regards as vital to the national interest and world peace the preservation of the independence and integrity of the nations of the Middle East. To this end, if the President determines the necessity thereof, the United States is prepared to use armed forces to assist any such nation or group of such nations requesting assistance against armed aggression from any country controlled by international communism.\"</p>\n</blockquote>\n<p>On Eisenhower's ex-ante deterrence logic:</p>\n<blockquote>\n<p>\"In a four-hour White House meeting with congressional leadership on Jan. 1, 1957, the president emphasized that a force resolution would bolster deterrence and help reassure allies: [Eisenhower] added that should there be a Soviet attack in that area he could see no alternative but that the United States move in immediately to stop it—other than suffering loss of that area to Russia. Loss of the area would be disastrous to Europe because of its oil requirements. He cited his belief that the United States must put the entire world on notice that we are ready to move instantly if necessary. He reaffirmed his regard for constitutional procedures but pointed out that modern war might be a matter of hours only. <strong>The President believed that if the Administration had that kind of authority it might never have to be used.</strong>\"</p>\n</blockquote>\n<p>And on the ex-ante purpose per Secretary Dulles:</p>\n<blockquote>\n<p>\"You may say, 'Why don't we wait until the attack occurs?' Why, then it is too late. The whole purpose of this thing is to be a deterrent, a preventive to war.\"</p>\n</blockquote>\n<h2>Key Analytical Points</h2>\n<ul>\n<li><strong>Timing:</strong> Eisenhower requested authorization January 5, 1957. House passed original version January 30 (355-61). Senate committees amended it (changing \"authorizes\" to \"is prepared\"), Senate passed March 5 (72-19). House concurred in Senate version March 7 (350-60). Signed March 9, 1957. <strong>Total: approximately 9 weeks.</strong></li>\n<li><strong>Ex Ante:</strong> No armed conflict was underway in the Middle East involving U.S. forces. The Suez Crisis had ended. This was purely a forward-looking, deterrent resolution — designed to prevent Soviet aggression, not to authorize ongoing operations.</li>\n<li><strong>The Senate changed \"authorizes\" to \"is prepared to use\" but Waxman (and the Eisenhower administration) viewed this as having the same practical effect.</strong> Dulles and Eisenhower both stated the modified language still gave them what they needed.</li>\n<li><strong>The Middle East resolution remains on the books today</strong> — it was never repealed (unlike the Formosa Resolution), making it a live precedent.</li>\n</ul>\n<h2>Vulnerable To</h2>\n<ul>\n<li>The Senate's deliberate removal of \"authorize\" and substitution of \"is prepared\" can be read as Congress <em>rejecting</em> the Formosa model of explicit ex-ante authorization. Senator Mike Mansfield argued the Formosa/Middle East resolutions were constitutionally dangerous precedents and that the President already had inherent authority — making congressional authorization unnecessary.</li>\n<li>When Eisenhower later sent troops to Lebanon (1958), he did NOT cite the Middle East Resolution as authority — he acted unilaterally, undermining the argument that the resolution was a meaningful ex-ante constraint.</li>\n<li>The resolution was region-wide and open-ended, more of a policy declaration than a specific authorization for particular military operations.</li>\n</ul>\n<h2>Grade: A</h2>\n<p>Waxman is a leading national security law scholar at Columbia Law School, former NSC/State/Defense official. The article is published on Lawfare, the premier national security law platform. Direct quotes from primary sources (Eisenhower, Dulles). Dates and vote counts are verifiable from multiple sources.</p>"}, {"id": "d39", "title": "Card: ticket-1-formosa-mideast-card4-precedent-chain", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card 4: The Formosa Resolution as the Template for Subsequent Ex-Ante Authorizations — LBJ's Team Explicitly Followed It</h1>\n<h2>Source</h2>\n<p><strong>Author:</strong> Congressional Research Service (CRS)\n<strong>Publication:</strong> \"Declarations of War and Authorizations for the Use of Military Force: Historical Background and Legal Implications,\" CRS Report RL31526 (updated), citing internal Johnson administration documents\n<strong>Date:</strong> Report updated August 2, 2002 (original research earlier)\n<strong>URL:</strong> https://www.everycrsreport.com/files/20020802_RL31526_7304ee4cef2113d788de0342b102ed2622715459.pdf (p. 11)</p>\n<h2>Verbatim Quote</h2>\n<blockquote>\n<p>\"Even this early in the Johnson administration,\" Rostow said subsequently, \"word had gotten back to the bureaucracy that Johnson disapproved of Truman's failure to seek a congressional resolution in the Korean War. <strong>We understood that, should the occasion arise, he intended to be governed by Eisenhower's precedent in the Formosa and Middle East resolutions, where broad congressional support was sought before policies that might lead to military confrontations were carried out.</strong>\"</p>\n</blockquote>\n<h2>Key Analytical Points</h2>\n<ul>\n<li>This is a CRS report — the gold standard for congressional research — documenting that <strong>the Eisenhower resolutions were understood inside the executive branch as the governing precedent for how a president should seek ex-ante authorization.</strong></li>\n<li>LBJ's team explicitly contrasted Eisenhower's approach (seek Congress BEFORE action) with Truman's approach (act unilaterally in Korea, seek approval after). They chose Eisenhower's model.</li>\n<li>This led directly to the Gulf of Tonkin Resolution (1964), which the CRS notes was consciously modeled on the Formosa and Middle East resolutions.</li>\n<li>The quote is from Walt Rostow, Johnson's National Security Advisor — the most senior foreign policy staff position. It reflects how the national security apparatus <em>at the highest level</em> understood the constitutional practice.</li>\n</ul>\n<h2>Vulnerable To</h2>\n<ul>\n<li>The Gulf of Tonkin Resolution, which this precedent enabled, became the most notorious \"blank check\" in American history — CON can argue the Formosa precedent led to the Vietnam disaster.</li>\n<li>The fact that LBJ \"intended to be governed by\" the precedent doesn't mean it was <em>constitutionally required</em> — it may only reflect political prudence.</li>\n<li>The executive branch's <em>internal</em> understanding of precedent doesn't bind Congress's constitutional role.</li>\n</ul>\n<h2>Grade: A</h2>\n<p>CRS is an authoritative, nonpartisan congressional source. Direct quote from a named senior official (Rostow). The report ties Formosa → Middle East → Tonkin Gulf as a chain of ex-ante authorization precedents.</p>"}, {"id": "d40", "title": "Card: ticket-1-formosa-mideast-summary", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Ticket 1 Summary: Formosa Resolution (1955) and Middle East Resolution (1957) as Ex-Ante Congressional Authorizations</h1>\n<h2>What I Found</h2>\n<p><strong>Both resolutions were genuine ex-ante congressional authorizations of military force, passed BEFORE any U.S. combat action.</strong> The evidence is strong and well-documented across primary and secondary sources:</p>\n<h3>Formosa Resolution (1955)</h3>\n<ul>\n<li><strong>Speed:</strong> 5 days from Eisenhower's request (Jan 24) to signing (Jan 29). House: 1 day (410-3). Senate: 3 days debate (85-3).</li>\n<li><strong>What it authorized:</strong> The President \"to employ the Armed Forces of the United States as he deems necessary for the specific purpose of securing and protecting Formosa and the Pescadores against armed attack, this authority to include the securing and protection of such related positions and territories of that area now in friendly hands.\"</li>\n<li><strong>Ex-ante character:</strong> Communist China had shelled offshore islands and captured the Tachen group's Yijiangshan island, but no U.S. forces were engaged in combat. The resolution was explicitly designed as a <em>deterrent</em> — Eisenhower's message said \"it would not be prudent to await the emergency before coming to Congress. Then it might be too late.\"</li>\n<li><strong>The House Historian</strong> explicitly characterizes it as \"pre-authorization to use American forces abroad.\"</li>\n</ul>\n<h3>Middle East Resolution (1957) / Eisenhower Doctrine</h3>\n<ul>\n<li><strong>Speed:</strong> 9 weeks from request (Jan 5) to signing (Mar 9). House: 355-61 (Jan 30). Senate: 72-19 (Mar 5, after extensive hearings and amendment). House concurrence in Senate version: 350-60 (Mar 7).</li>\n<li><strong>What it authorized:</strong> \"If the President determines the necessity thereof, the United States is prepared to use armed forces to assist any such nation or group of such nations requesting assistance against armed aggression from any country controlled by international communism.\"</li>\n<li><strong>Ex-ante character:</strong> No armed conflict was underway anywhere in the Middle East involving U.S. forces. The Suez Crisis had concluded. This was purely forward-looking — a regional deterrent against Soviet aggression.</li>\n<li><strong>The Senate amended</strong> the language from \"authorizes\" to \"is prepared to use\" — a significant constitutional wrangle. But the Eisenhower administration and many scholars treat it as functionally equivalent to an authorization.</li>\n</ul>\n<h3>The Precedent Chain</h3>\n<ul>\n<li>CRS documentation confirms that LBJ's national security team explicitly followed Eisenhower's Formosa/Middle East precedent when seeking the Gulf of Tonkin Resolution — understanding these as the model for seeking congressional support BEFORE military confrontations.</li>\n<li>Senator Mike Mansfield (1957 floor debate) identified the Formosa Resolution and the Middle East Resolution as \"the only cases in which a President has asked Congress in this fashion for authority to employ the Armed Forces prior to a declaration of war\" in nearly 170 years of constitutional practice.</li>\n</ul>\n<h2>What I Could NOT Verify / Negative Findings</h2>\n<ol>\n<li>\n<p><strong>Neither resolution was actually invoked to start a war.</strong> The Formosa Resolution served as a deterrent — the PRC backed down at Bandung. The Middle East Resolution: when Eisenhower sent troops to Lebanon in 1958, he pointedly did NOT cite it, acting on inherent authority instead. CON can argue these were signaling exercises, not genuine constitutional constraints.</p>\n</li>\n<li>\n<p><strong>The Senate's amendment of the Middle East Resolution is a double-edged sword.</strong> Changing \"authorizes\" to \"is prepared\" can be read as Congress rejecting the ex-ante authorization model — arguing that the President already has constitutional authority and Congress should not create precedents that weaken the presidency. This is arguably what Senator Mansfield was doing.</p>\n</li>\n<li>\n<p><strong>The Formosa Resolution was later repudiated.</strong> It was repealed in 1974. By 1971, the State Department had disclaimed it as legal authority. The Senate Foreign Relations Committee report on its repeal called it part of a pattern where \"Congress delegated to the President its own war power.\"</p>\n</li>\n<li>\n<p><strong>Both resolutions were extraordinarily open-ended</strong> — no geographic limits, no time limits, no specification of force levels, expiring only when the President unilaterally determined peace was assured. CON can argue these were delegations/abdications, not the kind of specific, constrained authorization that PRO's model contemplates.</p>\n</li>\n<li>\n<p><strong>Historical distance:</strong> Both were Cold War resolutions aimed at communist expansion. Their relevance to contemporary conflicts (non-state actors, cyber, etc.) is contested.</p>\n</li>\n</ol>\n<h2>Which Terminal State / Block This Affects</h2>\n<p>This evidence directly addresses the claim that <strong>\"Congress cannot act ex ante\"</strong> — a claim that reportedly contributed to PRO losses in deep-clash rounds for lack of counterexamples. The Formosa Resolution is the strongest possible counterexample: Congress acted in 5 days, before any U.S. combat, at the President's explicit request, for the stated purpose of deterrence. The Middle East Resolution reinforces the pattern at regional scale. Together, they show that:</p>\n<ul>\n<li>Congress CAN act before hostilities (speed: 5 days and 9 weeks)</li>\n<li>Presidents HAVE sought ex-ante authorization (Eisenhower set the precedent)</li>\n<li>The national security establishment HAS treated this as the governing model (LBJ's team followed it)</li>\n</ul>\n<p><strong>Block affected:</strong> This primarily reinforces PRO's argument that congressional authorization is <em>practicable</em> — it has been done, it can be done again. It also supports PRO's deterrence advantage argument: Eisenhower believed ex-ante congressional authorization strengthened deterrence by signaling national unity.</p>\n<p><strong>Terminal state affected:</strong> If the Formosa/Middle East precedents are credited, the \"Congress cannot act fast enough / cannot act ex ante\" terminal defense for CON collapses — or at minimum, must be qualified to \"Congress <em>usually</em> does not act ex ante\" or \"Congress <em>has not recently</em> acted ex ante,\" which is a weaker claim.</p>"}, {"id": "d41", "title": "Card: ticket-2-boland-ostp-1", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card: Boland Amendment — Enforcement Failure (Iran-Contra Evasion)</h1>\n<h2>Cut Card (PRO enforcement-counterexample)</h2>\n<h3>Quote</h3>\n<blockquote>\n<p>\"The Enterprise, functioning largely at North's direction, had its own airplanes, pilots, airfield, operatives, ship, secure communications devices, and secret Swiss bank accounts. For 16 months, it served as the secret arm of the N.S.C. staff, carrying out with private and non-appropriated money, and without the accountability or restrictions imposed by law on the CIA, a covert Contra aid program that Congress thought it had prohibited.\"</p>\n<p>\"It was an evasion of the Constitution's most basic check on executive action — the power of the Congress to grant or deny funding for Government programs.\"</p>\n</blockquote>\n<h3>Citation</h3>\n<p>Report of the Congressional Committees Investigating the Iran-Contra Affair (Majority Report), Executive Summary, November 18, 1987. Published by the U.S. Senate Select Committee on Secret Military Assistance to Iran and the Nicaraguan Opposition and the U.S. House Select Committee to Investigate Covert Arms Transactions with Iran. URL: https://www.presidency.ucsb.edu/documents/excerpts-the-report-congressional-committees-investigating-the-iran-contra-affair</p>\n<h3>Grade: A</h3>\n<p>The source is the official Congressional investigative report — the highest-authority fact-finding document on the topic. The quoted language is from the majority report's executive summary.</p>\n<h3>Vulnerable To</h3>\n<ol>\n<li>\n<p><strong>The Amendment's text may not have covered the NSC.</strong> The Pepperdine Law Review (1990) analysis establishes that the 1984 Boland Amendment's phrase \"agency or entity of the United States involved in intelligence activities\" was a statutory term of art that did NOT include the NSC. If the Amendment genuinely didn't apply to the NSC, then the \"Enterprise\" wasn't evading a binding restriction — it was operating in a legal gray zone Congress created through ambiguous drafting. The majority report's claim that the Enterprise carried out \"a covert Contra aid program that Congress thought it had prohibited\" may thus overstate: Congress <em>intended</em> to prohibit it but arguably failed to write text that actually did.</p>\n</li>\n<li>\n<p><strong>The Amendment was ambiguous by design.</strong> Rep. Sam Gejdenson (D-Conn.) admitted: \"We were trying to put together a package that could withstand a very popular President, and some of us said when they were written that they weren't tight enough.\" He added: \"We had to give people some protection. They couldn't go back to their district and just say, 'I want to cut off aid because it's dumb policy.'\" (Quoted in the Pepperdine article). This suggests Congress deliberately passed vague legislation for political cover, undermining the claim that the executive \"evaded\" clearly binding law.</p>\n</li>\n<li>\n<p><strong>No one was successfully prosecuted for violating the Boland Amendment itself.</strong> The CS Monitor (Jan. 5, 1993) reports the special prosecutor was \"unable to invoke the Boland amendment directly\" and relied instead on conspiracy, obstruction, and perjury charges. The main Boland-related charges against North and Poindexter were dropped.</p>\n</li>\n<li>\n<p><strong>The Iran-Contra affair cuts the other way for PRO.</strong> The fact that the Reagan administration found workarounds — third-country solicitation, private fundraising, the \"Enterprise\" — demonstrates that an executive determined to pursue a foreign policy objective can route around a funding restriction. The Boland Amendment is arguably the strongest possible counterexample to the claim that appropriations conditions effectively bind the executive branch.</p>\n</li>\n</ol>\n<hr />\n<h2>Counter-Evidence Note (honest weighing)</h2>\n<p>The Boland Amendment, despite being the most prominent congressional effort to constrain presidential foreign policy through the power of the purse, comprehensively failed as a binding constraint:</p>\n<ol>\n<li>\n<p><strong>Workaround #1 — Third-country funding.</strong> President Reagan and his NSC staff solicited $34 million from Saudi Arabia and other countries after Congress cut off appropriations. As the Congressional report states: \"Denied funding by Congress, the President turned to third countries and private sources.\"</p>\n</li>\n<li>\n<p><strong>Workaround #2 — Private fundraising.</strong> North and Carl \"Spitz\" Channell raised $10 million from private donors through a tax-exempt organization, using White House briefings and photo opportunities with the President as inducements.</p>\n</li>\n<li>\n<p><strong>Workaround #3 — The Iran arms-sales diversion.</strong> Profits from secret arms sales to Iran were diverted to fund the Contras — approximately $3.5 million.</p>\n</li>\n<li>\n<p><strong>Workaround #4 — NSC legal loophole.</strong> The administration shifted operational control from the CIA (clearly covered) to the NSC (arguably not covered), exploiting statutory ambiguity.</p>\n</li>\n<li>\n<p><strong>Legal unenforceability.</strong> Morton Halperin (former NSC staff, Carnegie Endowment) stated: \"The problem with general laws like these is that the executive branch is supposed to be bound by them, but that doesn't make individuals who violate them liable, criminally or civilly... The truth is that Congress was not as explicit as it should have been about making violations [of these laws] a criminal offense.\" (CS Monitor, Jan. 5, 1993)</p>\n</li>\n<li>\n<p><strong>Constitutional challenge.</strong> The Reagan administration advanced the argument — and the GAO reports the OSTP made the same argument against the Wolf Amendment — that Congress cannot use the appropriations power to infringe on the President's exclusive constitutional authority in foreign affairs. The Pepperdine Law Review (1990) concluded that if the Amendment had been interpreted to cover the NSC and the President's staff, \"it amounted to an unconstitutional congressional effort.\"</p>\n</li>\n</ol>\n<h3>Bottom line for the topic</h3>\n<p>The Boland Amendment is simultaneously the best evidence PRO can cite (Congress <em>tried</em> to bind the executive through funding) and the best evidence CON can cite (the executive comprehensively evaded it through multiple channels). For PRO to win on this card, they must argue that the Amendment's failure was a function of bad drafting rather than an inherent limitation of the appropriations power — and that better-drafted funding statutes (like the Wolf Amendment) have been more effective. But the Iran-Contra Committees themselves called the evasion of the Boland Amendment \"an evasion of the Constitution's most basic check on executive action,\" which implies that the check <em>failed</em> — not that it worked.</p>"}, {"id": "d42", "title": "Card: ticket-2-boland-ostp-2", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card: Wolf Amendment (OSTP-China Funding Restriction) — Did It Bind?</h1>\n<h2>Card 2A: The Wolf Amendment HAS Bound — GAO Finding of Violation by OSTP</h2>\n<h3>Quote</h3>\n<blockquote>\n<p>\"We conclude that OSTP's use of appropriations to fund its participation in the Innovation Dialogue and the S&amp;ED violated the prohibition in section 1340. In addition, because section 1340 prohibited the use of OSTP's appropriations for this purpose, OSTP's involvement in the Innovation Dialogue and the S&amp;ED resulted in obligations in excess of appropriated funds available to OSTP; as such, OSTP violated the Antideficiency Act.\"</p>\n<p>\"OSTP does not deny that it engaged in activities prohibited by section 1340... OSTP argues, instead, that section 1340, as applied to the events at issue here, is an unconstitutional infringement on the President's constitutional prerogatives in foreign affairs.\"</p>\n<p>\"It is not our role nor within our province to opine upon or adjudicate the constitutionality of duly enacted statutes such as section 1340... In our view, legislation that was passed by Congress and signed by the President, thereby satisfying the Constitution's bicameralism and presentment requirements, is entitled to a heavy presumption in favor of constitutionality.\"</p>\n</blockquote>\n<h3>Citation</h3>\n<p>U.S. Government Accountability Office, B-321982, \"Office of Science and Technology Policy—Bilateral Activities with China,\" October 11, 2011. URL: https://www.gao.gov/assets/2012lawforum.pdf (pp. 1-4 of the opinion letter). Also reported at: SpacePolicyOnline.com, \"GAO Finds that OSTP Violated Law in Talking to China,\" Dec. 5, 2011, https://spacepolicyonline.com/news/gao-finds-that-ostp-violated-law-in-talking-to-china/</p>\n<h3>Grade: A</h3>\n<p>The GAO is the authoritative federal auditing agency. This is a formal legal opinion by the Comptroller General's office, directly addressing the enforceability of a congressional funding restriction. The finding is unambiguous.</p>\n<h3>Vulnerable To</h3>\n<ol>\n<li>\n<p><strong>OSTP openly defied the restriction — and nothing happened.</strong> The GAO \"found\" a violation and told OSTP to report it. But no one was prosecuted, fined, or removed. The OSTP Director (John Holdren) continued serving until 2017. The violation demonstrates that the binding mechanism is <em>bureaucratic reporting</em>, not genuine constraint. A determined executive can violate the restriction and live with the paperwork.</p>\n</li>\n<li>\n<p><strong>OSTP's constitutional argument is serious.</strong> The Department of Justice's Office of Legal Counsel (OLC) issued an opinion on September 19, 2011, concluding that Section 1340 was unconstitutional as applied to the President's diplomatic activities. The DOJ characterized section 1340 as a \"valid limitation on OSTP's use of appropriated funds only to the extent that its restrictions do not infringe upon the President's exclusive constitutional authority over international diplomacy.\" The GAO explicitly declined to adjudicate this constitutional question. If the OLC is correct, the Wolf Amendment cannot constitutionally bind executive diplomatic communications — which is the exact same argument the Reagan administration made about the Boland Amendment.</p>\n</li>\n<li>\n<p><strong>The Wolf Amendment has exceptions that the executive can use.</strong> The statute itself allows activities certified by the agency (with FBI consultation) as posing no technology-transfer risk and not involving human-rights-violating officials. NASA used this exception in 2019 for the Chang'e 4 mission collaboration. This means the Amendment is a procedural hurdle, not an absolute bar — the executive can route around it through certification.</p>\n</li>\n</ol>\n<hr />\n<h2>Card 2B: The Wolf Amendment Has NOT Bound — NASA Actively Seeks Ways Around It</h2>\n<h3>Quote</h3>\n<blockquote>\n<p>\"Over 14 years after the amendment was enacted, if the Wolf Amendment has served any purpose, it has been to push China-US space cooperation into a deadlock. It has not curtailed the rapid development of Chinese space technology, nor has it hindered the rise of China's space industry. Instead, it has increasingly trapped the US in a web of its own making, placing it in an awkward position.\"</p>\n<p>\"NASA recently emailed planetary scientists saying that it had sent the necessary certification to Congress and agency-funded researchers could apply to the China National Space Administration to use samples of the lunar soil for research.\" (China Daily, Dec. 11, 2023)</p>\n</blockquote>\n<h3>Citation (primary):</h3>\n<p>China Daily, \"NASA opening door would be boon for global space research,\" December 11, 2023. URL: https://global.chinadaily.com.cn/a/202312/11/WS65765a50a31040ac301a710a.html</p>\n<h3>Citation (supporting — NASA seeking access to Chinese samples):</h3>\n<p>Space.com, \"China is sharing priceless moon samples with international partners, but NASA can't be a part of it,\" by Keith Cooper, published 2024. URL: https://www.space.com/astronomy/moon/china-is-sharing-priceless-moon-samples-with-international-partners-but-nasa-cant-be-a-part-of-it</p>\n<h3>Grade: B</h3>\n<p>China Daily is a state-affiliated outlet and carries pro-China framing bias. However, the factual core — that NASA sought and obtained certification to collaborate on Chang'e 5 samples, that the Amendment has not stopped Chinese space development — is corroborated by independent Western sources (Space.com, SpaceNews, the GAO opinion).</p>\n<h3>Vulnerable To</h3>\n<ol>\n<li>\n<p><strong>The Amendment actually DID bind NASA for over a decade.</strong> Between 2011 and 2019 there was essentially zero bilateral NASA-China cooperation. The 2019 Chang'e 4 collaboration was the sole exception and required explicit Congressional authorization. The fact that NASA had to seek Congressional permission proves the Amendment <em>did</em> constrain — NASA couldn't just do it.</p>\n</li>\n<li>\n<p><strong>The Amendment's procedural burden is the constraint.</strong> The requirement of FBI certification and Congressional notification functions as a \"speedbump\" (American Security Project, 2024: \"the law is a significant 'speedbump' to collaboration by requiring investigations by the FBI and Congressional approval\"). This procedural friction is itself a form of binding — it makes cooperation costly and politically visible.</p>\n</li>\n<li>\n<p><strong>NASA's willingness to work within the Amendment's framework suggests acceptance of its binding character.</strong> NASA didn't challenge the Amendment's constitutionality (unlike OSTP). It sought the certification path. This implies NASA treats the restriction as legally binding.</p>\n</li>\n</ol>\n<hr />\n<h2>Counter-Evidence: Parallels Between Boland and Wolf</h2>\n<p>Both funding restrictions exhibit the same structural vulnerabilities:</p>\n<ol>\n<li>\n<p><strong>Constitutional challenge:</strong> OSTP made the identical argument the Reagan administration made about Boland — that Congress cannot use appropriations to infringe the President's exclusive foreign-affairs authority. The DOJ OLC endorsed this view for Wolf (2011) just as it was advanced for Boland (1985-87).</p>\n</li>\n<li>\n<p><strong>Workaround mechanisms:</strong> Boland was evaded through private/third-country funding and NSC jurisdictional games. The Wolf Amendment has its own workaround — the certification exception — and commercial entities (Nanoracks) found \"back doors\" by operating privately without appropriated funds.</p>\n</li>\n<li>\n<p><strong>No criminal penalties:</strong> Like Boland, the Wolf Amendment carries no criminal penalty. The GAO finding that OSTP violated the Anti-Deficiency Act is a bureaucratic finding, not a prosecutable offense. The \"binding\" character of these statutes depends entirely on executive branch willingness to comply.</p>\n</li>\n<li>\n<p><strong>The foreign policy objective proceeds anyway:</strong> Boland failed to stop Contra support. The Wolf Amendment failed to stop Chinese space development — China built its own space station (Tiangong), landed on the far side of the Moon, and returned lunar samples, all while excluded from U.S. cooperation.</p>\n</li>\n</ol>\n<hr />\n<h2>Bottom Line for the Topic</h2>\n<p>The Wolf Amendment is the stronger PRO card relative to Boland: it actually bound NASA for ~8 years (2011-2019) with near-zero cooperation, and when cooperation occurred it went through the Amendment's procedural framework. But the OSTP violation shows the limit — the executive branch, when it wants to, will simply assert constitutional prerogative and defy the restriction. And the Amendment has demonstrably failed to achieve its policy goal of constraining China's space program. For CON, the Wolfs-Boland parallel is powerful: funding statutes create political friction but do not ultimately stop a determined executive from pursuing its foreign policy objectives.</p>"}, {"id": "d43", "title": "Card: ticket-2-boland-ostp-summary", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Ticket 2: Research Summary — Boland Amendment &amp; Wolf Amendment</h1>\n<h2>What I Found</h2>\n<h3>Boland Amendment (Nicaragua, 1982-1986)</h3>\n<p><strong>The PRO story (funding statutes can constrain):</strong> Congress passed three increasingly restrictive Boland Amendments between 1982 and 1984. The 1984 version cut off all appropriated funds for Contra military/paramilitary operations. The Amendment was signed into law by President Reagan on October 12, 1984. The Congressional Iran-Contra Committees' majority report (November 18, 1987) found that the Reagan administration's evasion of the Boland Amendment constituted \"an evasion of the Constitution's most basic check on executive action — the power of the Congress to grant or deny funding for Government programs.\"</p>\n<p><strong>The CON story (funding statutes do not bind):</strong> The Boland Amendment comprehensively failed. The Reagan administration used at least four workaround channels: (1) $34 million solicited from Saudi Arabia and other third countries; (2) $2.7 million raised from private donors through White House-coordinated fundraising; (3) approximately $3.5 million diverted from secret Iran arms sales; (4) shifting operations from the CIA (clearly covered) to the NSC (arguably not covered). No one was successfully prosecuted for violating the Boland Amendment itself — the special prosecutor had to rely on conspiracy, obstruction, and perjury charges. The main Boland-related conspiracy charges against North and Poindexter were dropped before trial. All convictions were either overturned on appeal or pardoned by President George H.W. Bush (December 24, 1992).</p>\n<p><strong>The honest middle:</strong> The Boland Amendment <em>did</em> constrain — it forced the administration to go underground, raising the political and operational costs of supporting the Contras. But the Amendment <em>did not</em> stop Contra support. The question for debate is whether \"constraint\" means \"making it harder\" or \"preventing entirely.\" The Boland evidence supports \"harder\" but not \"preventing.\"</p>\n<h3>Wolf Amendment (OSTP/NASA-China, 2011-present)</h3>\n<p><strong>The PRO story (funding statutes can constrain):</strong> The Wolf Amendment (Section 1340 of Pub. L. 112-10, April 15, 2011) prohibited NASA and OSTP from using appropriated funds for bilateral cooperation with China. It effectively froze NASA-China cooperation from 2011 to 2019. The GAO issued a formal opinion (B-321982, October 11, 2011) finding that OSTP violated Section 1340 and the Anti-Deficiency Act by spending ~$3,500 on bilateral meetings with Chinese officials in May 2011. The only NASA-China cooperation during the Amendment's life (the 2019 Chang'e 4 lunar mission monitoring) went through the Amendment's explicit certification framework with Congressional approval.</p>\n<p><strong>The CON story (funding statutes do not bind):</strong> The OSTP openly defied the Amendment in 2011, arguing (with DOJ OLC backing) that it was an unconstitutional infringement on the President's foreign-affairs authority. Nothing happened to OSTP Director John Holdren — no prosecution, no removal. The Amendment failed to achieve its stated goals: it did not stop Chinese space development (China built Tiangong, landed on the Moon's far side, returned lunar samples), and commercial entities found workarounds (Nanoracks placed a Chinese experiment on the ISS using private funding, not appropriated funds). NASA itself has sought ways around the Amendment — lobbying Congress for access to Chinese lunar samples in 2023.</p>\n<h3>Key Parallel Between Boland and Wolf</h3>\n<p>Both amendments exhibit the same structural vulnerabilities:\n- The executive branch advances a constitutional challenge (Congress cannot use appropriations to control foreign policy)\n- Workarounds exist (private funding, third-party channels, certification exceptions)\n- No criminal penalties attach to violations\n- The underlying foreign policy objective proceeds despite the restriction</p>\n<hr />\n<h2>What I Could NOT Verify</h2>\n<ol>\n<li>\n<p><strong>Whether the Wolf Amendment has ever been formally litigated in federal court.</strong> My research found no judicial opinion on the Amendment's constitutionality. The GAO opinion (2011) explicitly noted: \"we are unaware of any court that has had occasion to review the provision, let alone adjudicate its constitutionality.\" This means the constitutional question — whether Congress can use appropriations to restrict the President's diplomatic communications — remains unresolved. For debate purposes, both sides can claim the law is on their side.</p>\n</li>\n<li>\n<p><strong>The exact scope of NASA-China interactions that have been blocked.</strong> While it's clear the Amendment stopped formal bilateral programs, I could not verify whether informal or indirect collaborations continued. The Nanoracks example suggests some workarounds exist through commercial channels.</p>\n</li>\n<li>\n<p><strong>Whether the Boland Amendment was ever formally adjudicated.</strong> The Pepperdine Law Review (1990) analysis notes: \"the Amendment will likely never be litigated on its merits.\" The closest judicial engagement was in United States v. North, where the special prosecutor dropped the conspiracy-to-violate-Boland charges before trial, and the court never ruled on whether the Amendment applied to the NSC or was constitutional.</p>\n</li>\n<li>\n<p><strong>Total dollar amounts diverted through Iran-Contra.</strong> Sources vary: the Congressional report cites ~$3.5 million diverted to the Contras from Iran arms sales, $34 million from third countries, and $2.7 million from private donors. The CS Monitor (1993) cites $14 million diverted. These discrepancies reflect classification issues and incomplete accounting. For debate, the exact amount doesn't matter — the existence of the diversions is the key fact.</p>\n</li>\n<li>\n<p><strong>Whether OSTP has violated the Wolf Amendment since 2011.</strong> The 2011 violation is documented. I could not verify subsequent violations through open-source research. The GAO finding and its lack of consequences (Holdren remained in office) may have either deterred or encouraged further violations — the evidence doesn't tell us which.</p>\n</li>\n</ol>\n<hr />\n<h2>Terminal State / Block Affected</h2>\n<p>This ticket primarily affects the <strong>PRO enforcement counterexample block</strong>: the argument that funding statutes have successfully bound presidents in foreign policy.</p>\n<ul>\n<li>\n<p><strong>Boland:</strong> Weakens PRO's claim. The Amendment was evaded through multiple channels, no one was punished for violating it, and the underlying policy (Contra support) continued. PRO can still argue the Amendment <em>constrained</em> (raised costs, forced secrecy) but cannot argue it <em>prevented</em>.</p>\n</li>\n<li>\n<p><strong>Wolf:</strong> A mixed card. It shows a funding restriction that actually bound NASA for years — the stronger PRO example. But the OSTP violation and the Amendment's failure to achieve its policy goals provide CON with rebuttal evidence. The constitutional challenge advanced identically in both Boland and Wolf contexts suggests a structural problem with appropriations-based foreign policy constraints.</p>\n</li>\n<li>\n<p><strong>Secondary effect on CON:</strong> The Iran-Contra story is a powerful CON narrative: Congress passed a law, the President evaded it, and faced limited consequences. But the CON debater must be careful — the Congressional committees <em>did</em> find violations, people <em>were</em> convicted (even if on collateral charges), and the scandal was politically damaging to the Reagan administration. This is not a clean \"funding statutes don't matter\" card; it's evidence that they matter politically even when they fail legally.</p>\n</li>\n<li>\n<p><strong>Tertiary effect on framework:</strong> The Boland/Wolf parallel suggests the debate comes down to whether \"constraint\" means legal binding (which these statutes arguably lack) or political friction (which they demonstrably create). Both sides have credible evidence.</p>\n</li>\n</ul>"}, {"id": "d44", "title": "Card: ticket-3-block-provenance-dellinger-olc", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card: Dellinger OLC Opinions — Commander-in-Chief Exception to Congressional War-Powers Statutes</h1>\n<h2>Source A: Presidential Authority to Decline to Execute Unconstitutional Statutes (1994)</h2>\n<p><strong>Author:</strong> Walter Dellinger, Assistant Attorney General, Office of Legal Counsel, U.S. Department of Justice</p>\n<p><strong>Publication:</strong> Memorandum Opinion for the Counsel to the President, 18 Op. O.L.C. 199 (Nov. 2, 1994)</p>\n<p><strong>URL (official DOJ archive):</strong> https://www.justice.gov/sites/default/files/olc/legacy/2014/01/29/op-olc-18.pdf (see pp. 199–211)</p>\n<p><strong>URL (CourtListener backup):</strong> https://www.courtlistener.com/opinion/4342469/presidential-authority-to-decline-to-execute-unconstitutional-statutes/</p>\n<hr />\n<h3>VERBATIM (Propositions 6 and surrounding text):</h3>\n<blockquote>\n<p>\"6. The President has enhanced responsibility to resist unconstitutional provisions that encroach upon the constitutional powers of the Presidency. Where the President believes that an enactment unconstitutionally limits his powers, he has the authority to defend his office and decline to abide by it, unless he is convinced that the Court would disagree with his assessment. If the President does not challenge such provisions (i.e., by refusing to execute them), there often will be no occasion for judicial consideration of their constitutionality; a policy of consistent Presidential enforcement of statutes limiting his power thus would deny the Supreme Court the opportunity to review the limitations and thereby would allow for unconstitutional restrictions on the President's authority.\"</p>\n<p>\"Some legislative encroachments on executive authority, however, will not be justiciable or are for other reasons unlikely to be resolved in court. If resolution in the courts is unlikely and the President cannot look to a judicial determination, he must shoulder the responsibility of protecting the constitutional role of the presidency. <strong>This is usually true, for example, of provisions limiting the President's authority as Commander in Chief. Where it is not possible to construe such provisions constitutionally, the President has the authority to act on his understanding of the Constitution.</strong>\"</p>\n</blockquote>\n<hr />\n<h2>Source B: Proposed Deployment of United States Armed Forces into Bosnia (1995)</h2>\n<p><strong>Author:</strong> Walter Dellinger, Assistant Attorney General, Office of Legal Counsel, U.S. Department of Justice</p>\n<p><strong>Publication:</strong> Memorandum Opinion for the Counsel to the President, 19 Op. O.L.C. 327 (Nov. 30, 1995)</p>\n<p><strong>URL (DOJ PDF):</strong> https://www.justice.gov/sites/default/files/olc/opinions/1995/11/31/op-olc-v019-p0327_0.pdf</p>\n<hr />\n<h3>VERBATIM:</h3>\n<blockquote>\n<p>\"The President, acting without specific statutory authorization, may lawfully introduce United States ground troops into Bosnia in order to assist the North Atlantic Treaty Organization to ensure compliance with a peace agreement. We believe that the President may act unilaterally in the circumstances here.\"</p>\n<p>\"The Executive Branch has traditionally taken the position that the President's power to deploy armed forces into situations of actual or indicated hostilities is not restricted to the three categories specifically marked out by the Resolution.\"</p>\n<p>\"In deciding whether the proposed deployment of ground troops into Bosnia would amount to a 'war' in the constitutional sense, considerable weight should be given to the consensual nature and protective purposes of the operation. The deployment is intended to be a limited mission that will ensure stability while the peace agreement is put into effect. Because the mission is in support of an agreement that the warring parties have reached and is at the invitation of those parties, it is reasonably possible that little or no resistance to the deployment will occur. The operation does not aim at the conquest or occupation of territory nor even, as did the planned Haitian intervention, at imposing through military means a change in the character of a political régime. Although combat conceivably may occur during the course of the operation, it is not likely that the United States will find itself involved in extensive or sustained hostilities.\"</p>\n<p>\"Historical practice supplies numerous cases in which Presidents, acting on the claim of inherent power, have introduced armed forces into situations in which they encountered, or risked encountering, hostilities, but which were not 'wars' in either the common meaning or the constitutional sense. As the Supreme Court observed in 1990, '[t]he United States frequently employs Armed Forces outside this country — over 200 times in our history — for the protection of American citizens or national security.' United States v. Verdugo-Urquidez (1990). In at least 125 instances, the President acted without express authorization from Congress.\"</p>\n</blockquote>\n<hr />\n<h2>SUMMARY FOR DEBATE USE:</h2>\n<p>Dellinger's twin OLC opinions establish the executive branch's formal legal theory that (a) the President may decline to enforce statutes that unconstitutionally encroach on Commander-in-Chief authority because such disputes are rarely justiciable, and (b) the President may unilaterally deploy forces abroad without congressional authorization when the operation is limited in scope, duration, and risk of sustained hostilities—i.e., does not amount to \"war\" in the constitutional sense. These opinions formed the legal backbone for Clinton's Bosnia and Haiti deployments and were later relied upon by the Obama administration for the Libya intervention.</p>\n<p><strong>Grade: A</strong> — Primary-source government documents from the DOJ Office of Legal Counsel, archived on justice.gov, with exact publication references (18 Op. O.L.C. 199; 19 Op. O.L.C. 327). Both opinions were fetched and verified this session via the CourtListener and OUP mirrors.</p>\n<p><strong>Vulnerable to:</strong>\n- These are executive-branch opinions, not judicial precedent; they represent the institutional position of OLC, not a court ruling.\n- The Bosnia opinion itself notes that the WPR \"presupposes the President's authority\" but does not itself grant it — a circular argument that assumes its conclusion.\n- Jack Goldsmith (Harvard Law, former OLC head) argues the Dellinger rationale became strained when applied to non-consensual interventions like Libya: \"characterizing the Libya intervention as not 'war' requires an expansion, possibly significant, of the Dellinger rationale.\"\n- The 1994 opinion's \"Commander in Chief\" exception was later cited by the Bush OLC to justify ignoring FISA and the torture statute — a consequence Dellinger himself publicly criticized, creating a tension between his 1994 institutional opinion and his later academic positions.</p>"}, {"id": "d45", "title": "Card: ticket-3-block-provenance-howell-pevehouse", "group": "Topic: war-powers-congressional-approval  ·  evidence cards", "html": "<h1>Card: Howell &amp; Pevehouse — Congress Constrains Presidential War Powers</h1>\n<p><strong>Authors:</strong> William G. Howell and Jon C. Pevehouse, Associate Professors, Irving B. Harris School of Public Policy, University of Chicago</p>\n<p><strong>Publication:</strong> <em>While Dangers Gather: Congressional Checks on Presidential War Powers</em> (Princeton University Press, 2007)</p>\n<p><strong>ISBN:</strong> 978-0-691-12515-2 (hardcover), 978-0-691-13462-8 (paperback)</p>\n<p><strong>Google Books:</strong> https://books.google.com/books?id=09M2M7KiuWYC</p>\n<p><strong>Awards:</strong> Co-Winner, 2008 Richard E. Neustadt Award (Presidency Research Section, APSA); Winner, 2007 D.B. Hardeman Prize (LBJ Foundation)</p>\n<hr />\n<h2>VERBATIM (Publisher's Summary / Book Jacket):</h2>\n<blockquote>\n<p>\"Nearly five hundred times in the past century, American presidents have deployed the nation's military abroad, on missions ranging from embassy evacuations to full-scale wars. The question of whether Congress has effectively limited the president's power to do so has generally met with a resounding 'no.' In <em>While Dangers Gather</em>, William Howell and Jon Pevehouse reach a very different conclusion.\"</p>\n<p>\"Among its conclusions: <strong>Presidents are systematically less likely to exercise military force when their partisan opponents retain control of Congress. The partisan composition of Congress, however, matters most for proposed deployments that are larger in size and directed at less strategically important locales. Moreover, congressional influence is often achieved not through bold legislative action but through public posturing — engaging the media, raising public concerns, and stirring domestic and international doubt about the United States' resolve to see a fight through to the end.</strong>\"</p>\n</blockquote>\n<hr />\n<h2>VERBATIM (Preface, pp. xiii–xxi):</h2>\n<blockquote>\n<p>\"Which branch of government takes us to war? The executive? Legislative? Or some combination of the two? The question runs deep. And for centuries scholars have sought answers...\"</p>\n<p>\"During the lead-up to a military venture, the discretion to use force obviously remains with a president who enjoys extraordinary powers, not least of which is the ability to act unilaterally. But the president's war powers also have limits, as Congress occasionally 'interferes' and 'hampers the executive' in ways that make the successful prosecution of a war immensely difficult. Congress matters, and matters greatly: to a nation's ability to credibly convey resolve to enemies and allies alike, to campaigns for public support, to the president's discretion over military decision making, and to the ultimate conduct of a military venture. Does the president or Congress ultimately decide whether we go to war? Obviously, they both do.\"</p>\n<p>\"This book does more than identify instances when Congress, with one carefully fired shot, fells a president. It documents those occasions when it maims him, when it grazes a limb, and perhaps most importantly, when a president walks away from a fight he feared losing. If we hold as our standard of proof the obliteration of White House military planning, we overlook the copious ways in which Congress influences presidential decisions about how often to use force, which kinds of foreign crises warrant actions and which kinds do not, the timing of a deployment, and its scope. The counterfactual to a world of congressional irrelevance does not require the elimination of the largest and most vital deployments from the historical record. Instead, the correct counterfactual may be a delayed deployment in some instances, a shorter one in others, or the reassignment of national priorities in others still.\"</p>\n<p>\"When members of Congress proclaim their reluctance to use force abroad, they may encourage U.S. adversaries who then fight longer and harder, just as they may influence the public's willingness to back their president. In either case, the president may have cause to scale back or even abandon a military venture, even though Congress has not passed a single bill or resolution that formally curtails his war powers. He does so, though, not so much because Congress itself matters, but rather because the actions that members take set in motion forces that materially impact his capacity to wage war successfully.\"</p>\n</blockquote>\n<hr />\n<h2>VERBATIM (Conclusion / Summary from Publisher — reflecting Ch. 8, p. 222ff):</h2>\n<p>The book \"systematically analyzes the last half-century of U.S. military policy\" and finds:</p>\n<blockquote>\n<p>\"Presidents are systematically less likely to exercise military force when their partisan opponents retain control of Congress.\"</p>\n</blockquote>\n<p>The authors argue that \"when it comes to 'wars of choice,' Congress's partisan composition influences whether the U.S. sends troops abroad, how likely the nation is to respond to a foreign crisis with f
